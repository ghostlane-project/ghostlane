			shellScript = "set -e\nexport PATH=\"$HOME/go/bin:/usr/local/go/bin:/opt/homebrew/bin:/usr/local/bin:$PATH\"\nif [ -z \"$ARCHS\" ] || [ \"$ARCHS\" = \"undefined_arch\" ]; then\n  export ARCHS=arm64\nfi\nGRADLE_VERSION_ARGS=\"\"\n# CI exports OLCBOX_VERSION. An archive made from Xcode does not, and without a\n# fallback the app's own about screen reads 1.0.0 out of gradle.properties while\n# its Info.plist carries the real version - the same disagreement that put 1.0.0\n# in the App Store, inverted. MARKETING_VERSION is exported into every build\n# phase, so the project file is the single place both numbers come from.\nolcbox_version=\"${OLCBOX_VERSION:-$MARKETING_VERSION}\"\nif [ -n \"$olcbox_version\" ]; then\n  GRADLE_VERSION_ARGS=\"-Polcbox.version=$olcbox_version\"\nfi\ncd \"$SRCROOT/..\"\n./gradlew $GRADLE_VERSION_ARGS :sharedUI:fetchCoresIosXcframework :sharedUI:buildOlcrtcIosXcframework :sharedUI:embedAndSignAppleFrameworkForXcode --no-configuration-cache\n";
