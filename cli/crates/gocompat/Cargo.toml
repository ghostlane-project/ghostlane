[package]
name = "ghostlane-gocompat"
version = "0.0.0"
edition = "2021"
rust-version = "1.96"
publish = false
description = "The bytes the Go ghostlane CLI writes (its YAML, its JSON, its timestamps), so that the Rust CLI reads and writes the same files and speaks the same control protocol"

[lib]
name = "gocompat"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
serde = "1"
serde_json = "1"
yaml-rust2 = { version = "0.13", default-features = false }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
