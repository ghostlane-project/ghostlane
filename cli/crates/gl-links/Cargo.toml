[package]
name = "ghostlane-links"
version = "0.0.0"
edition = "2021"
rust-version = "1.96"
publish = false
description = "the CLI's links, lists and crypt1, held to the app's vectors"

[lib]
name = "gl_links"
path = "src/lib.rs"

# Only what is already in cli/Cargo.lock. crypt1 is written here with sha2
# (SHA-256 and HMAC) and a table-driven AES-256 CBC, so no checksummed crypto
# crate has to be added to the lock.
[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
