# The Linux CLI, in Rust.
#
# The members are a glob: a later crate is a new directory under crates/ and
# no edit here, unless the program itself has to call it (then it is one line
# under [dependencies]).
[workspace]
members = ["crates/*"]
resolver = "3"

[package]
name = "ghostlane-cli"
version = "0.0.0"
edition = "2021"
rust-version = "1.96"
publish = false
description = "Ghostlane for Linux servers and boxes: the command line, the state files and the control socket"

[lib]
name = "ghostlane_cli"
path = "src/lib.rs"

[[bin]]
name = "ghostlane"
path = "src/main.rs"

# Few and common, and none that needs OpenSSL: the release targets are static
# musl binaries. ring (under rustls) has C and assembly, built with the cross
# compiler the core's build makes for the same targets.
[dependencies]
base64 = "0.22"
coreconfig = { package = "ghostlane-coreconfig", path = "crates/gl-coreconfig" }
gl_links = { package = "ghostlane-links", path = "crates/gl-links" }
gl_routes = { package = "ghostlane-routes", path = "crates/gl-routes" }
gocompat = { package = "ghostlane-gocompat", path = "crates/gocompat" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
# The list fetch: HTTPS with the roots built in (the image has no CA bundle).
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
