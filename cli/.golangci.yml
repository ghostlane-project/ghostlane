version: "2"
run:
  timeout: 5m
  tests: true
  build-tags:
    - with_utls
    - with_quic
linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - errorlint
    - gocritic
    - misspell
    - unconvert
    - bodyclose
    - revive
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
