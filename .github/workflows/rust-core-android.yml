name: Rust core for Android

# Phase 1 of the Android move to the Rust core: libghostlane_core.so (with the
# `boring` feature) for arm64-v8a, armeabi-v7a and x86_64 from the pin in
# scripts/ghostlane-core-pin.sh, built by scripts/build-ghostlane-core-android.sh
# with the NDK the app pins; the report (sizes, 16 KiB alignment, imports,
# BoringSSL) in the job summary, the libraries and the UniFFI Kotlin bindings as
# an artifact; then an instrumented smoke test on an x86_64 emulator (4 KiB and
# 16 KiB pages): load, start the xray core from a minimal config, a SOCKS
# connection through it, stop; the olcRTC client object made and closed.
#
# Phase 2 (the app's VpnService on this core, behind a switch that is off by
# default): job `app` builds the app's debug APK with the core and the UniFFI
# bindings packed in (-PghostlaneCoreDir) plus its androidTest APK, and reports
# the core's size inside the APK per ABI.
#
# K3, the emulator matrix: job `e2e` runs on x86_64 emulators of API 23, 24,
# 29, 34 and 35, and 35 with 16 KiB pages, one leg each:
#   - scripts/rust-core-android-e2e.sh: every test class of the app's
#     androidTestRustcore package, found in the package itself (a class added
#     there runs with no edit here), with the Rust switch on; a class that
#     fails or did not run fails the leg;
#   - scripts/rust-core-android-kill.sh: a session started outside any
#     instrumentation on a VLESS REALITY line to an official Xray server on the
#     runner (scripts/xray-servers.txt, by hash), SIGKILL to the app's process,
#     and two cells: Android's own restart of the service within 90 s (the
#     service answers START_REDELIVER_INTENT), red when it did not happen; and
#     the session down with the process and back in a new one, by Android or
#     else by the next start, a fetch through the tun before and after.
# Job `k3` puts every class and both cells of the kill on every leg in one
# table and fails on any cell that did not pass, a leg that left no result
# included.
#
# The soak (job `soak`, only by workflow_dispatch with soak=true): one session
# on that line for soak_minutes (120) on API 35 under traffic, `dumpsys
# meminfo` every minute; the curve and its verdict in the job summary
# (scripts/rust-core-android-soak.sh).
#
# Emulator only: no device, no store track, no live carrier room. The one
# secret is the crypt1 client key of the lab APK step.
# Runs on rust/all and on pull requests into it, when what it builds or reads
# changed, or by hand; never on main and never on every push to a task branch.
on:
  push:
    branches:
      - rust/all
    paths:
      - .github/workflows/rust-core-android.yml
      - scripts/ghostlane-core-pin.sh
      - scripts/ghostlane-core-resolve.sh
      - scripts/build-ghostlane-core-android.sh
      - 'scripts/rust-core-android-*.sh'
      - scripts/rust-core-android-host.py
      - scripts/xray-servers.txt
      - scripts/fetch-xray-servers.sh
      - scripts/olcrtc-pin.sh
      - scripts/cores-pins.sh
      - 'lab/rust-core-android/**'
      - 'androidApp/**'
      - 'sharedUI/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - gradle.properties
  pull_request:
    branches:
      - rust/all
    paths:
      - .github/workflows/rust-core-android.yml
      - scripts/ghostlane-core-pin.sh
      - scripts/ghostlane-core-resolve.sh
      - scripts/build-ghostlane-core-android.sh
      - 'scripts/rust-core-android-*.sh'
      - scripts/rust-core-android-host.py
      - scripts/xray-servers.txt
      - scripts/fetch-xray-servers.sh
      - scripts/olcrtc-pin.sh
      - scripts/cores-pins.sh
      - 'lab/rust-core-android/**'
      - 'androidApp/**'
      - 'sharedUI/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - gradle.properties
  workflow_dispatch:
    inputs:
      pin:
        description: Build this commit of the core (40 hex) instead of the pin in scripts/ghostlane-core-pin.sh
        type: string
        default: ''
      soak:
        description: Also run the soak (one session on the Rust core under traffic, meminfo every minute)
        type: boolean
        default: false
      soak_minutes:
        description: How long the soak runs, in minutes
        type: string
        default: '120'

permissions:
  contents: read

concurrency:
  group: rust-core-android-${{ github.ref }}
  cancel-in-progress: true

env:
  # androidApp/build.gradle.kts ndkVersion (and release.yml's).
  ANDROID_NDK_VERSION: "28.2.13676358"
  EMULATOR_API: "35"

jobs:
  build:
    name: Build ghostlane-core for Android (boring)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install the NDK
        run: sdkmanager "ndk;${ANDROID_NDK_VERSION}" > /dev/null

      - name: Build tools (cmake and clang for BoringSSL's build)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends cmake clang libclang-dev
          cmake --version | head -1; clang --version | head -1

      - name: Restore the cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            out/core/src/target
          key: rust-core-android-${{ hashFiles('scripts/ghostlane-core-pin.sh') }}${{ github.event_name == 'workflow_dispatch' && inputs.pin || '' }}
          restore-keys: rust-core-android-

      - name: Build
        env:
          GHOSTLANE_CORE_PIN_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.pin || '' }}
        run: |
          set +e -uo pipefail
          bash scripts/build-ghostlane-core-android.sh out/core 2>&1 | tee out-build.log
          rc=${PIPESTATUS[0]}
          mkdir -p out/core
          {
            echo '### ghostlane-core for Android'
            echo '```'
            cat out/core/report.txt 2> /dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ $rc -eq 0 ] || { tail -80 out-build.log; exit $rc; }

      - name: Save the cargo cache
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            out/core/src/target
          key: rust-core-android-${{ hashFiles('scripts/ghostlane-core-pin.sh') }}${{ github.event_name == 'workflow_dispatch' && inputs.pin || '' }}

      - name: Artifact (without the source and the target directory)
        run: |
          mkdir -p artifact
          cp -r out/core/jniLibs out/core/kotlin out/core/checks out/core/report.txt artifact/
          cp out-build.log artifact/ 2> /dev/null || true
          find artifact -name '*.so' -exec ls -l {} +

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ghostlane-core-android
          path: artifact/
          retention-days: 14

  smoke:
    name: Smoke test on the x86_64 emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ghostlane-core-android
          path: out/core

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: The lab app and its test APK
        run: |
          set -euo pipefail
          ./gradlew -p lab/rust-core-android assembleDebug assembleDebugAndroidTest -PghostlaneCoreDir="$GITHUB_WORKSPACE/out/core" 2>&1 | tail -80
          app=$(find lab/rust-core-android/build/outputs/apk/debug -name '*-debug.apk' | head -1)
          unzip -l "$app" | grep 'lib/' | tee out-apk-libs.txt
          for abi in x86_64 arm64-v8a armeabi-v7a; do
            for lib in libghostlane_core.so libjnidispatch.so; do
              grep -q "lib/$abi/$lib" out-apk-libs.txt || { echo "APK: no lib/$abi/$lib"; exit 1; }
            done
          done

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test (x86_64, 4 KiB pages)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 900
          ram-size: 4096M
          script: bash scripts/rust-core-android-smoke.sh out/smoke-4k

      - name: Smoke test (x86_64, 16 KiB pages)
        if: ${{ !cancelled() }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API }}
          arch: x86_64
          target: google_apis_ps16k
          disable-animations: true
          emulator-boot-timeout: 900
          ram-size: 4096M
          script: bash scripts/rust-core-android-smoke.sh out/smoke-16k

      - name: Summary
        if: always()
        run: |
          for d in smoke-4k smoke-16k; do
            [ -f "out/$d/results.txt" ] || { echo "### $d: no results" >> "$GITHUB_STEP_SUMMARY"; continue; }
            { echo "### Smoke ($d)"; echo '```'; cat "out/$d/results.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
          exit 0

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-core-android-smoke
          path: out/smoke-*
          retention-days: 14

  app:
    name: The app with the Rust core (debug APK)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_NDK_VERSION: "28.2.13676358"
      XRAY_VERSION: "26.7.11"
    steps:
      - name: Checkout the app
        uses: actions/checkout@v7
        with:
          path: olcbox

      - uses: actions/download-artifact@v8
        with:
          name: ghostlane-core-android
          path: olcbox/out/core

      # The Go engine every build still carries (the switch is off by default):
      # resolved and built as pr-checks.yml's Gradle checks do.
      - name: Resolve the engine pin
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          olcbox/scripts/olcrtc-pin.sh > "$RUNNER_TEMP/pin.out"
          cat "$RUNNER_TEMP/pin.out" >> "$GITHUB_OUTPUT"

      - name: Checkout olcrtc
        uses: actions/checkout@v7
        with:
          repository: ghostlane-project/olcrtc
          ref: ${{ steps.pin.outputs.olcrtc_sha }}
          path: olcrtc
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.pin.outputs.go_version }}
          cache-dependency-path: olcrtc/go.sum

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}" > /dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Go mobile tooling
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install github.com/magefile/mage@latest

      - name: Initialize gomobile
        working-directory: olcrtc
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          gomobile init

      - name: Debug APK and test APK, with the core
        working-directory: olcbox
        run: |
          set -euo pipefail
          export OLCRTC_REPO="${{ github.workspace }}/olcrtc"
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          # The whole log in a file: a stack trace alone would fill any tail, and the
          # compiler's own lines (e: and w:) are what a red build is read by.
          log="$RUNNER_TEMP/gradle-app.log"
          if ./gradlew :androidApp:assembleGithubDebug :androidApp:assembleGithubDebugAndroidTest \
            -PghostlaneCoreDir="$GITHUB_WORKSPACE/olcbox/out/core" --stacktrace > "$log" 2>&1; then
            tail -60 "$log"
          else
            grep -E '^(e|w): |What went wrong|^> ' "$log" | head -120 || true
            grep -v -E '^\s+at |^\s+\.\.\. [0-9]+ more' "$log" | tail -60
            exit 1
          fi

      # The Rust path's parts that need no device, on the JVM: the olcRTC room keeper (list,
      # refusal, fetch, timing, memory), the core's config with the user's own rules, hev's.
      # pr-checks.yml runs the whole jvmTest on a PR; a lab branch gets none without this.
      - name: Host tests of the Rust path
        working-directory: olcbox
        run: |
          set -euo pipefail
          export OLCRTC_REPO="${{ github.workspace }}/olcrtc"
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          ./gradlew :sharedUI:jvmTest --tests "org.olcbox.app.vpn.rooms.*" --tests "org.olcbox.app.net.*" \
            --tests "org.olcbox.app.vpn.HevTunnelConfigTest" --stacktrace 2>&1 | tail -80

      # A release build (minified, R8) keeps what the core needs: the engine the service
      # finds by name, the UniFFI bindings, JNA. Unsigned; nothing is published.
      - name: Release APK with the core keeps the engine, the bindings and JNA
        working-directory: olcbox
        run: |
          set -euo pipefail
          export OLCRTC_REPO="${{ github.workspace }}/olcrtc"
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          ./gradlew :androidApp:assembleGithubRelease \
            -PghostlaneCoreDir="$GITHUB_WORKSPACE/olcbox/out/core" --stacktrace 2>&1 | tail -60
          rel=$(find androidApp/build/outputs/apk/github/release -name '*.apk' | head -1)
          ls -l "$rel"
          unzip -p "$rel" 'classes*.dex' | strings > out-release-dex.txt
          for name in org/olcbox/app/rustcore/RustCoreEngine org/ghostlane/olcrtc/OlcrtcRuntime com/sun/jna/Native xray_core_set_socket_protect_callback; do
            grep -q "$name" out-release-dex.txt || { echo "release dex lost $name"; exit 1; }
          done
          [ "$(unzip -l "$rel" | grep -c 'libghostlane_core.so')" -eq 3 ]
          { echo '### Release (R8) keeps the Rust core classes'; echo "APK: $(stat -c %s "$rel") bytes"; } >> "$GITHUB_STEP_SUMMARY"

      # A phone test build: the Rust switch ON by default, its own applicationId
      # (org.proofkit.app.rustlab) so it installs next to the store app. Built after the
      # checked APKs, so it never feeds the e2e job.
      # The crypt1 client key, as release.yml gives it to a store build: without it the
      # app cannot read an olcrtc://crypt1/ list, nor the answer to a partner's
      # happ:// link, and says "Link not recognised" to a link that is fine.
      - name: Lab APK for a phone (Rust core on, installs next to the store app)
        working-directory: olcbox
        env:
          OLCBOX_CRYPT_KEY_V1: ${{ secrets.OLCBOX_CRYPT_KEY_V1 }}
        run: |
          set -euo pipefail
          if [ -n "${OLCBOX_CRYPT_KEY_V1}" ]; then
            echo '### Lab APK: crypt1 links ON' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::OLCBOX_CRYPT_KEY_V1 is not set; this lab APK cannot import crypt1 or partner links"
            echo '### Lab APK: crypt1 links OFF (no key)' >> "$GITHUB_STEP_SUMMARY"
          fi
          export OLCRTC_REPO="${{ github.workspace }}/olcrtc"
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          cp -r androidApp/build/outputs/apk/github/debug "$RUNNER_TEMP/checked-debug"
          ./gradlew :androidApp:assembleGithubDebug -PghostlaneCoreDir="$GITHUB_WORKSPACE/olcbox/out/core" \
            -Polcbox.rustCoreDefault=true -Polcbox.labSuffix=.rustlab 2>&1 | tail -20
          mkdir -p "$RUNNER_TEMP/lab"
          cp androidApp/build/outputs/apk/github/debug/*.apk "$RUNNER_TEMP/lab/"
          rm -rf androidApp/build/outputs/apk/github/debug && cp -r "$RUNNER_TEMP/checked-debug" androidApp/build/outputs/apk/github/debug
          ls -l "$RUNNER_TEMP/lab"

      - uses: actions/upload-artifact@v7
        with:
          name: rust-core-lab-apk
          path: ${{ runner.temp }}/lab/
          retention-days: 14

      - name: What the core adds to the APK, per ABI
        working-directory: olcbox
        run: |
          set -euo pipefail
          app=$(find androidApp/build/outputs/apk/github/debug -name '*.apk' | head -1)
          echo "APK: $app"; ls -l "$app"
          unzip -v "$app" | grep -E 'lib/.*/(libghostlane_core|libjnidispatch)\.so' | tee out-core-in-apk.txt
          for abi in x86_64 arm64-v8a armeabi-v7a; do
            grep -q "lib/$abi/libghostlane_core.so" out-core-in-apk.txt || { echo "APK: no lib/$abi/libghostlane_core.so"; exit 1; }
          done
          {
            echo '### The core in the debug APK (unzip -v: size, method, compressed, ...)'
            echo '```'
            echo "APK: $(stat -c %s "$app") bytes"
            cat out-core-in-apk.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p apks
          cp "$app" apks/
          cp "$(find androidApp/build/outputs/apk/androidTest/github/debug -name '*.apk' | head -1)" apks/
          cp out-core-in-apk.txt apks/
          ls -l apks

      - uses: actions/upload-artifact@v7
        with:
          name: rust-core-app-apks
          path: olcbox/apks/
          retention-days: 14

  e2e:
    name: "K3: API ${{ matrix.leg.api }}, ${{ matrix.leg.pages }} pages (x86_64)"
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # K3's legs. A leg is one emulator: every class of the e2e package, then the kill.
        # API 23 and 24 boot with 2 GiB of RAM: with 4 GiB their app_process commands
        # (am, pm, input) aborted (SIGABRT, 23) or hung (24). API 23's own data partition
        # is too small for the app (INSTALL_FAILED_INSUFFICIENT_STORAGE): 2 GiB.
        leg:
          - { api: 23, target: google_apis, pages: 4k, ram: 2048M, disk: 2048M }
          - { api: 24, target: google_apis, pages: 4k, ram: 2048M, disk: '' }
          - { api: 29, target: google_apis, pages: 4k, ram: 4096M, disk: 4096M }
          - { api: 34, target: google_apis, pages: 4k, ram: 4096M, disk: 4096M }
          - { api: 35, target: google_apis, pages: 4k, ram: 4096M, disk: 4096M }
          - { api: 35, target: google_apis_ps16k, pages: 16k, ram: 4096M, disk: 4096M }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: rust-core-app-apks
          path: out/apks

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # What a red start is read by: the line's port on the host's loopback (the
      # session script captures it when SESSION_DIAG=1).
      - name: tcpdump for the line's capture
        run: command -v tcpdump > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends tcpdump; }

      # The kill's line: the first official Xray server of scripts/xray-servers.txt
      # (the exits' release), checked against its pinned hash.
      - name: The Xray server for the kill, by hash
        run: |
          set -euo pipefail
          servers="$(bash scripts/fetch-xray-servers.sh "$RUNNER_TEMP/xray-servers" | tail -n 1)"
          first="${servers%% *}"
          echo "XRAY_SERVER=${first#*=}" >> "$GITHUB_ENV"
          echo "the kill's server: ${first}"

      # One line: the kill runs whatever the classes did, and the leg fails if either failed.
      - name: "Every class of the e2e package, then kill -9 and restart (API ${{ matrix.leg.api }}, ${{ matrix.leg.pages }})"
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SESSION_DIAG: '1'
        with:
          api-level: ${{ matrix.leg.api }}
          arch: x86_64
          target: ${{ matrix.leg.target }}
          disable-animations: true
          emulator-boot-timeout: 900
          ram-size: ${{ matrix.leg.ram }}
          disk-size: ${{ matrix.leg.disk }}
          # adbd as the shell (uid 2000) where the image starts it as root (API 23): the
          # app lists name the shell's package, and root is in none of them.
          script: adb unroot > /dev/null 2>&1; sleep 5; adb wait-for-device; adb shell id; bash scripts/rust-core-android-e2e.sh out/apks out/leg/e2e; e=$?; bash scripts/rust-core-android-kill.sh out/apks out/leg/kill; k=$?; bash scripts/rust-core-android-goref.sh out/leg/goref; echo "e2e=$e kill=$k" | tee out/leg/exit.txt; [ "$e" -eq 0 ] && [ "$k" -eq 0 ]

      - name: Summary
        if: always()
        run: |
          {
            echo "### K3: API ${{ matrix.leg.api }}, ${{ matrix.leg.pages }} pages"
            echo '```'
            cat out/leg/e2e/device.txt 2> /dev/null || echo "no device line"
            cat out/leg/e2e/classes.txt 2> /dev/null || echo "no class ran"
            grep -E '^(OK|FAILURES|Tests run)' out/leg/e2e/am.txt 2> /dev/null | tr -d '\r'
            grep '^RESULT' out/leg/kill/results.txt 2> /dev/null || echo "no kill result"
            grep '^RESULT' out/leg/goref/results.txt 2> /dev/null || echo "no reference run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: k3-api${{ matrix.leg.api }}-${{ matrix.leg.pages }}
          path: out/leg/
          retention-days: 14

  k3:
    name: "K3: every class and the kill on every leg"
    needs: [app, e2e]
    if: ${{ !cancelled() && needs.app.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: k3-*
          path: out/k3

      # The classes are the package's, by the rule the e2e script reads them with, so a
      # class no leg ran is a row of its own; the legs are the matrix's, so a leg that
      # left nothing is a column of its own.
      - name: The table
        env:
          LEGS: 'api23-4k api24-4k api29-4k api34-4k api35-4k api35-16k'
        run: |
          python3 - <<'EOF'
          import os, re, sys
          src = "androidApp/src/androidTestRustcore"
          classes = []
          for root, _, files in os.walk(src):
              for name in sorted(files):
                  if not name.endswith(".kt"):
                      continue
                  text = open(os.path.join(root, name)).read()
                  if "@Test" not in text:
                      continue
                  m = re.search(r"^package\s+([A-Za-z0-9_.]+)", text, re.M)
                  classes.append((m.group(1) + "." if m else "") + name[:-3])
          classes.sort()
          legs = os.environ["LEGS"].split()
          KILL_BACK, KILL_RESTART = "kill -9, down and back", "kill -9, Android's restart"
          cells, bad = {}, 0
          for leg in legs:
              d = os.path.join("out/k3", "k3-" + leg)
              am = os.path.join(d, "e2e", "am.txt")
              counts = {}
              if os.path.exists(am):
                  cls = test = None
                  for line in open(am, errors="replace"):
                      line = line.rstrip("\r\n")
                      if line.startswith("INSTRUMENTATION_STATUS: class="):
                          cls = line.split("=", 1)[1]
                      elif line.startswith("INSTRUMENTATION_STATUS: test="):
                          test = line.split("=", 1)[1]
                      elif line.startswith("INSTRUMENTATION_STATUS_CODE: ") and cls:
                          code = line.split(": ", 1)[1].strip()
                          if code == "1":
                              continue
                          c = counts.setdefault(cls, {"pass": 0, "fail": 0, "skip": 0})
                          c["pass" if code == "0" else "skip" if code in ("-3", "-4") else "fail"] += 1
              for k in classes:
                  c = counts.get(k)
                  if c is None:
                      cells[(k, leg)] = "not run" if os.path.isdir(d) else "no result"
                      bad += 1
                  elif c["fail"] or not c["pass"]:
                      cells[(k, leg)] = "FAIL %d of %d" % (c["fail"], c["pass"] + c["fail"])
                      bad += 1
                  else:
                      cells[(k, leg)] = "pass %d" % c["pass"] + (" (%d skipped)" % c["skip"] if c["skip"] else "")
              kill = os.path.join(d, "kill", "results.txt")
              text = open(kill, errors="replace").read() if os.path.exists(kill) else ""
              fails = [l[len("RESULT FAIL "):] for l in text.splitlines() if l.startswith("RESULT FAIL ")]
              first = ("FAIL: " + fails[0][:60]) if fails else "not finished" if text else "no result"
              # The session goes down with the process and comes back in a new one on the
              # Rust core: by Android, or by the next start when Android did not.
              m = re.search(r"^RESULT down-and-back: ok, back (by Android|by the next start)", text, re.M)
              cells[(KILL_BACK, leg)] = ("pass, back " + m.group(1)) if m else first
              bad += 0 if m else 1
              # Android's own restart of the service (START_REDELIVER_INTENT) within 90 s.
              if re.search(r"^RESULT android-restart: yes", text, re.M):
                  cells[(KILL_RESTART, leg)] = "pass"
              else:
                  none = re.search(r"^RESULT android-restart: none", text, re.M)
                  cells[(KILL_RESTART, leg)] = "FAIL: Android did not restart it in 90 s" if none else first
                  bad += 1
          rows = classes + [KILL_BACK, KILL_RESTART]
          out = ["### K3: every class of the e2e package and the kill, on every leg", "",
                 "| | " + " | ".join(legs) + " |", "|---|" + "---|" * len(legs)]
          for r in rows:
              out.append("| " + r.rsplit(".", 1)[-1] + " | " + " | ".join(cells[(r, l)] for l in legs) + " |")
          out += ["", "%d cell(s) did not pass" % bad if bad else "every cell passed"]
          text = "\n".join(out)
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(text + "\n")
          sys.exit(1 if bad else 0)
          EOF

  soak:
    name: "Soak: one session on the Rust core, API 35 (x86_64)"
    needs: app
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.soak }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: rust-core-app-apks
          path: out/apks

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: The Xray server for the soak, by hash
        run: |
          set -euo pipefail
          servers="$(bash scripts/fetch-xray-servers.sh "$RUNNER_TEMP/xray-servers" | tail -n 1)"
          first="${servers%% *}"
          echo "XRAY_SERVER=${first#*=}" >> "$GITHUB_ENV"

      - name: The soak (x86_64, API 35, 4 KiB pages)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SOAK_MINUTES: ${{ inputs.soak_minutes }}
        with:
          api-level: ${{ env.EMULATOR_API }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 900
          ram-size: 4096M
          disk-size: 4096M
          script: bash scripts/rust-core-android-soak.sh out/apks out/soak "$SOAK_MINUTES"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-core-android-soak
          path: out/soak/
          retention-days: 30
