name: PR Checks

# Pull requests, and every push, main's and tags' included.
#
# On pull_request alone, work pushed to a branch was compiled by nothing until
# somebody opened a PR — so a branch could sit for a day looking finished while
# not building at all. This is the cheap half of the pipeline (one ubuntu
# runner), and the expensive half stays where it is: `Build Ghostlane Releases`
# is workflow_dispatch only, on purpose, because macOS minutes bill at 10x.
#
# main was excluded, as a merge of something already checked, until work
# pushed straight to it went unbuilt (81d412a).
on:
  workflow_dispatch:
    inputs:
      apple_compile:
        description: Compile shared Kotlin for Apple targets without signing or building Go frameworks
        type: boolean
        default: true
  pull_request:
    branches:
      - main
  push:

permissions:
  contents: read

concurrency:
  # A push carries no PR number, and without the ref every branch would share
  # one group and cancel the others' runs.
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Apple compilation bills a macOS runner at ten times the rate, so it does
  # not run on every push — but the shared Kotlin is where an Apple-only break
  # hides, and the one that got through (a JVM-only MutableMap.remove overload,
  # #44) left main unbuildable for iOS and macOS until someone asked by hand.
  # So: automatic exactly where it can tell us something.
  #
  # ai-generated: the whole job.
  scope:
    if: github.event_name != 'workflow_dispatch'
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shared_kotlin: ${{ steps.paths.outputs.shared_kotlin }}
      cli: ${{ steps.paths.outputs.cli }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A pull request is compared with its base, and a push with the tip the
      # branch had before it: against HEAD~1, a push of nine commits whose last
      # was a pin change skipped this job for the shared Kotlin in the other
      # eight (2026-09-22). A new branch's before is all zeros (that same day a
      # first push of six commits, the last only dropping a jar, skipped it
      # too) and a force push's may be a commit the clone never fetched; both
      # are compared with where HEAD leaves the default branch, which
      # fetch-depth: 0 fetches as origin/<default>. A tag on a commit of the
      # default branch has nothing past it and skips. The default branch
      # itself, and a clone without it, fall back to HEAD~1, and a commit with
      # no parent runs Apple.
      #
      # The price: one Kotlin change compiles on macOS up to three times, on
      # the branch's push, on its pull request and on the fast-forward to
      # main. Accepted, so that a branch nobody has opened a PR for is checked.
      - id: paths
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
          PUSH_REF: ${{ github.event_name == 'push' && github.ref || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          base="$PR_BASE"
          if [ -z "$base" ] && [[ "$PUSH_BEFORE" =~ ^[0-9a-f]+$ ]] && [[ ! "$PUSH_BEFORE" =~ ^0+$ ]] \
            && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE"
          fi
          default="refs/remotes/origin/${DEFAULT_BRANCH}"
          if [ -z "$base" ] && [ "$PUSH_REF" != "refs/heads/${DEFAULT_BRANCH}" ] \
            && git rev-parse --verify --quiet "$default" >/dev/null; then
            # No common history prints nothing and fails: HEAD~1 then decides.
            base=$(git merge-base HEAD "$default" || true)
          fi
          if [ -z "$base" ]; then
            # --verify: without it a missing HEAD~1 is printed back as the
            # name "HEAD~1", and the diff below fails into a skip.
            base=$(git rev-parse --verify --quiet HEAD~1 || true)
          fi
          if [ -z "$base" ]; then
            echo 'shared_kotlin=true' >> "$GITHUB_OUTPUT"
            echo 'cli=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Compared with ${base}." >> "$GITHUB_STEP_SUMMARY"
          changed=$(git diff --name-only "$base" HEAD || true)
          if printf '%s\n' "$changed" | grep -qE '^sharedUI/src/(commonMain|iosMain|appleMain)/|^sharedUI/build\.gradle\.kts$|^gradle/libs\.versions\.toml$'; then
            echo 'shared_kotlin=true' >> "$GITHUB_OUTPUT"
            echo 'Apple compilation runs: this change touches the shared Kotlin.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'shared_kotlin=false' >> "$GITHUB_OUTPUT"
            echo 'Apple compilation skipped: nothing under the shared Kotlin changed.' >> "$GITHUB_STEP_SUMMARY"
          fi
          # The Linux CLI is its own Go module: built and tested only when it, its
          # workflow, or the engine pin it must match changed.
          if printf '%s\n' "$changed" | grep -qE '^cli/|^\.github/workflows/pr-checks\.yml$|^\.github/workflows/release\.yml$|^scripts/cores-pins\.sh$'; then
            echo 'cli=true' >> "$GITHUB_OUTPUT"
          else
            echo 'cli=false' >> "$GITHUB_OUTPUT"
          fi

  checks:
    if: github.event_name != 'workflow_dispatch'
    name: Gradle checks
    runs-on: ubuntu-latest

    env:
      ANDROID_NDK_VERSION: "28.2.13676358"
      # The release the app pins (SingBoxConfig.SINGBOX_VERSION); every config
      # the builders emit is checked against this exact binary below.
      SINGBOX_VERSION: "1.13.14"
      XRAY_VERSION: "25.3.6"
      # crypt1/admin secrets (baked into GeneratedAppInfo). Absent on fork PRs ⇒
      # features compile but stay disabled; jvmTest uses its own explicit key.
      OLCBOX_CRYPT_KEY_V1: ${{ secrets.OLCBOX_CRYPT_KEY_V1 }}
      OLCBOX_ADMIN_PASS_SHA256: ${{ secrets.OLCBOX_ADMIN_PASS_SHA256 }}

    steps:
      - name: Checkout olcbox
        uses: actions/checkout@v7
        with:
          path: olcbox

      # The engine every release builds: OLCRTC_VERSION in scripts/cores-pins.sh,
      # as a full commit (actions/checkout takes nothing shorter). A fork's
      # read-only token still reads the public engine repository.
      - name: Resolve the engine pin
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          olcbox/scripts/olcrtc-pin.sh > "$RUNNER_TEMP/pin.out"
          cat "$RUNNER_TEMP/pin.out" >> "$GITHUB_OUTPUT"

      - name: Checkout olcrtc
        uses: actions/checkout@v7
        with:
          repository: ghostlane-project/olcrtc
          ref: ${{ steps.pin.outputs.olcrtc_sha }}
          path: olcrtc
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # The release's toolchain, not `stable` (scripts/cores-pins.sh says why).
          go-version: ${{ steps.pin.outputs.go_version }}
          cache-dependency-path: olcrtc/go.sum

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's default is 'tools platform-tools'; the legacy tools
          # package is no longer in Google's repository (2026-09-15) and sdkmanager
          # fails the whole step over it. The next step installs what the build needs.
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Go mobile tooling
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install github.com/magefile/mage@latest

      - name: Initialize gomobile
        working-directory: olcrtc
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          gomobile init

      - name: Run checks
        working-directory: olcbox
        run: |
          export OLCRTC_REPO="${{ github.workspace }}/olcrtc"
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          ./gradlew :sharedUI:jvmTest :desktopApp:compileKotlin :androidApp:assembleDebug --stacktrace

      # Instrumented tests still exercise resource loading on a device, while
      # this cheap archive check protects every normal PR build as well.
      - name: Verify packaged Compose file resources
        working-directory: olcbox
        run: |
          apk=$(find androidApp/build/outputs/apk/github/debug -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)
          test -n "$apk"
          python3 tools/check-android-compose-assets.py "$apk"

      - name: Download pinned sing-box
        run: |
          url="https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          curl -fsSL "$url" -o sb.tar.gz
          tar xzf sb.tar.gz
          sudo mv "sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version

      # Every shape the builders emit, against the release the app pins. The
      # jvm tests above wrote them; this is what `sing-box check` says about them.
      - name: sing-box check the emitted configs
        working-directory: olcbox
        run: scripts/check-singbox-configs.sh

      - name: Validate generated Xray configurations
        working-directory: olcbox
        run: |
          curl -fsSL "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip" -o "$RUNNER_TEMP/xray.zip"
          unzip -qo "$RUNNER_TEMP/xray.zip" -d "$RUNNER_TEMP/xray-check"
          XRAY_BIN="$RUNNER_TEMP/xray-check/xray" bash scripts/check-xray-configs.sh

      - name: Upload generated core configurations and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-checks
          path: |
            olcbox/sharedUI/build/xray-configs/
            olcbox/sharedUI/build/reports/tests/jvmTest/

  # The release gate's scripts decide what a release may ship and scrub what a
  # public repository uploads, so they are tested offline on every push:
  # scripts/test_gate_scripts.py runs them against a local stand-in for the
  # GitHub API and a stub go. The gate itself runs in gate.yml.
  # The Linux CLI (cli/): vet, lint, unit tests with the race detector, the
  # netns tests as root (a fresh network namespace; the runner's own network
  # is untouched), every package format, and an install smoke in containers.
  cli:
    if: github.event_name != 'workflow_dispatch' && needs.scope.outputs.cli == 'true'
    name: Linux CLI
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: cli/go.sum
      - name: Vet and lint
        run: |
          go vet -tags with_utls,with_quic ./...
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          golangci-lint run ./...
      - name: Unit tests
        run: go test -race -tags with_utls,with_quic ./...
      - name: Server end-to-ends (an xray server process from the pinned module)
        run: |
          make xray-server
          XRAY_SERVER_BIN="$PWD/dist/xray-server" go test -count=1 -tags with_utls,with_quic -run 'EndToEnd' -v ./internal/engine/xray/ ./internal/engine/singbox/ | tee e2e.log
          # a skip (no route to the mirrored site) must not read as a pass
          for t in TestRealityXhttpEndToEnd TestRealityTCPEndToEnd TestHysteria2EndToEnd; do
            grep -q -- "--- PASS: $t" e2e.log || { echo "::error::$t did not pass (skipped or failed)"; exit 1; }
          done
      - name: netns tests (root)
        run: |
          sudo -E env "PATH=$PATH" GHOSTLANE_NETNS=1 go test -tags with_utls,with_quic -count=1 -run 'TestNetns' -v ./internal/routes/ ./internal/daemon/
      - name: Packages
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          make dist VERSION=0.0.0
          systemd-analyze verify packaging/ghostlane.service || true
          ls -la dist
      - name: Install smoke
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" debian:bookworm sh -c 'dpkg -i /dist/ghostlane-cli-0.0.0-linux-amd64.deb && ghostlane version && id ghostlane'
          docker run --rm -v "$PWD/dist:/dist:ro" rockylinux:9 sh -c 'rpm -i /dist/ghostlane-cli-0.0.0-linux-amd64.rpm && ghostlane version && id ghostlane'
          docker run --rm -v "$PWD/dist:/dist:ro" alpine:3.20 sh -c 'apk add --no-cache openrc >/dev/null && apk add --allow-untrusted /dist/ghostlane-cli-0.0.0-linux-amd64.apk && ghostlane version && id ghostlane && test -x /etc/init.d/ghostlane && rc-service ghostlane describe'
      # The apt and dnf repositories the release publishes, built here with a
      # throwaway key (natively: reprepro, createrepo_c and rpmsign are apt
      # packages), then installed from with signature checks on (the package's
      # header signature is RSA with whatever digest the runner's gpg picks).
      - name: Repositories
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends reprepro createrepo-c rpm gnupg >/dev/null
          export GNUPGHOME="$RUNNER_TEMP/gnupg"; mkdir -p "$GNUPGHOME"; chmod 700 "$GNUPGHOME"
          printf '%%no-protection\nKey-Type: RSA\nKey-Length: 2048\nKey-Usage: sign\nName-Real: CI throwaway\nName-Email: ci@example.invalid\nExpire-Date: 1d\n%%commit\n' > "$RUNNER_TEMP/batch"
          gpg --batch --gen-key "$RUNNER_TEMP/batch" 2>/dev/null
          gpg --batch --armor --export-secret-keys > "$RUNNER_TEMP/repo-key.asc"
          unset GNUPGHOME
          sh packaging/repo/build-repos.sh dist "$RUNNER_TEMP/repo" "$RUNNER_TEMP/repo-key.asc" 0.0.0
          # the CI key, not the release key, verifies here
          gpg --batch --no-default-keyring --keyring "$RUNNER_TEMP/kr.gpg" --import "$RUNNER_TEMP/repo-key.asc" 2>/dev/null
          gpg --batch --no-default-keyring --keyring "$RUNNER_TEMP/kr.gpg" --armor --export > "$RUNNER_TEMP/repo/ghostlane-repo.gpg.asc"
          docker run --rm -v "$RUNNER_TEMP/repo:/repo:ro" debian:bookworm sh -c 'apt-get update >/dev/null 2>&1; apt-get install -y --no-install-recommends gnupg >/dev/null 2>&1; install -d /etc/apt/keyrings; gpg --dearmor -o /etc/apt/keyrings/ghostlane.gpg < /repo/ghostlane-repo.gpg.asc; sed "s#https://ghostlane-project.github.io/ghostlane/apt#file:///repo/apt#" /repo/ghostlane.list > /etc/apt/sources.list.d/ghostlane.list; apt-get update 2>&1 | { ! grep -E "NO_PUBKEY|^E:|^W: GPG"; }; apt-get install -y ghostlane-cli >/dev/null && ghostlane version'
          docker run --rm -v "$RUNNER_TEMP/repo:/repo:ro" rockylinux:9 sh -c 'printf "[ghostlane]\nname=Ghostlane CLI\nbaseurl=file:///repo/rpm\nenabled=1\ngpgcheck=1\nrepo_gpgcheck=1\ngpgkey=file:///repo/ghostlane-repo.gpg.asc\n" > /etc/yum.repos.d/ghostlane.repo; dnf install -y -q ghostlane-cli >/dev/null && ghostlane version && rpm -q --qf "%{RSAHEADER:pgpsig}\n" ghostlane-cli | grep -q "^RSA/"'

  gate-scripts:
    if: github.event_name != 'workflow_dispatch'
    name: Gate scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Offline tests
        run: python3 scripts/test_gate_scripts.py

      # The runner's own shellcheck: Ubuntu 24.04's 0.9.0, older than a pip or
      # brew install and stricter in places (SC2015 on `a && b || c`), so check
      # the scripts locally with 0.9.0 as well. The log says which one ran.
      - name: shellcheck and bash -n
        run: |
          set -euo pipefail
          shellcheck --version
          shellcheck -x scripts/olcrtc-pin.sh scripts/gate-*.sh
          for f in scripts/olcrtc-pin.sh scripts/gate-*.sh; do bash -n "$f"; done

  apple-compile:
    # On a change to the shared Kotlin, and on request. Anything else would
    # bill a macOS runner at ten times the rate to compile what has not moved.
    needs: scope
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && inputs.apple_compile) ||
       needs.scope.outputs.shared_kotlin == 'true')
    name: Apple Kotlin compilation
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile existing Apple targets
        run: ./gradlew :sharedUI:compileKotlinIosArm64 :sharedUI:compileKotlinMacosArm64 --stacktrace
