name: PR Checks

# Pull requests, and every push, main's and tags' included.
#
# On pull_request alone, work pushed to a branch was compiled by nothing until
# somebody opened a PR — so a branch could sit for a day looking finished while
# not building at all. This is the cheap half of the pipeline (one ubuntu
# runner), and the expensive half stays where it is: `Build Ghostlane Releases`
# is workflow_dispatch only, on purpose, because macOS minutes bill at 10x.
#
# main was excluded, as a merge of something already checked, until work
# pushed straight to it went unbuilt (81d412a).
on:
  workflow_dispatch:
    inputs:
      apple_compile:
        description: Compile shared Kotlin for Apple targets without signing or building Go frameworks
        type: boolean
        default: true
      ios_extension:
        description: Build the iPhone tunnel extension unsigned and run its Swift tests
        type: boolean
        default: false
  pull_request:
    branches:
      - main
  push:

permissions:
  contents: read

concurrency:
  # A push carries no PR number, and without the ref every branch would share
  # one group and cancel the others' runs.
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Apple compilation bills a macOS runner at ten times the rate, so it does
  # not run on every push — but the shared Kotlin is where an Apple-only break
  # hides, and the one that got through (a JVM-only MutableMap.remove overload,
  # #44) left main unbuildable for iOS and macOS until someone asked by hand.
  # So: automatic exactly where it can tell us something.
  #
  # ai-generated: the whole job.
  scope:
    if: github.event_name != 'workflow_dispatch'
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shared_kotlin: ${{ steps.paths.outputs.shared_kotlin }}
      cli: ${{ steps.paths.outputs.cli }}
      mac_helper: ${{ steps.paths.outputs.mac_helper }}
      ios_extension: ${{ steps.paths.outputs.ios_extension }}
      android_tun2socks: ${{ steps.paths.outputs.android_tun2socks }}
      singbox_size: ${{ steps.paths.outputs.singbox_size }}
      rust_core: ${{ steps.paths.outputs.rust_core }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A pull request is compared with its base, and a push with the tip the
      # branch had before it: against HEAD~1, a push of nine commits whose last
      # was a pin change skipped this job for the shared Kotlin in the other
      # eight (2026-09-22). A new branch's before is all zeros (that same day a
      # first push of six commits, the last only dropping a jar, skipped it
      # too) and a force push's may be a commit the clone never fetched; both
      # are compared with where HEAD leaves the default branch, which
      # fetch-depth: 0 fetches as origin/<default>. A tag on a commit of the
      # default branch has nothing past it and skips. The default branch
      # itself, and a clone without it, fall back to HEAD~1, and a commit with
      # no parent runs Apple.
      #
      # The price: one Kotlin change compiles on macOS up to three times, on
      # the branch's push, on its pull request and on the fast-forward to
      # main. Accepted, so that a branch nobody has opened a PR for is checked.
      - id: paths
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
          PUSH_REF: ${{ github.event_name == 'push' && github.ref || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          base="$PR_BASE"
          if [ -z "$base" ] && [[ "$PUSH_BEFORE" =~ ^[0-9a-f]+$ ]] && [[ ! "$PUSH_BEFORE" =~ ^0+$ ]] \
            && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE"
          fi
          default="refs/remotes/origin/${DEFAULT_BRANCH}"
          if [ -z "$base" ] && [ "$PUSH_REF" != "refs/heads/${DEFAULT_BRANCH}" ] \
            && git rev-parse --verify --quiet "$default" >/dev/null; then
            # No common history prints nothing and fails: HEAD~1 then decides.
            base=$(git merge-base HEAD "$default" || true)
          fi
          if [ -z "$base" ]; then
            # --verify: without it a missing HEAD~1 is printed back as the
            # name "HEAD~1", and the diff below fails into a skip.
            base=$(git rev-parse --verify --quiet HEAD~1 || true)
          fi
          if [ -z "$base" ]; then
            echo 'shared_kotlin=true' >> "$GITHUB_OUTPUT"
            echo 'cli=true' >> "$GITHUB_OUTPUT"
            echo 'mac_helper=true' >> "$GITHUB_OUTPUT"
            echo 'ios_extension=true' >> "$GITHUB_OUTPUT"
            echo 'android_tun2socks=true' >> "$GITHUB_OUTPUT"
            echo 'singbox_size=true' >> "$GITHUB_OUTPUT"
            echo 'rust_core=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Compared with ${base}." >> "$GITHUB_STEP_SUMMARY"
          changed=$(git diff --name-only "$base" HEAD || true)
          if printf '%s\n' "$changed" | grep -qE '^sharedUI/src/(commonMain|iosMain|appleMain)/|^sharedUI/build\.gradle\.kts$|^gradle/libs\.versions\.toml$'; then
            echo 'shared_kotlin=true' >> "$GITHUB_OUTPUT"
            echo 'Apple compilation runs: this change touches the shared Kotlin.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'shared_kotlin=false' >> "$GITHUB_OUTPUT"
            echo 'Apple compilation skipped: nothing under the shared Kotlin changed.' >> "$GITHUB_STEP_SUMMARY"
          fi
          # The Linux CLI is its own Go module: built and tested only when it, its
          # workflow, the engine pin it must match, or the sing-box tree it
          # compiles (the patch, the script that applies it, the Xray servers its
          # Reality end-to-end dials) changed.
          if printf '%s\n' "$changed" | grep -qE '^cli/|^\.github/workflows/pr-checks\.yml$|^\.github/workflows/release\.yml$|^scripts/cores-pins\.sh$|^scripts/patches/sing-box-|^scripts/patched-singbox\.sh$|^scripts/fetch-xray-servers\.sh$|^scripts/xray-servers\.txt$'; then
            echo 'cli=true' >> "$GITHUB_OUTPUT"
          else
            echo 'cli=false' >> "$GITHUB_OUTPUT"
          fi
          # The Mac's tunnel helper is the one part of the app that is root, and
          # nothing else here compiles it: only a release build does, with a
          # signing identity. Built and asked on a Mac when it, what asks it, or
          # the config it is handed changed, or the tags of the sing-box it runs:
          # a resolver of the Mac's tun is one of them (with_dhcp), and only a
          # Mac can tell it is gone. Not on a change to this file alone: a Mac's
          # minutes are billed tenfold.
          if printf '%s\n' "$changed" | grep -qE '^desktopApp/tunneldaemon/|^scripts/check-macos-helper\.sh$|^scripts/macos-helper-check/|^sharedUI/src/jvmTest/resources/reference-configs/desktop-tun-macos-names\.json$|^scripts/singbox-tags\.sh$'; then
            echo 'mac_helper=true' >> "$GITHUB_OUTPUT"
            echo "The Mac's tunnel helper is built and asked: this change touches it." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'mac_helper=false' >> "$GITHUB_OUTPUT"
          fi
          # The iPhone's tunnel extension links no Kotlin, so a Mac builds it
          # without Gradle, on a change to what that job builds or reads: the
          # extension and its tests, the project file, the privacy manifest it
          # checks, the scripts of its tests, and what it links, the prebuilt
          # frameworks and their pins. Not on a change to this file alone, as
          # above; the shared Kotlin its tests read runs them in apple-compile.
          # A here-string: a pipe into grep -q can end in SIGPIPE under
          # pipefail once grep has its match.
          if grep -qE '^iosApp/(PacketTunnel|Tests)/|^iosApp/iosApp\.xcodeproj/|^iosApp/iosApp/PrivacyInfo\.xcprivacy$|^scripts/test-ios-(room-list|tun-arrangement)\.sh$|^scripts/(fetch-cores-ios|fetch-hev-ios|cores-pins|hev-pins)\.sh$' <<< "$changed"; then
            echo 'ios_extension=true' >> "$GITHUB_OUTPUT"
            echo "The iPhone's tunnel extension is built and its tests run: this change touches it." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ios_extension=false' >> "$GITHUB_OUTPUT"
          fi
          # The Android tun's native code is compiled by every run and was run
          # by none: hev-socks5-tunnel with its lwIP, and the wrapper the
          # service calls. A step of the Gradle job runs it on the runner, on a
          # change to it, to its test, to the number the service reads from
          # it, or to this file.
          if grep -qE '^androidApp/src/main/jni/|^scripts/test-android-hev-restart\.sh$|^scripts/android-hev-restart/|^sharedUI/src/jvmAndroidMain/kotlin/org/olcbox/app/vpn/NativeTunnelRun\.kt$|^\.github/workflows/pr-checks\.yml$' <<< "$changed"; then
            echo 'android_tun2socks=true' >> "$GITHUB_OUTPUT"
          else
            echo 'android_tun2socks=false' >> "$GITHUB_OUTPUT"
          fi
          # What the sing-box tag lists save is sized by three more builds of
          # it, minutes of the Gradle job, so only when the lists, the tree
          # they compile or this file changed.
          if grep -qE '^scripts/(singbox-tags|build-singbox|patched-singbox|cores-pins)\.sh$|^scripts/patches/sing-box-|^\.github/workflows/pr-checks\.yml$' <<< "$changed"; then
            echo 'singbox_size=true' >> "$GITHUB_OUTPUT"
          else
            echo 'singbox_size=false' >> "$GITHUB_OUTPUT"
          fi
          # The Rust core reads and starts the core.json references: when they,
          # the script that asks it, or this file (which pins the core) changed.
          # The references change with every change to what the app writes
          # for the core, which the Gradle job's dump test enforces.
          if grep -qE '^sharedUI/src/jvmTest/resources/reference-configs/(bypass-)?ios-core-|^scripts/check-rust-core-configs\.sh$|^\.github/workflows/pr-checks\.yml$' <<< "$changed"; then
            echo 'rust_core=true' >> "$GITHUB_OUTPUT"
          else
            echo 'rust_core=false' >> "$GITHUB_OUTPUT"
          fi

  checks:
    # After scope for the two steps below that ask it what changed. Not held
    # to its success: !cancelled() runs the checks whatever became of scope,
    # and those steps are then skipped.
    needs: scope
    if: github.event_name != 'workflow_dispatch' && !cancelled()
    name: Gradle checks
    runs-on: ubuntu-latest

    env:
      ANDROID_NDK_VERSION: "28.2.13676358"
      XRAY_VERSION: "26.7.11"
      # crypt1/admin secrets (baked into GeneratedAppInfo). Absent on fork PRs ⇒
      # features compile but stay disabled; jvmTest uses its own explicit key.
      OLCBOX_CRYPT_KEY_V1: ${{ secrets.OLCBOX_CRYPT_KEY_V1 }}
      OLCBOX_ADMIN_PASS_SHA256: ${{ secrets.OLCBOX_ADMIN_PASS_SHA256 }}

    steps:
      - name: Checkout olcbox
        uses: actions/checkout@v7
        with:
          path: olcbox

      # The engine every release builds: OLCRTC_VERSION in scripts/cores-pins.sh,
      # as a full commit (actions/checkout takes nothing shorter). A fork's
      # read-only token still reads the public engine repository.
      - name: Resolve the engine pin
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          olcbox/scripts/olcrtc-pin.sh > "$RUNNER_TEMP/pin.out"
          cat "$RUNNER_TEMP/pin.out" >> "$GITHUB_OUTPUT"

      - name: Checkout olcrtc
        uses: actions/checkout@v7
        with:
          repository: ghostlane-project/olcrtc
          ref: ${{ steps.pin.outputs.olcrtc_sha }}
          path: olcrtc
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # The release's toolchain, not `stable` (scripts/cores-pins.sh says why).
          go-version: ${{ steps.pin.outputs.go_version }}
          cache-dependency-path: olcrtc/go.sum

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's default is 'tools platform-tools'; the legacy tools
          # package is no longer in Google's repository (2026-09-15) and sdkmanager
          # fails the whole step over it. The next step installs what the build needs.
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Go mobile tooling
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install github.com/magefile/mage@latest

      - name: Initialize gomobile
        working-directory: olcrtc
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          gomobile init

      - name: Run checks
        working-directory: olcbox
        run: |
          export OLCRTC_REPO="${{ github.workspace }}/olcrtc"
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          ./gradlew :sharedUI:jvmTest :desktopApp:compileKotlin :androidApp:assembleDebug --stacktrace

      # hev-socks5-tunnel as the app vendors it, built for the runner with its
      # own Makefile and run through what a stop and a restart in one process
      # have to survive (scripts/android-hev-restart/harness.c). The runner's
      # cc and make, no device, about half a minute. Run whatever Gradle said.
      - name: The Android tun's hev, stopped and started again in one process
        if: ${{ !cancelled() && needs.scope.outputs.android_tun2socks == 'true' }}
        working-directory: olcbox
        run: scripts/test-android-hev-restart.sh

      # Instrumented tests still exercise resource loading on a device, while
      # this cheap archive check protects every normal PR build as well.
      - name: Verify packaged Compose file resources
        working-directory: olcbox
        run: |
          apk=$(find androidApp/build/outputs/apk/github/debug -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)
          test -n "$apk"
          python3 tools/check-android-compose-assets.py "$apk"

      # Built, not downloaded: the configs are checked with the binary the app
      # ships, the patched tree with our tags (scripts/build-singbox.sh,
      # scripts/singbox-tags.sh). SagerNet's release carries tags ours do not,
      # so a shape that needs one of those passed `sing-box check` against it
      # and would be refused by the app's own binary. Two lists, two binaries:
      # the desktops' (Linux ships this one) and Android's, built for this
      # runner.
      - name: Build sing-box with the tags the app ships
        working-directory: olcbox
        run: |
          set -euo pipefail
          bash scripts/build-singbox.sh "$RUNNER_TEMP/sing-box/desktop" desktop
          bash scripts/build-singbox.sh "$RUNNER_TEMP/sing-box/android" android
          sudo install -m 0755 "$RUNNER_TEMP/sing-box/desktop" /usr/local/bin/sing-box
          sing-box version

      # Every shape the builders emit, against the pinned version with the
      # desktops' tags. The jvm tests above wrote them; this is what
      # `sing-box check` says about them.
      - name: sing-box check the emitted configs
        working-directory: olcbox
        run: scripts/check-singbox-configs.sh

      # The same shapes against Android's binary, but for a tun's, which
      # Android never writes (check-singbox-configs.sh says which those are).
      # The desktops' list is a superset of Android's, so the step above
      # cannot see a shape that needs a tag only the desktops have.
      - name: sing-box check the emitted configs with Android's tags
        working-directory: olcbox
        env:
          SINGBOX_BIN: ${{ runner.temp }}/sing-box/android
          SINGBOX_TARGET: android
        run: scripts/check-singbox-configs.sh

      # The desktop draws its traffic chart from what the tun's sing-box says it
      # has carried, less the flows of the session's own lines. The names of the
      # totals and how a flow names its program are in no schema; they are asked
      # of the desktops' binary here, which is also what says it has the API.
      - name: sing-box answers the traffic API as the app reads it
        working-directory: olcbox
        run: scripts/check-singbox-traffic-api.sh

      # What the tag lists save, in the step summary: Android's (arm64, as in
      # the APK) and the desktops' (amd64, as Linux ships it) beside the same
      # tree with SagerNet's release list, which every build used before.
      # Android's is built here without cgo; the APK's links through the NDK
      # with 16 KB pages and is a little larger, by the same amount in both
      # columns. Only when the lists or the tree changed (scope).
      - name: sing-box size with our tags and with upstream's
        if: needs.scope.outputs.singbox_size == 'true'
        working-directory: olcbox
        run: |
          set -euo pipefail
          sb="$RUNNER_TEMP/sing-box"
          GOOS=android GOARCH=arm64 bash scripts/build-singbox.sh "$sb/android-arm64" android
          GOOS=android GOARCH=arm64 bash scripts/build-singbox.sh "$sb/upstream-android-arm64" upstream
          bash scripts/build-singbox.sh "$sb/upstream" upstream
          # Into the log as well: a step summary cannot be read through the API.
          python3 - "$sb" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, sys
          sb = sys.argv[1]
          mib = lambda name: os.path.getsize(os.path.join(sb, name)) / 1048576
          print("### sing-box, our tags and upstream's\n")
          print("| binary | ours | upstream's | saved |")
          print("|---|---|---|---|")
          for what, ours, theirs in (
              ("android/arm64, Android's tags", "android-arm64", "upstream-android-arm64"),
              ("linux/amd64, the desktops' tags", "desktop", "upstream"),
              ("linux/amd64, Android's tags", "android", "upstream"),
          ):
              a, b = mib(ours), mib(theirs)
              print("| %s | %.1f MiB | %.1f MiB | %.1f MiB (%.0f %%) |" % (what, a, b, b - a, 100 * (b - a) / b))
          PY

      - name: Validate generated Xray configurations
        working-directory: olcbox
        run: |
          curl -fsSL "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip" -o "$RUNNER_TEMP/xray.zip"
          unzip -qo "$RUNNER_TEMP/xray.zip" -d "$RUNNER_TEMP/xray-check"
          XRAY_BIN="$RUNNER_TEMP/xray-check/xray" bash scripts/check-xray-configs.sh

      - name: Upload generated core configurations and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-checks
          path: |
            olcbox/sharedUI/build/xray-configs/
            olcbox/sharedUI/build/xray-configs-26/
            olcbox/sharedUI/build/rust-core-configs/
            olcbox/sharedUI/build/reports/tests/jvmTest/

  # The release gate's scripts decide what a release may ship and scrub what a
  # public repository uploads, so they are tested offline on every push:
  # scripts/test_gate_scripts.py runs them against a local stand-in for the
  # GitHub API and a stub go. The gate itself runs in gate.yml.
  # The Linux CLI (cli/): vet, lint, unit tests with the race detector, the
  # netns tests as root (a fresh network namespace; the runner's own network
  # is untouched), every package format, and an install smoke in containers.
  cli:
    if: github.event_name != 'workflow_dispatch' && needs.scope.outputs.cli == 'true'
    name: Linux CLI
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: cli/go.sum
      # cli/go.mod replaces sing-box with this tree (scripts/patched-singbox.sh):
      # nothing in the module builds before it is written.
      - name: The patched sing-box
        run: make singbox-src
      - name: Vet and lint
        run: |
          go vet -tags with_utls,with_quic ./...
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          golangci-lint run ./...
      - name: Unit tests
        run: go test -race -tags with_utls,with_quic ./...
      # The servers: an xray built from the pinned module, and the official
      # releases in scripts/xray-servers.txt (checked against the sums there),
      # each a version whose Reality check a hello has to pass.
      - name: Server end-to-ends against the pinned xray module and the releases in scripts/xray-servers.txt
        run: |
          set -o pipefail
          make xray-server
          servers="$(bash ../scripts/fetch-xray-servers.sh "$RUNNER_TEMP/xray-servers" | tail -n 1)"
          XRAY_SERVER_BIN="$PWD/dist/xray-server" XRAY_SERVERS="$servers" \
            go test -count=1 -tags with_utls,with_quic -run 'EndToEnd' -v ./internal/engine/xray/ ./internal/engine/singbox/ | tee e2e.log
          # a skip must not read as a pass, and a parent passes when its
          # subtests skip: every cell is named
          required="TestRealityXhttpEndToEnd TestHysteria2EndToEnd"
          for server in pinned $(sed -n 's/^\([0-9][0-9.]*\) .*/xray-\1/p' ../scripts/xray-servers.txt); do
            for fp in chrome chrome-wrong-key firefox firefox-wrong-key; do
              required="$required TestRealityTCPEndToEnd/$server/$fp"
            done
          done
          for t in $required; do
            grep -q -- "--- PASS: $t " e2e.log || { echo "::error::$t did not pass (skipped or failed)"; exit 1; }
          done
      - name: netns tests (root)
        run: |
          sudo -E env "PATH=$PATH" GHOSTLANE_NETNS=1 go test -tags with_utls,with_quic -count=1 -run 'TestNetns' -v ./internal/routes/ ./internal/daemon/
      - name: Packages
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          make dist VERSION=0.0.0
          systemd-analyze verify packaging/ghostlane.service || true
          ls -la dist
      - name: Install smoke
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" debian:bookworm sh -c 'dpkg -i /dist/ghostlane-cli-0.0.0-linux-amd64.deb && ghostlane version && id ghostlane'
          docker run --rm -v "$PWD/dist:/dist:ro" rockylinux:9 sh -c 'rpm -i /dist/ghostlane-cli-0.0.0-linux-amd64.rpm && ghostlane version && id ghostlane'
          docker run --rm -v "$PWD/dist:/dist:ro" alpine:3.20 sh -c 'apk add --no-cache openrc >/dev/null && apk add --allow-untrusted /dist/ghostlane-cli-0.0.0-linux-amd64.apk && ghostlane version && id ghostlane && test -x /etc/init.d/ghostlane && rc-service ghostlane describe'
      # The apt and dnf repositories the release publishes, built here with a
      # throwaway key (natively: reprepro, createrepo_c and rpmsign are apt
      # packages; in containers when the runner's archive does not answer, as
      # the release does), then installed from with signature checks on (the package's
      # header signature is RSA with whatever digest the runner's gpg picks).
      - name: Repositories
        run: |
          set -euo pipefail
          sh packaging/repo/install-tools.sh
          export GNUPGHOME="$RUNNER_TEMP/gnupg"; mkdir -p "$GNUPGHOME"; chmod 700 "$GNUPGHOME"
          printf '%%no-protection\nKey-Type: RSA\nKey-Length: 2048\nKey-Usage: sign\nName-Real: CI throwaway\nName-Email: ci@example.invalid\nExpire-Date: 1d\n%%commit\n' > "$RUNNER_TEMP/batch"
          gpg --batch --gen-key "$RUNNER_TEMP/batch" 2>/dev/null
          gpg --batch --armor --export-secret-keys > "$RUNNER_TEMP/repo-key.asc"
          unset GNUPGHOME
          gpg --batch --no-default-keyring --keyring "$RUNNER_TEMP/kr.gpg" --import "$RUNNER_TEMP/repo-key.asc" 2>/dev/null
          # twice: as this runner builds, and in containers (what a release does
          # when its runner's archive does not answer)
          for containers in "" 1; do
            repo="$RUNNER_TEMP/repo${containers:+-containers}"
            REPOS_IN_CONTAINERS="$containers" sh packaging/repo/build-repos.sh dist "$repo" "$RUNNER_TEMP/repo-key.asc" 0.0.0
            # the CI key, not the release key, verifies here
            gpg --batch --no-default-keyring --keyring "$RUNNER_TEMP/kr.gpg" --armor --export > "$repo/ghostlane-repo.gpg.asc"
            docker run --rm -v "$repo:/repo:ro" debian:bookworm sh -c 'apt-get update >/dev/null 2>&1; apt-get install -y --no-install-recommends gnupg >/dev/null 2>&1; install -d /etc/apt/keyrings; gpg --dearmor -o /etc/apt/keyrings/ghostlane.gpg < /repo/ghostlane-repo.gpg.asc; sed "s#https://ghostlane-project.github.io/ghostlane/apt#file:///repo/apt#" /repo/ghostlane.list > /etc/apt/sources.list.d/ghostlane.list; apt-get update 2>&1 | { ! grep -E "NO_PUBKEY|^E:|^W: GPG"; }; apt-get install -y ghostlane-cli >/dev/null && ghostlane version'
            docker run --rm -v "$repo:/repo:ro" rockylinux:9 sh -c 'printf "[ghostlane]\nname=Ghostlane CLI\nbaseurl=file:///repo/rpm\nenabled=1\ngpgcheck=1\nrepo_gpgcheck=1\ngpgkey=file:///repo/ghostlane-repo.gpg.asc\n" > /etc/yum.repos.d/ghostlane.repo; dnf install -y -q ghostlane-cli >/dev/null && ghostlane version && rpm -q --qf "%{RSAHEADER:pgpsig}\n" ghostlane-cli | grep -q "^RSA/"'
          done

  gate-scripts:
    if: github.event_name != 'workflow_dispatch'
    name: Gate scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Offline tests
        run: python3 scripts/test_gate_scripts.py

      # The runner's own shellcheck: Ubuntu 24.04's 0.9.0, older than a pip or
      # brew install and stricter in places (SC2015 on `a && b || c`), so check
      # the scripts locally with 0.9.0 as well. The log says which one ran.
      - name: shellcheck and bash -n
        run: |
          set -euo pipefail
          shellcheck --version
          shellcheck -x scripts/olcrtc-pin.sh scripts/gate-*.sh
          for f in scripts/olcrtc-pin.sh scripts/gate-*.sh; do bash -n "$f"; done

  apple-compile:
    # On a change to the shared Kotlin, and on request. Anything else would
    # bill a macOS runner at ten times the rate to compile what has not moved.
    # !cancelled() and not always(), as the extension job below: it still runs
    # past the skipped scope job of a dispatched run, and a run that a newer
    # push supersedes takes it with it.
    needs: scope
    if: >-
      ((github.event_name == 'workflow_dispatch' && inputs.apple_compile) ||
       needs.scope.outputs.shared_kotlin == 'true') &&
      !cancelled()
    name: Apple Kotlin compilation
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile existing Apple targets
        run: ./gradlew :sharedUI:compileKotlinIosArm64 :sharedUI:compileKotlinMacosArm64 --stacktrace
      # The iPhone tunnel extension copies what the shared Kotlin sends with a
      # list fetch (the user agent's name, the device headers, their cut), and
      # its tests read that Kotlin: a change here is where the two drift apart.
      # Run whatever the compilation said; about twenty seconds.
      - name: The room keeper's tests, against this Kotlin
        if: ${{ !cancelled() }}
        run: scripts/test-ios-room-list.sh

  mac-helper:
    # The Mac's tunnel helper, built and asked on a Mac: the one part of the
    # app that runs as root, and until this job the one part no check compiled.
    # It loads a block into the packet filter, points the system's resolver at
    # a tun and kills the tun, which a hosted runner is the right place for.
    needs: scope
    if: needs.scope.outputs.mac_helper == 'true' && !cancelled()
    name: macOS tunnel helper
    runs-on: macos-latest
    # 15 until sing-box was built here rather than downloaded: a few minutes more.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # The toolchain the releases build sing-box with (scripts/cores-pins.sh).
      - name: The pinned Go
        id: go
        run: echo "version=$(bash -c 'unset GO_VERSION; . scripts/cores-pins.sh; echo "$GO_VERSION"')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          # Nothing here has a go.sum to key a cache on.
          cache: false
      - name: Build the helper as the app's build does, and once to be asked over a pipe
        run: |
          src=desktopApp/tunneldaemon
          shared=("$src/PeerAuthority.swift" "$src/GroupExec.swift" "$src/TunnelChild.swift" \
                  "$src/TrafficHold.swift" "$src/SystemNames.swift" "$src/LineChild.swift" "$src/Daemon.swift")
          swiftc -O -target "$(uname -m)-apple-macos13.0" \
            -framework Foundation -framework Security -framework SystemConfiguration \
            -o "$RUNNER_TEMP/ProofKitTunnelDaemon" "${shared[@]}" "$src/main.swift"
          swiftc -O -target "$(uname -m)-apple-macos13.0" \
            -framework Foundation -framework Security -framework SystemConfiguration \
            -o "$RUNNER_TEMP/helper-check" "${shared[@]}" scripts/macos-helper-check/main.swift
          cc -O2 -o "$RUNNER_TEMP/stand-in-line" scripts/macos-helper-check/stand-in-line.c
      # The sing-box the app ships, not SagerNet's release: the patched tree
      # with the desktops' tags (scripts/build-singbox.sh). The Mac's tun finds
      # the network's own resolver through one of those tags (with_dhcp,
      # scripts/singbox-tags.sh), and the release has it whether ours does or not.
      - name: sing-box as the app ships it, for this Mac
        run: |
          bash scripts/build-singbox.sh "$RUNNER_TEMP/sing-box" desktop
          "$RUNNER_TEMP/sing-box" version | sed -n 1p
      - name: Ask the helper what it does
        run: sudo scripts/check-macos-helper.sh "$RUNNER_TEMP/helper-check" "$RUNNER_TEMP/sing-box" "$USER" "$RUNNER_TEMP/stand-in-line"

  ios-extension:
    # The iPhone's packet tunnel extension, which nothing else compiles before
    # a release build dispatched by hand. It links no Kotlin: Cores (sing-box,
    # Xray, olcRTC) and hev-socks5-tunnel come prebuilt from this repository's
    # releases, fetched by the target's own first build phase. So a Mac builds
    # it with neither Gradle nor a signing identity, and runs the tests of its
    # Foundation-only parts beside it. On a change to it, and on request.
    #
    # ai-generated: the whole job.
    # !cancelled() and not always(): a run that a newer push supersedes is
    # cancelled, and this job goes with it. Either still runs past the skipped
    # scope job of a dispatched run.
    needs: scope
    if: >-
      ((github.event_name == 'workflow_dispatch' && inputs.ios_extension) ||
       needs.scope.outputs.ios_extension == 'true') &&
      !cancelled()
    name: iPhone tunnel extension
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # The release's Xcode (release.yml, build-ios).
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^26.0'
      # RoomList, RoomMemoryRecord and DeviceHeaders with their tests; the last
      # holds the extension's device headers to the Kotlin they copy.
      - name: The room keeper's tests
        run: scripts/test-ios-room-list.sh
      # A file nothing references is not in the bundle (app-store-submission.md),
      # and until 2026-10-20 the manifest was such a file.
      - name: The privacy manifest is a plist, and one of the app's resources
        run: |
          set -euo pipefail
          plutil -lint iosApp/iosApp/PrivacyInfo.xcprivacy
          plutil -convert json -o "$RUNNER_TEMP/project.json" iosApp/iosApp.xcodeproj/project.pbxproj
          python3 - "$RUNNER_TEMP/project.json" <<'PY'
          import json, sys
          objects = json.load(open(sys.argv[1]))["objects"]
          app = next(o for o in objects.values() if o.get("isa") == "PBXNativeTarget" and o.get("name") == "iosApp")
          phase = next(objects[i] for i in app["buildPhases"] if objects[i]["isa"] == "PBXResourcesBuildPhase")
          paths = [objects[objects[f]["fileRef"]].get("path") for f in phase["files"]]
          print("iosApp resources:", paths)
          if "PrivacyInfo.xcprivacy" not in paths:
              print("::error::PrivacyInfo.xcprivacy is not among the resources of the iosApp target")
              sys.exit(1)
          PY
      # The target, not its scheme: an extension's scheme builds its host app
      # too, and the app's first phase runs Gradle.
      - name: Build the extension, unsigned
        run: |
          set -euo pipefail
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -target PacketTunnel \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

  # The Rust core's own verdict on the core.json the app writes for it: the
  # parser of ghostlane-project/xray-rust at the pinned commit reads every
  # reference config (sharedUI/src/jvmTest/resources/reference-configs/
  # ios-core-*.json and bypass-ios-core-*.json, which the Gradle job's dump
  # test holds XrayConfig.buildIosCore to), and the core is started from each
  # until it binds its SOCKS port (scripts/check-rust-core-configs.sh). The
  # CLI is built once per pin and cached (25 MB).
  rust-core-configs:
    needs: scope
    if: github.event_name != 'workflow_dispatch' && needs.scope.outputs.rust_core == 'true'
    name: "Rust core: the app's core.json"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The one pin of the core on this branch. It moves to
      # scripts/rust-core-pins.sh (XRAY_RUST_COMMIT) once that file, on
      # feat/rust-core-ci, is on the same branch as this job; until then
      # this is the only copy here, and the same commit: eb19e285, the
      # fork's ghostlane after its first integration (reset-network, logs,
      # hev-udp, hy2-memory, xhttp-upload-memory, the Chrome 156 hello,
      # rustls from ghostlane-project/shaped-rustls b0dc21a7). Bump it with
      # the copy of the core's field lists in XrayRustSurface.
      XRAY_RUST_REPO: ghostlane-project/xray-rust
      XRAY_RUST_COMMIT: eb19e285d909771e70833b37b26d0f72c2c13c98
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Restored and saved as two steps, so a CLI built once is kept even
      # when the check after it fails.
      - name: Restore the CLI
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/rust-core-cli
          key: rust-core-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.XRAY_RUST_COMMIT }}-v1

      # The project's own CLI build (its README: cargo build --locked -p
      # xray-cli) with --release, from exactly the pinned commit, with the
      # toolchain its rust-toolchain.toml names.
      - name: Build xray-rust's CLI at the pin
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          CARGO_TERM_COLOR: never
          CARGO_INCREMENTAL: "0"
          CARGO_NET_RETRY: "5"
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/xray-rust"
          git init -q "$src"
          git -C "$src" fetch -q --depth 1 "https://github.com/${XRAY_RUST_REPO}.git" "$XRAY_RUST_COMMIT"
          git -C "$src" -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$XRAY_RUST_COMMIT"
          toolchain="$(sed -n 's/^channel *= *"\(.*\)" *$/\1/p' "$src/rust-toolchain.toml")"
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          (cd "$src" && cargo "+$toolchain" build --locked --release -p xray-cli)
          install -D -m 0755 "$src/target/release/xray-rust" ~/.cache/rust-core-cli/xray-rust

      - name: Save the CLI
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/rust-core-cli
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: The core parses and starts every reference config
        run: |
          set -euo pipefail
          shellcheck scripts/check-rust-core-configs.sh
          bash scripts/check-rust-core-configs.sh ~/.cache/rust-core-cli/xray-rust
