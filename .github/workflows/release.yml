name: Build Ghostlane Releases

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'What to build (macOS minutes bill at 10x — build only what you need)'
        type: choice
        default: 'test-macos'
        options:
          - test-macos   # Apple Silicon DMG only — the usual "give me something to try"  [10x]
          - android      # Android APKs + AAB. Free runner
          - ios          # signed and uploaded to TestFlight when the iOS signing secrets are set, else an unsigned IPA
          - mobile       # Android and iOS together  [10x]
          - desktop      # macOS arm64 + Windows + Linux  [10x]
          - cli          # Linux CLI packages only (deb/rpm/apk/arch + tarballs), no publish. Free runner
          - all          # every platform, and publish the release  [10x]
      play_track:
        description: 'Google Play track for the play-flavor bundle (uploads only when PLAY_SERVICE_ACCOUNT_JSON is set)'
        type: choice
        default: 'internal'
        options:
          - internal     # Play's internal testing: testers get it in minutes, no review — the TestFlight of Android
          - production   # everyone, after Play's review; prefer promoting a tested internal build from the console
          - none         # build only
      gate:
        description: 'Release gate: required (a red gate builds and publishes nothing) or skip (emergency only; needs gate_reason, and the release notes say so)'
        type: choice
        default: 'required'
        options:
          - required
          - skip
      gate_reason:
        description: 'With gate: skip, why. Printed in the release notes'
        type: string
        default: ''
      dry_run:
        description: 'Dry run: build what was chosen, sign nothing, upload to no store, publish nothing, join no live room. Off main a run is dry whatever this says, unless signed_head names its commit'
        type: boolean
        default: false
      signed_head:
        description: 'Off main only: the full 40-hex commit this run may sign and publish. It must be the commit being built. Left empty, a run off main is dry'
        type: string
        default: ''

# Dry or signed (scripts/release-guard.sh decides, in the plan job). On main a
# run signs unless dry_run is ticked, as it always did. Off main a run is dry
# unless signed_head is the commit being built.
#
# A dry run builds every chosen platform the way a checkout without the
# repository's secrets does, and keeps the results as artifacts of the run. It
# reaches no step that reads a signing, store or publish secret and no job with
# more than read permissions: each of those asks for
# needs.plan.outputs.signed == 'true', as a job's or a step's `if`, or inside
# the value itself. Its Play track is none, and the gate writes its skipped
# report with a fixed reason instead of joining a room.
#
# scripts/test-release-dry.sh reads all of that off this file, for every job
# and step there is: a new one that names a secret without the guard fails it.

permissions:
  contents: read

# A newer build supersedes an older one: without this a dispatch made while another
# run is in flight pays for both, and only the later result is ever used.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  OLCBOX_VERSION_MAJOR_MINOR: "1.0"
  # The public TestFlight link. A release has no iOS asset to download, and the
  # App Store trails by however long App Review takes, so the notes point here.
  TESTFLIGHT_PUBLIC_URL: "https://testflight.apple.com/join/sU7aTHQv"
  # The engine is not named here. It is OLCRTC_VERSION in scripts/cores-pins.sh,
  # which release_version resolves to a full commit (scripts/olcrtc-pin.sh); the
  # gate tests that commit and every build job checks it out. Android and the
  # desktop used to build the tip of the fork's `proofkit` branch while iOS
  # linked the pin, so one release could carry two engines.
  #
  # Every Go step below reads this. It used to be `stable`, and `stable` moved
  # from 1.26.5 to 1.27.1 between two runs of the cores bind: the 1.27.1 build
  # left golang.org/x/net/http2.(*Transport).connPool undefined in every slice
  # and Xcode could not link it (see scripts/cores-pins.sh). The Android job
  # builds sing-box and Xray — .so-named executables — from that same dependency
  # graph with the same external linker step, so the same toolchain is pinned
  # here for the same reason. It must equal GO_VERSION in scripts/cores-pins.sh,
  # and release_version fails when it does not.
  GO_VERSION: "1.26.5"
  # ProofKit fork versionCode = PATCH_BASE + github.run_number (RUN_NUMBER_BASE 0,
  # since run numbers reset to 1 on this fork). PATCH_BASE is set ABOVE upstream's
  # current nightly (1.0.112) so our builds always read as the NEWEST version — the
  # in-app updater (repointed to ghostlane-project/ghostlane) then never offers users an
  # upstream build, and 1.0.2xx > any 1.0.1xx. Monotonic, so Android updates install.
  OLCBOX_RELEASE_RUN_NUMBER_BASE: "0"
  # 300, not 200, since 2026-09-09: the App Store already carries 1.0.301 from a
  # laptop-stamped upload, and Apple refuses a bundle whose version is below the
  # last approved one. Every platform moves together, Android's versionCode
  # included, which only ever has to grow.
  OLCBOX_RELEASE_PATCH_BASE: "300"
  # crypt1 client key + admin unlock hash, baked into GeneratedAppInfo by the
  # gradle GenerateAppInfoTask. Empty when the secrets are unset ⇒ crypt/admin
  # compile but stay disabled (plain links still work; the tap gesture is inert).
  OLCBOX_CRYPT_KEY_V1: ${{ secrets.OLCBOX_CRYPT_KEY_V1 }}
  OLCBOX_ADMIN_PASS_SHA256: ${{ secrets.OLCBOX_ADMIN_PASS_SHA256 }}

jobs:
  # Decides which platform jobs run. A push to a release branch always builds
  # everything; a manual dispatch builds only what was asked for.
  plan:
    runs-on: ubuntu-latest
    outputs:
      # 'true' only when the guard said so. Everything that signs, uploads to
      # a store or publishes asks for exactly that, so an output that was
      # never written is a dry run.
      signed: ${{ steps.guard.outputs.signed }}
      # The input in a run that signs, none in a dry run.
      play_track: ${{ steps.guard.outputs.play_track }}
      macos_arm64: ${{ steps.p.outputs.macos_arm64 }}
      macos_intel: ${{ steps.p.outputs.macos_intel }}
      windows: ${{ steps.p.outputs.windows }}
      linux: ${{ steps.p.outputs.linux }}
      android: ${{ steps.p.outputs.android }}
      ios: ${{ steps.p.outputs.ios }}
      publish: ${{ steps.p.outputs.publish }}
      cli: ${{ steps.p.outputs.cli }}
      macos_any: ${{ steps.p.outputs.macos_any }}
      macos_matrix: ${{ steps.p.outputs.macos_matrix }}
    steps:
      - name: Checkout the guard
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      # First, and nothing before it but the checkout of the commit being
      # built. A refusal (a signed_head that names another commit) stops the
      # run here, before the gate and before any build.
      - name: Dry or signed
        id: guard
        env:
          GUARD_REF: ${{ github.ref }}
          GUARD_SHA: ${{ github.sha }}
          GUARD_DRY_RUN: ${{ inputs.dry_run }}
          GUARD_SIGNED_HEAD: ${{ inputs.signed_head }}
          GUARD_PLAY_TRACK: ${{ inputs.play_track }}
        run: |
          set -euo pipefail
          # Through a file, so a refusal part-way writes no output at all.
          scripts/release-guard.sh decide > "$RUNNER_TEMP/guard.out"
          cat "$RUNNER_TEMP/guard.out" >> "$GITHUB_OUTPUT"
          sed -n 's/^why=//p' "$RUNNER_TEMP/guard.out" >> "$GITHUB_STEP_SUMMARY"

      # A run that signs builds only a core commit the store line holds (the
      # `ghostlane` branch of the core's repository); it stops here otherwise.
      # A dry run prints the same finding and goes on.
      - name: The core pin against the store line
        env:
          GH_TOKEN: ${{ github.token }}
          GUARD_SIGNED: ${{ steps.guard.outputs.signed }}
        run: scripts/release-guard.sh pin

      # Correction to the commit that added this: the secrets were set. The
      # claim that they were not came from reading the APK with an anchored
      # grep, and dex strings carry a length byte in front, so `^[0-9a-f]{64}$`
      # could never match anything. The guard is still worth having; its
      # original justification was not established.
      #
      # A build without these is not a broken build — it is a working build of a
      # different app, and it says so nowhere. crypt1 links stop importing, which
      # takes the partner's subscriptions with them, and the admin gate is off,
      # which puts an operator's edge addresses on every tester's screen. Both
      # were shipped once exactly this way, and the first report was two users
      # saying "the link does not activate" about two different links with one
      # cause.
      - name: Secrets are set
        run: |
          missing=""
          [ -n "${OLCBOX_CRYPT_KEY_V1}" ] || missing="${missing} OLCBOX_CRYPT_KEY_V1"
          [ -n "${OLCBOX_ADMIN_PASS_SHA256}" ] || missing="${missing} OLCBOX_ADMIN_PASS_SHA256"
          if [ -n "${missing}" ]; then
            echo "Missing repository secrets:${missing}"
            echo
            echo "crypt1 links will not import and the configurator will be"
            echo "visible to everyone. Set them in Settings -> Secrets and"
            echo "variables -> Actions, then run this again."
            exit 1
          fi
          # Set, but in the wrong shape, disables crypt1 just as silently:
          # CryptCodec.decodeMaster wants base64 of 32 bytes. The coordinator
          # stores the same key as 64 hex characters, which base64-decodes to
          # 48 and is rejected.
          case "${OLCBOX_CRYPT_KEY_V1}" in
            *[!0-9a-fA-F]*) : ;;
            ????????????????????????????????????????????????????????????????)
              echo "OLCBOX_CRYPT_KEY_V1 looks like 64 hex characters."
              echo "The client wants base64 of those 32 bytes:"
              echo "  python3 -c 'import base64,sys;print(base64.b64encode(bytes.fromhex(sys.argv[1])).decode())' <hex>"
              exit 1
              ;;
          esac
          echo "crypt1 key and admin hash are both present."

      - name: Resolve requested platforms
        id: p
        env:
          SIGNED: ${{ steps.guard.outputs.signed }}
        run: |
          # Dispatch is the only trigger, so the selection is always the input.
          # It used to fall back to "all" on a push to main, which meant every
          # commit — a doc fix included — paid for two 10x macOS legs plus four
          # more platforms.
          sel="${{ inputs.platforms }}"
          echo "selection: $sel"
          mac_arm=false; mac_intel=false; win=false; lin=false; andr=false; ios=false; pub=false; cli=false
          case "$sel" in
            all)
              mac_arm=true; mac_intel=true; win=true; lin=true; andr=true; ios=true; pub=true; cli=true ;;
            desktop)
              mac_arm=true; win=true; lin=true ;;
            # `mobile` used to mean Android only, which read as "the mobile
            # builds" and quietly left iOS out — the one platform whose build is
            # hardest to reproduce locally. It now means both, and either half
            # can be asked for on its own: an iOS change should not have to pay
            # for an Android build, and an Android change should not touch a 10x
            # runner at all.
            mobile)
              andr=true; ios=true ;;
            android)
              andr=true ;;
            ios)
              ios=true ;;
            cli)
              cli=true ;;
            *)
              mac_arm=true ;;
          esac
          # A dry run publishes nothing, whatever was asked for. The publish
          # jobs ask the guard themselves; this is the same answer once more.
          if [ "$SIGNED" != true ]; then
            pub=false
          fi
          # Each key written exactly once: duplicate keys in $GITHUB_OUTPUT are
          # ambiguous and would make the selection depend on parsing order.
          {
            echo "macos_arm64=$mac_arm"
            echo "macos_intel=$mac_intel"
            echo "windows=$win"
            echo "linux=$lin"
            echo "android=$andr"
            echo "ios=$ios"
            echo "publish=$pub"
            echo "cli=$cli"
          } >> "$GITHUB_OUTPUT"

          # The macOS matrix is built here rather than filtered in the job: a
          # matrix leg cannot be skipped by an `if`, so a disabled arch would still
          # occupy a 10x runner.
          # Written as full `if` blocks, not `[ ... ] && ...`: steps run under
          # `bash -e`, where a test that evaluates false is the line's exit status
          # and kills the step. `mobile` builds no macOS leg and would have died here.
          legs=""
          if [ "$mac_arm" = true ]; then
            legs='{"runner":"macos-latest","arch":"arm64"}'
          fi
          if [ "$mac_intel" = true ]; then
            if [ -n "$legs" ]; then legs="$legs,"; fi
            legs="$legs{\"runner\":\"macos-15-intel\",\"arch\":\"amd64\"}"
          fi
          any=false
          if [ -n "$legs" ]; then any=true; fi
          {
            echo "macos_any=$any"
            echo "macos_matrix={\"include\":[$legs]}"
          } >> "$GITHUB_OUTPUT"

  release_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      # The name is kept so the five build checkouts read the same output; its
      # value is now the full commit of the pin, never a branch.
      olcrtc_ref: ${{ steps.pin.outputs.olcrtc_sha }}
      olcrtc_version: ${{ steps.pin.outputs.olcrtc_version }}
      olcrtc_on_proofkit: ${{ steps.pin.outputs.olcrtc_on_proofkit }}
      olcrtc_proofkit_ahead_by: ${{ steps.pin.outputs.olcrtc_proofkit_ahead_by }}
      nightly_tag: ${{ steps.version.outputs.nightly_tag }}
      nightly_title: ${{ steps.version.outputs.nightly_title }}

    steps:
      - name: Checkout the pins
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      # Once, here, on Linux: the Windows job must never source cores-pins.sh
      # (no .gitattributes, so its checkout has CRLF and a value would end in \r).
      # actions/checkout takes a commit only as 40 hex, which is why the 12-hex
      # tail of OLCRTC_VERSION is resolved rather than passed along.
      - name: Resolve the engine pin
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scripts/olcrtc-pin.sh > "$RUNNER_TEMP/pin.out"
          cat "$RUNNER_TEMP/pin.out" >> "$GITHUB_OUTPUT"

      - name: One toolchain pin
        env:
          PINNED_GO: ${{ steps.pin.outputs.go_version }}
        run: |
          if [ "$PINNED_GO" != "$GO_VERSION" ]; then
            echo "::error::release.yml's GO_VERSION (${GO_VERSION}) and scripts/cores-pins.sh's (${PINNED_GO}) disagree; the Cores and every other build must use one toolchain"
            exit 1
          fi

      - name: Resolve release version
        id: version
        run: |
          patch=$((OLCBOX_RELEASE_PATCH_BASE + GITHUB_RUN_NUMBER - OLCBOX_RELEASE_RUN_NUMBER_BASE))

          if [ "$patch" -le "$OLCBOX_RELEASE_PATCH_BASE" ]; then
            echo "Computed Android versionCode ${patch} is not greater than ${OLCBOX_RELEASE_PATCH_BASE}" >&2
            exit 1
          fi

          if [ "${GITHUB_REF_NAME}" = "universal-carrier" ]; then
            nightly_tag="nightly-universal-carrier"
            nightly_title="Nightly Ghostlane universal-carrier builds"
          else
            nightly_tag="nightly"
            nightly_title="Nightly Ghostlane builds"
          fi

          {
            echo "version=${OLCBOX_VERSION_MAJOR_MINOR}.${patch}"
            echo "version_code=${patch}"
            echo "nightly_tag=${nightly_tag}"
            echo "nightly_title=${nightly_title}"
          } >> "$GITHUB_OUTPUT"

  # The engine under load before anything is built from it
  # (.github/workflows/gate.yml, docs/release-gate.md). Every build job and the
  # publish job need it: a red or cancelled gate builds and publishes nothing.
  # Needing `plan` first means its secrets preflight fails a broken dispatch
  # before the gate spends its twenty minutes.
  gate:
    name: Release gate
    needs: [plan, release_version]
    permissions:
      contents: read
    uses: ./.github/workflows/gate.yml
    with:
      mode: release
      app_version: ${{ needs.release_version.outputs.version }}
      engine_sha: ${{ needs.release_version.outputs.olcrtc_ref }}
      engine_version: ${{ needs.release_version.outputs.olcrtc_version }}
      skip: ${{ inputs.gate == 'skip' }}
      skip_reason: ${{ inputs.gate_reason }}
      # A run that signs nothing joins no live room: the gate walks no leg and
      # writes its skipped report with a fixed reason (gate.yml, Dry).
      dry: ${{ needs.plan.outputs.signed != 'true' }}
      # A literal: `with:` of a reusable-workflow call cannot read `env`. warn
      # while the gate runs the local target only; fail is meant for when the
      # link target (a fleet node) is compared release to release.
      compare_severity: warn
    # Named one by one, never `inherit`: the gate sees its own six secrets and
    # none of the signing keys.
    secrets:
      GATE_TELEMOST_ROOMS: ${{ secrets.GATE_TELEMOST_ROOMS }}
      GATE_WBSTREAM_ROOMS: ${{ secrets.GATE_WBSTREAM_ROOMS }}
      GATE_WBSTREAM_TOKEN: ${{ secrets.GATE_WBSTREAM_TOKEN }}
      GATE_JITSI_HOSTS: ${{ secrets.GATE_JITSI_HOSTS }}
      GATE_VKCALLS_ROOMS: ${{ secrets.GATE_VKCALLS_ROOMS }}
      GATE_MTSLINK_ROOMS: ${{ secrets.GATE_MTSLINK_ROOMS }}

  build-windows:
    needs: [release_version, plan, gate]
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      OLCBOX_VERSION: ${{ needs.release_version.outputs.version }}
      OLCBOX_VERSION_CODE: ${{ needs.release_version.outputs.version_code }}
      # Empty in a dry run, which does not reach the signing step either.
      WINDOWS_CODESIGN_CERTIFICATE_BASE64: ${{ needs.plan.outputs.signed == 'true' && secrets.WINDOWS_CODESIGN_CERTIFICATE_BASE64 || '' }}
      WINDOWS_CODESIGN_CERTIFICATE_PASSWORD: ${{ needs.plan.outputs.signed == 'true' && secrets.WINDOWS_CODESIGN_CERTIFICATE_PASSWORD || '' }}
      WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_CODESIGN_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}

    steps:
      - name: Checkout olcbox
        uses: actions/checkout@v7
        with:
          path: olcbox

      - name: Checkout olcrtc
        uses: actions/checkout@v7
        with:
          repository: ghostlane-project/olcrtc
          ref: ${{ needs.release_version.outputs.olcrtc_ref }}
          path: olcrtc
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: olcrtc/go.sum

      # Same omission the Android and Linux jobs had. Named with `.exe` here, and
      # only here: makeExecutable() is a no-op on Windows, so the extension is the
      # only thing that makes the file runnable — DesktopNativeAssets asks for
      # `native/sing-box.exe` on this platform and `native/sing-box` on the others.
      # sing-box is built, not downloaded: the release archives carry a Reality
      # hello Xray-core servers refuse from v26.7 on (scripts/patches/
      # sing-box-reality-hello.patch says how). Same tree on every platform.
      - name: Build sing-box (the patched tree)
        shell: bash
        working-directory: olcbox
        run: bash scripts/build-singbox.sh desktopApp/src/main/resources/native/sing-box.exe

      - name: Bundle sing-box + Xray cores into the app
        shell: pwsh
        working-directory: olcbox
        env:
          XRAY_VERSION: "26.7.11"
        run: |
          $ErrorActionPreference = "Stop"
          $dest = "desktopApp/src/main/resources/native"
          New-Item -ItemType Directory -Force $dest | Out-Null

          $xr = "https://github.com/XTLS/Xray-core/releases/download/v$env:XRAY_VERSION/Xray-windows-64.zip"
          Invoke-WebRequest -Uri $xr -OutFile xray.zip
          Remove-Item -Recurse -Force xr-x -ErrorAction SilentlyContinue
          Expand-Archive xray.zip -DestinationPath xr-x
          Copy-Item (Get-ChildItem xr-x -Recurse -Filter "xray.exe" | Select-Object -First 1).FullName "$dest/xray.exe"

          Write-Host "== bundled cores =="
          Get-ChildItem $dest
          # Runs them, because "the file is present" is the half of this that was
          # never in doubt. If Windows will not execute what we packaged, it says so
          # here and not on a user's machine.
          & "$dest/sing-box.exe" version | Select-Object -First 1
          & "$dest/xray.exe" version | Select-Object -First 1

      - name: Build Windows installers and portable zip
        shell: pwsh
        working-directory: olcbox
        run: |
          $env:OLCRTC_REPO="${{ github.workspace }}\olcrtc"
          .\gradlew.bat "-Polcbox.version=$env:OLCBOX_VERSION" :desktopApp:packageReleaseExe :desktopApp:packageReleaseMsi :desktopApp:packageReleasePortableZip --stacktrace

      - name: Prepare asset
        shell: pwsh
        working-directory: olcbox
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = Get-ChildItem "desktopApp/build/compose/binaries/main-release/exe/*.exe" | Select-Object -First 1
          $msi = Get-ChildItem "desktopApp/build/compose/binaries/main-release/msi/*.msi" | Select-Object -First 1
          $zip = Get-ChildItem "desktopApp/build/compose/binaries/main-release/portable/*.zip" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $zip) {
            $portableDir = "desktopApp/build/compose/binaries/main-release/portable"
            $appRoot = "desktopApp/build/compose/binaries/main-release/app"
            $appImage = Get-ChildItem $appRoot -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -eq $appImage) {
              throw "Portable app image not found under $appRoot"
            }
            New-Item -ItemType Directory -Force $portableDir | Out-Null
            $portableZip = Join-Path $portableDir "Ghostlane-windows-amd64-portable.zip"
            Compress-Archive -Path $appImage.FullName -DestinationPath $portableZip -Force
            $zip = Get-Item $portableZip
          }
          Copy-Item $exe.FullName "dist/Ghostlane-${env:OLCBOX_VERSION}-windows-amd64.exe"
          Copy-Item $msi.FullName "dist/Ghostlane-${env:OLCBOX_VERSION}-windows-amd64.msi"
          Copy-Item $zip.FullName "dist/Ghostlane-${env:OLCBOX_VERSION}-windows-amd64-portable.zip"

      - name: Sign Windows release assets
        if: needs.plan.outputs.signed == 'true'
        shell: pwsh
        working-directory: olcbox
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_CERTIFICATE_PASSWORD)) {
            Write-Host "Windows code signing secrets are not configured; publishing unsigned assets."
            exit 0
          }

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signtool) {
            throw "signtool.exe was not found on the Windows runner"
          }

          $certPath = Join-Path $env:RUNNER_TEMP "olcbox-windows-codesign.pfx"
          [IO.File]::WriteAllBytes(
            $certPath,
            [Convert]::FromBase64String(($env:WINDOWS_CODESIGN_CERTIFICATE_BASE64 -replace '\s', ''))
          )

          function Sign-File([string]$Path) {
            & $signtool.FullName sign `
              /fd SHA256 `
              /tr $env:WINDOWS_CODESIGN_TIMESTAMP_URL `
              /td SHA256 `
              /f $certPath `
              /p $env:WINDOWS_CODESIGN_CERTIFICATE_PASSWORD `
              $Path
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to sign $Path"
            }
          }

          $exeAsset = Get-ChildItem "dist/Ghostlane-*-windows-amd64.exe" | Select-Object -First 1
          $msiAsset = Get-ChildItem "dist/Ghostlane-*-windows-amd64.msi" | Select-Object -First 1
          Sign-File $exeAsset.FullName
          Sign-File $msiAsset.FullName

          $portableZip = (Get-ChildItem "dist/Ghostlane-*-windows-amd64-portable.zip" | Select-Object -First 1).FullName
          $portableDir = Join-Path $env:RUNNER_TEMP "olcbox-portable-sign"
          Remove-Item $portableDir -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $portableZip -DestinationPath $portableDir
          Get-ChildItem $portableDir -Recurse -Filter *.exe | ForEach-Object {
            Sign-File $_.FullName
          }
          Remove-Item $portableZip -Force
          Compress-Archive -Path (Join-Path $portableDir '*') -DestinationPath $portableZip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Ghostlane-windows-amd64
          path: |
            olcbox/dist/Ghostlane-*-windows-amd64.exe
            olcbox/dist/Ghostlane-*-windows-amd64.msi
            olcbox/dist/Ghostlane-*-windows-amd64-portable.zip

  build-macos:
    needs: [release_version, plan, gate]
    if: needs.plan.outputs.macos_any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.macos_matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      OLCBOX_VERSION: ${{ needs.release_version.outputs.version }}
      OLCBOX_VERSION_CODE: ${{ needs.release_version.outputs.version_code }}

    steps:
      - name: Checkout olcbox
        uses: actions/checkout@v7
        with:
          path: olcbox

      - name: The commit of the core
        id: pin
        working-directory: olcbox
        run: |
          set -euo pipefail
          bash scripts/ghostlane-core-resolve.sh > "$RUNNER_TEMP/core.env"
          . "$RUNNER_TEMP/core.env"
          echo "commit=$GHOSTLANE_CORE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "toolchain=$GHOSTLANE_CORE_TOOLCHAIN" >> "$GITHUB_OUTPUT"
          echo "hev=$(git rev-parse HEAD:androidApp/src/main/jni/hev-socks5-tunnel)" >> "$GITHUB_OUTPUT"
          echo "GHOSTLANE_CORE_COMMIT=$GHOSTLANE_CORE_COMMIT" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/core.env" >> "$GITHUB_STEP_SUMMARY"

      # The Core build's programs for the Macs, under its keys: a dry run of
      # this job builds nothing when the Core build has run at the pin.
      - name: The Core build's engine for the Macs
        uses: actions/cache/restore@v6
        with:
          path: olcbox/out/apple
          key: core-build-apple-${{ steps.pin.outputs.commit }}-rust-${{ steps.pin.outputs.toolchain }}-${{ hashFiles('olcbox/scripts/build-ghostlane-core-host.sh') }}

      - name: The Core build's hev for the Macs
        uses: actions/cache/restore@v6
        with:
          path: olcbox/out/hev-macos
          key: core-build-hev-macos-${{ steps.pin.outputs.hev }}-${{ hashFiles('olcbox/scripts/build-hev-macos.sh') }}

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Import Developer ID certificate
        if: needs.plan.outputs.signed == 'true'
        env:
          MACOS_CODESIGN_CERTIFICATE_BASE64: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_BASE64 }}
          MACOS_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CODESIGN_CERTIFICATE_BASE64:-}" ]; then
            echo "No macOS signing secrets; the build stays unsigned (Gatekeeper will need xattr)."
            exit 0
          fi

          # A dedicated keychain, so nothing leaks into the runner's login one and
          # the private key is reachable by codesign without an interactive prompt.
          kc="$RUNNER_TEMP/olcbox-signing.keychain-db"
          pw="$(uuidgen)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"

          cert="$RUNNER_TEMP/developer-id.p12"
          echo "$MACOS_CODESIGN_CERTIFICATE_BASE64" | tr -d '[:space:]' | base64 --decode > "$cert"
          security import "$cert" -k "$kc" -P "$MACOS_CODESIGN_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$cert"

          # Without this codesign blocks on a UI prompt that no one can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')

          echo "== identities available =="
          security find-identity -v -p codesigning "$kc"

      # One program at the app's one pin, for this runner's own architecture,
      # and hev for the helper. The Core build's cache holds both when it has
      # run at the pin and at this hev; otherwise they are built here, and a
      # dry run proves the fallback.
      - name: Build ghostlane-engine and hev at the pin
        working-directory: olcbox
        env:
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [ "$MATRIX_ARCH" = "arm64" ]; then target=aarch64-apple-darwin; else target=x86_64-apple-darwin; fi
          engine="out/apple/bin/$target/ghostlane-engine"
          if [ -s "$engine" ]; then
            echo "ghostlane-engine for $target at ${GHOSTLANE_CORE_COMMIT:0:12}: restored from the Core build's cache"
          else
            GHOSTLANE_CORE_SRC="$RUNNER_TEMP/core-src" bash scripts/build-ghostlane-core-host.sh out/apple "$target"
          fi
          [ -s "$engine" ] || { echo "the build wrote no ghostlane-engine for $target" >&2; exit 1; }
          cat out/apple/report.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

          if [ -s out/hev-macos/hev-socks5-tunnel ]; then
            echo "hev for macOS: restored from the Core build's cache"
          else
            bash scripts/build-hev-macos.sh androidApp/src/main/jni/hev-socks5-tunnel out/hev-macos
          fi
          [ -s out/hev-macos/hev-socks5-tunnel ] || { echo "the build wrote no hev" >&2; exit 1; }
          lipo -archs out/hev-macos/hev-socks5-tunnel

      - name: Bundle the engine at the pin, and no Go core
        working-directory: olcbox
        env:
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [ "$MATRIX_ARCH" = "arm64" ]; then target=aarch64-apple-darwin; else target=x86_64-apple-darwin; fi
          dest="desktopApp/src/main/resources/native"
          mkdir -p "$dest"
          install -m 0755 "out/apple/bin/$target/ghostlane-engine" "$dest/ghostlane-engine"

          # An old build's Go cores have no place in this package. A name
          # here would go into the jar and be found by K1 below.
          for gone in sing-box xray olcrtc; do
            if [ -e "$dest/$gone" ]; then echo "$dest/$gone is staged" >&2; exit 1; fi
          done
          echo "== bundled core =="; ls -la "$dest"

          # The version event is the engine's own word about its pin, its
          # protocol and whether it links BoringSSL. Reading it here keeps
          # a cached program of another pin out of the DMG.
          "$dest/ghostlane-engine" version > "$RUNNER_TEMP/engine-version.jsonl"
          python3 -I - "$RUNNER_TEMP/engine-version.jsonl" "$GHOSTLANE_CORE_COMMIT" <<'PY'
          import json, sys
          lines = [line for line in open(sys.argv[1], encoding="utf-8").read().splitlines() if line.strip()]
          v = json.loads(lines[0]) if lines else {}
          if v.get("event") != "version":
              sys.exit("its first line is no version event: %r" % (lines[:1],))
          if v.get("protocol") != 1:
              sys.exit("it reads protocol %r; this app writes protocol 1" % v.get("protocol"))
          if v.get("pin") != sys.argv[2]:
              sys.exit("it was built from %s, not from the pin %s" % (v.get("pin"), sys.argv[2]))
          if not v.get("boringssl"):
              sys.exit("it carries no BoringSSL")
          print("ghostlane-engine %s at %s (%s; rooms %s, BoringSSL %s)" % (
              v["engine"], v["pin"][:12], v["target"], v.get("rooms"), v["boringssl"]))
          PY

      - name: Sign the bundled engine
        if: needs.plan.outputs.signed == 'true'
        working-directory: olcbox
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_SIGN_IDENTITY:-}" ]; then
            echo "No signing identity; leaving the engine as the Core build signed it."
            exit 0
          fi

          # The engine arrives from the Core build carrying an ad hoc
          # signature. The app spawns it, and notarisation scans the jar it
          # travels in, so it is signed with the team's identity here. (hev is
          # signed by the build's embed step, inside the app's Resources.)
          core=desktopApp/src/main/resources/native/ghostlane-engine
          codesign --force --timestamp --options runtime \
            --entitlements desktopApp/macos-entitlements.plist \
            --sign "$MACOS_SIGN_IDENTITY" "$core"
          codesign --verify --verbose=2 "$core"

      # No identity in a dry run: Gradle then builds the DMG unsigned, as it
      # does for a checkout without the secret.
      - name: Build macOS DMG
        working-directory: olcbox
        env:
          MACOS_SIGN_IDENTITY: ${{ needs.plan.outputs.signed == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
        run: |
          ./gradlew -Polcbox.version="${OLCBOX_VERSION}" :desktopApp:packageReleaseDmg --stacktrace

      # Compose runs codesign itself and, on failure, prints the command and the
      # *path* to the error — never the error. A build once failed here with
      # nothing to go on but "Exit code: 1" and a filename on a runner that no
      # longer exists. Whatever codesign actually said is worth the four lines.
      - name: Why codesign failed
        if: failure()
        working-directory: olcbox
        run: |
          for log in desktopApp/build/compose/logs/**/*.txt desktopApp/build/compose/logs/*/*; do
            [ -f "$log" ] || continue
            echo "=== $log"
            tail -40 "$log"
          done

      - name: Prepare asset
        working-directory: olcbox
        run: |
          mkdir -p dist
          cp desktopApp/build/compose/binaries/main-release/dmg/*.dmg "dist/Ghostlane-${OLCBOX_VERSION}-macos-${{ matrix.arch }}.dmg"

      # Against the finished DMG, not the staging directory. Compose packs
      # `resources.srcDir` into the app's jar, so a check that only looked at
      # loose files would pass or fail for the wrong reason. The app is copied
      # out of the image: the engine is run from what came out of the jar (the
      # pin it prints is the one inside the asset), hev and the helper are the
      # loose files the helper reads, and the signature is read as Gatekeeper
      # reads it (a dry run's is ad hoc, and has to hold as well).
      - name: The engine inside the DMG prints the pin, and the bundle's signature holds
        working-directory: olcbox
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          dmg="dist/Ghostlane-${OLCBOX_VERSION}-macos-${ARCH}.dmg"
          mnt="$RUNNER_TEMP/dmg-mount"
          mkdir -p "$mnt"
          hdiutil attach -nobrowse -readonly -noverify -noautoopen -mountpoint "$mnt" "$dmg" >/dev/null
          trap 'hdiutil detach -force "$mnt" >/dev/null 2>&1 || true' EXIT
          app=$(find "$mnt" -maxdepth 1 -name '*.app' -print -quit)
          [ -n "$app" ] || { echo "no .app in the DMG" >&2; exit 1; }
          rm -rf "$RUNNER_TEMP/app" && mkdir -p "$RUNNER_TEMP/app"
          ditto "$app" "$RUNNER_TEMP/app/$(basename "$app")"
          app="$RUNNER_TEMP/app/$(basename "$app")"

          for need in Contents/MacOS/ProofKitTunnelDaemon Contents/Resources/hev-socks5-tunnel \
                      Contents/Library/LaunchDaemons/org.olcbox.app.desktopApp.tunneld.plist; do
            [ -e "$app/$need" ] || { echo "$need is missing from the app" >&2; exit 1; }
          done
          if [ -e "$app/Contents/Resources/sing-box" ]; then
            echo "a sing-box is packaged in the app" >&2; exit 1
          fi
          echo "ok      the helper and hev are in the app, and no sing-box"

          entries=$(mktemp)
          find "$app" -type f -name '*.jar' -print0 | xargs -0 -r -I{} unzip -Z1 {} 2>/dev/null >>"$entries" || true
          grep -qE "(^|/)native/ghostlane-engine$" "$entries" || {
            echo "ghostlane-engine is missing from the app's jars" >&2; exit 1;
          }
          if grep -qE "(^|/)native/(sing-box|xray|olcrtc[^/]*|libolcrtc[^/]*)$" "$entries"; then
            echo "A Go core is packaged in the app's jars" >&2; exit 1
          fi
          echo "ok      native/ghostlane-engine, and no Go core"

          jar=""
          while IFS= read -r -d '' candidate; do
            if unzip -Z1 "$candidate" 2>/dev/null | grep -qx 'native/ghostlane-engine'; then
              jar="$candidate"; break
            fi
          done < <(find "$app" -type f -name '*.jar' -print0)
          [ -n "$jar" ] || { echo "no jar in the app holds native/ghostlane-engine" >&2; exit 1; }
          engine=$(mktemp)
          unzip -p "$jar" native/ghostlane-engine > "$engine"
          chmod +x "$engine"
          "$engine" version > "$RUNNER_TEMP/image-engine-version.jsonl"
          python3 -I - "$RUNNER_TEMP/image-engine-version.jsonl" "$GHOSTLANE_CORE_COMMIT" <<'PY'
          import json, sys
          lines = [line for line in open(sys.argv[1], encoding="utf-8").read().splitlines() if line.strip()]
          v = json.loads(lines[0]) if lines else {}
          if v.get("event") != "version" or v.get("pin") != sys.argv[2]:
              sys.exit("the engine in the DMG says %r, not pin %s" % (lines[:1], sys.argv[2]))
          if v.get("protocol") != 1 or not v.get("boringssl"):
              sys.exit("the engine in the DMG is not the app's: %r" % v)
          print("inside the DMG: ghostlane-engine %s at %s" % (v["engine"], v["pin"][:12]))
          PY

          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict "$app/Contents/Resources/hev-socks5-tunnel"
          codesign --verify --strict "$app/Contents/MacOS/ProofKitTunnelDaemon"
          echo "ok      codesign --verify --deep --strict holds for the app, hev and the helper"

          # The helper's own directories of the app, as a file K1 can open:
          # what root's daemon runs and copies from.
          tar -C "$app" -cf "$RUNNER_TEMP/helper-dirs.tar" Contents/MacOS Contents/Resources Contents/Library
          rm -rf "$RUNNER_TEMP/app" "$entries" "$engine"

      # K1 against the finished DMG and the helper's directories. The macOS
      # entries are gone from the allow list: Go anywhere in the asset, at any
      # nesting, fails the job.
      - name: No Go in the macOS asset
        working-directory: olcbox
        run: |
          set -euo pipefail
          bash scripts/check-no-go.sh --summary "$GITHUB_STEP_SUMMARY" \
            "dist/Ghostlane-${OLCBOX_VERSION}-macos-${{ matrix.arch }}.dmg" \
            "$RUNNER_TEMP/helper-dirs.tar"

      - name: Submit for notarisation
        id: notarise
        if: needs.plan.outputs.signed == 'true'
        working-directory: olcbox
        env:
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          dmg="dist/Ghostlane-${OLCBOX_VERSION}-macos-${ARCH}.dmg"

          # Every macOS build is notarised, published or not.
          #
          # It used to be published builds only, and that was the right trade
          # while a test build's worst case was one right-click → Open. It stopped
          # being right when the app grew a root daemon: the user is now asked to
          # authorise a background item that runs as root, and asking that of an
          # app macOS has just called unverified is a bad way to earn it. Whether
          # SMAppService outright refuses to register from an un-notarised bundle
          # is not documented either way — and finding out costs a session on a
          # real Mac, which is more expensive than the queue.
          #
          # The queue itself is not paid for on a 10x runner: this step submits
          # and leaves, a 1x runner polls for the verdict, and this machine comes
          # back only for the seconds stapling takes.
          if [ -z "${MACOS_NOTARY_KEY_BASE64:-}" ]; then
            echo "No notary credentials; publishing a signed-but-not-notarised DMG."
            exit 0
          fi

          key="$RUNNER_TEMP/notary.p8"
          echo "$MACOS_NOTARY_KEY_BASE64" | tr -d '[:space:]' | base64 --decode > "$key"

          # Deliberately no --wait: Apple's queue has taken up to twenty minutes,
          # and waiting it out here bills a 10x runner for doing nothing. A 1x
          # runner polls for the verdict instead, and this machine is only needed
          # again for the seconds stapling takes.
          out="$(xcrun notarytool submit "$dmg" \
            --key "$key" \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID" 2>&1)"
          rm -f "$key"
          echo "$out"

          # awk reads to the end: an awk that exits at the first id leaves
          # printf writing into a closed pipe, and under pipefail that
          # SIGPIPE failed the step after Apple had the upload (1.0.472).
          sub_id="$(printf '%s\n' "$out" | awk '/id: / && !found {print $2; found = 1}')"
          test -n "$sub_id" || { echo "no submission id came back"; exit 1; }
          echo "$sub_id" > dist/notary-submission-id.txt
          echo "id=$sub_id" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Ghostlane-macos-${{ matrix.arch }}-dmg
          path: |
            olcbox/dist/Ghostlane-*-macos-${{ matrix.arch }}.dmg
            olcbox/dist/notary-submission-id.txt

  build-linux:
    needs: [release_version, plan, gate]
    if: needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OLCBOX_VERSION: ${{ needs.release_version.outputs.version }}
      OLCBOX_VERSION_CODE: ${{ needs.release_version.outputs.version_code }}

    steps:
      - name: Checkout olcbox
        uses: actions/checkout@v7
        with:
          path: olcbox

      - name: Checkout olcrtc
        uses: actions/checkout@v7
        with:
          repository: ghostlane-project/olcrtc
          ref: ${{ needs.release_version.outputs.olcrtc_ref }}
          path: olcrtc
          submodules: recursive

      - name: The commit of the core
        id: pin
        working-directory: olcbox
        run: |
          set -euo pipefail
          bash scripts/ghostlane-core-resolve.sh > "$RUNNER_TEMP/core.env"
          . "$RUNNER_TEMP/core.env"
          echo "commit=$GHOSTLANE_CORE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "toolchain=$GHOSTLANE_CORE_TOOLCHAIN" >> "$GITHUB_OUTPUT"
          echo "GHOSTLANE_CORE_COMMIT=$GHOSTLANE_CORE_COMMIT" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/core.env" >> "$GITHUB_STEP_SUMMARY"

      - name: The Core build's program for Linux
        uses: actions/cache/restore@v6
        with:
          path: olcbox/out/core
          key: core-build-x86_64-unknown-linux-musl-${{ steps.pin.outputs.commit }}-rust-${{ steps.pin.outputs.toolchain }}-${{ hashFiles('olcbox/scripts/build-ghostlane-core-host.sh', 'olcbox/scripts/build-hev-linux.sh') }}

      - name: Install Linux build and packaging deps
        run: |
          sudo apt-get update
          sudo apt-get install -y file cmake clang lld llvm libclang-dev p7zip-full squashfs-tools zstd cpio

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: olcrtc/go.sum

      - name: Setup appimagetool
        run: |
          curl -L -o /tmp/appimagetool.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool.AppImage

      # One program, at the app's one pin. The build script writes every
      # target it can to out/core and reports what it proved; the Core build
      # keeps the same key, so a dry run of this job builds once at most.
      - name: Build ghostlane-engine at the pin
        working-directory: olcbox
        env:
          TARGET: x86_64-unknown-linux-musl
        run: |
          set -euo pipefail
          engine="out/core/bin/$TARGET/ghostlane-engine"
          if [ -s "$engine" ]; then
            echo "ghostlane-engine for $TARGET at ${GHOSTLANE_CORE_COMMIT:0:12}: restored from the Core build's cache"
          else
            GHOSTLANE_CORE_SRC="$RUNNER_TEMP/core-src" \
            GHOSTLANE_MUSL_TOOLCHAIN_DIR="$RUNNER_TEMP/musl" \
              bash scripts/build-ghostlane-core-host.sh out/core "$TARGET"
          fi
          [ -s "$engine" ] || { echo "the build wrote no ghostlane-engine" >&2; exit 1; }
          cat out/core/report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Bundle the engine at the pin, and no Go core
        working-directory: olcbox
        run: |
          set -euo pipefail
          dest="desktopApp/src/main/resources/native"
          mkdir -p "$dest"
          engine="out/core/bin/x86_64-unknown-linux-musl/ghostlane-engine"
          install -m 0755 "$engine" "$dest/ghostlane-engine"

          # An old build's Go cores have no place in this package. A name
          # here would go into the jar and be found by K1 below.
          for gone in sing-box xray olcrtc; do
            if [ -e "$dest/$gone" ]; then echo "$dest/$gone is staged" >&2; exit 1; fi
          done
          echo "== bundled core =="; ls -la "$dest"

          # The version event is the engine's own word about its pin, its
          # protocol and whether it links BoringSSL. Reading it here keeps
          # a cached program of another pin out of the AppImage.
          "$dest/ghostlane-engine" version > "$RUNNER_TEMP/engine-version.jsonl"
          python3 -I - "$RUNNER_TEMP/engine-version.jsonl" "$GHOSTLANE_CORE_COMMIT" <<'PY'
          import json, sys
          lines = [line for line in open(sys.argv[1], encoding="utf-8").read().splitlines() if line.strip()]
          v = json.loads(lines[0]) if lines else {}
          if v.get("event") != "version":
              sys.exit("its first line is no version event: %r" % (lines[:1],))
          if v.get("protocol") != 1:
              sys.exit("it reads protocol %r; this app writes protocol 1" % v.get("protocol"))
          if v.get("pin") != sys.argv[2]:
              sys.exit("it was built from %s, not from the pin %s" % (v.get("pin"), sys.argv[2]))
          if not v.get("boringssl"):
              sys.exit("it carries no BoringSSL")
          print("ghostlane-engine %s at %s (%s; rooms %s, BoringSSL %s)" % (
              v["engine"], v["pin"][:12], v["target"], v.get("rooms"), v["boringssl"]))
          PY

      - name: Build Linux AppImage
        working-directory: olcbox
        run: |
          export OLCRTC_REPO="${{ github.workspace }}/olcrtc"
          export APPIMAGETOOL=/tmp/appimagetool.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./gradlew -Polcbox.version="${OLCBOX_VERSION}" :desktopApp:packageReleaseLinuxAppImage --stacktrace

      - name: Prepare asset
        working-directory: olcbox
        run: |
          mkdir -p dist
          cp desktopApp/build/compose/binaries/main-release/appimage/*.AppImage "dist/Ghostlane-${OLCBOX_VERSION}-linux-amd64.AppImage"

      # Against the finished AppImage, not the staging directory. Compose packs
      # `resources.srcDir` into the app jar, so a check that only looked at loose
      # files would pass or fail for the wrong reason. The engine is run from
      # what came out of the jar: the pin it prints is the one inside the asset.
      - name: The engine inside the AppImage prints the pin
        working-directory: olcbox
        run: |
          set -euo pipefail
          img="dist/Ghostlane-${OLCBOX_VERSION}-linux-amd64.AppImage"
          chmod +x "$img"
          rm -rf squashfs-root && "./$img" --appimage-extract >/dev/null

          entries=$(mktemp)
          find squashfs-root -type f -printf '%P\n' >>"$entries"
          find squashfs-root -type f -name '*.jar' -print0 \
            | xargs -0 -r -I{} unzip -Z1 {} 2>/dev/null >>"$entries" || true

          grep -qE "(^|/)native/ghostlane-engine$" "$entries" || {
            echo "ghostlane-engine is missing from the AppImage" >&2; exit 1;
          }
          if grep -qE "(^|/)native/(sing-box|xray|olcrtc[^/]*)$" "$entries"; then
            echo "A Go core is packaged in the AppImage" >&2; exit 1
          fi
          echo "ok      native/ghostlane-engine, and no Go core"

          jar=""
          while IFS= read -r -d '' candidate; do
            if unzip -Z1 "$candidate" 2>/dev/null | grep -qx 'native/ghostlane-engine'; then
              jar="$candidate"; break
            fi
          done < <(find squashfs-root -type f -name '*.jar' -print0 | sort -z)
          [ -n "$jar" ] || { echo "no jar in the AppImage holds native/ghostlane-engine" >&2; exit 1; }
          engine=$(mktemp)
          unzip -p "$jar" native/ghostlane-engine > "$engine"
          chmod +x "$engine"
          "$engine" version > "$RUNNER_TEMP/image-engine-version.jsonl"
          python3 -I - "$RUNNER_TEMP/image-engine-version.jsonl" "$GHOSTLANE_CORE_COMMIT" <<'PY'
          import json, sys
          lines = [line for line in open(sys.argv[1], encoding="utf-8").read().splitlines() if line.strip()]
          v = json.loads(lines[0]) if lines else {}
          if v.get("event") != "version" or v.get("pin") != sys.argv[2]:
              sys.exit("the engine in the AppImage says %r, not pin %s" % (lines[:1], sys.argv[2]))
          if v.get("protocol") != 1 or not v.get("boringssl"):
              sys.exit("the engine in the AppImage is not the app's: %r" % v)
          print("inside the AppImage: ghostlane-engine %s at %s" % (v["engine"], v["pin"][:12]))
          PY
          rm -rf squashfs-root "$entries" "$engine"

      # K1 against the finished AppImage. The Linux entry is gone from the
      # allow list: Go anywhere in the asset, at any nesting, fails the job.
      - name: No Go in the Linux asset
        working-directory: olcbox
        run: |
          set -euo pipefail
          bash scripts/check-no-go.sh --summary "$GITHUB_STEP_SUMMARY" \
            "dist/Ghostlane-${OLCBOX_VERSION}-linux-amd64.AppImage"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Ghostlane-linux-amd64-appimage
          path: olcbox/dist/Ghostlane-*-linux-amd64.AppImage

  # The Linux CLI: one free runner builds the Rust program for amd64, arm64 and
  # armv7 (static, musl), puts the core's engine at the pin and the tun's hev
  # beside each, packages deb/rpm/apk/arch + tarballs, sums and signs them with
  # the release key, and templates the installer with this version. K1 reads
  # every package and the image of each platform; K11 runs the armv7 program
  # and engine under qemu-user. The artifact name starts with Ghostlane- so the
  # publish job picks it up like every other asset.
  build-cli:
    needs: [release_version, plan, gate]
    if: needs.plan.outputs.cli == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      OLCBOX_VERSION: ${{ needs.release_version.outputs.version }}
      OLCBOX_CRYPT_KEY_V1: ${{ secrets.OLCBOX_CRYPT_KEY_V1 }}
      CORE_OUT: ${{ github.workspace }}/out/linux
      HEV_OUT: ${{ github.workspace }}/out/hev-linux
    steps:
      - uses: actions/checkout@v7
      # The key reaches the two steps that need it and no other; a dry run
      # reaches neither, and its packages and sums carry no signature.
      - name: Signing key is set
        if: needs.plan.outputs.signed == 'true'
        env:
          CLI_RELEASE_SIGNING_KEY: ${{ secrets.CLI_RELEASE_SIGNING_KEY }}
        run: |
          [ -n "${CLI_RELEASE_SIGNING_KEY}" ] || { echo "::error::CLI_RELEASE_SIGNING_KEY is not set; the CLI release is signed or not built"; exit 1; }
      - name: The commit of the core
        id: pin
        run: |
          set -euo pipefail
          bash scripts/ghostlane-core-resolve.sh > "$RUNNER_TEMP/core.env"
          . "$RUNNER_TEMP/core.env"
          echo "GHOSTLANE_CORE_COMMIT=$GHOSTLANE_CORE_COMMIT" >> "$GITHUB_ENV"
          echo "x86=core-build-x86_64-unknown-linux-musl-${GHOSTLANE_CORE_COMMIT}-rust-${GHOSTLANE_CORE_TOOLCHAIN}-${{ hashFiles('scripts/build-ghostlane-core-host.sh', 'scripts/build-hev-linux.sh') }}" >> "$GITHUB_OUTPUT"
          echo "arm64=core-build-aarch64-unknown-linux-musl-${GHOSTLANE_CORE_COMMIT}-rust-${GHOSTLANE_CORE_TOOLCHAIN}-${{ hashFiles('scripts/build-ghostlane-core-host.sh', 'scripts/build-hev-linux.sh') }}" >> "$GITHUB_OUTPUT"
          echo "arm7=core-build-armv7-unknown-linux-musleabihf-${GHOSTLANE_CORE_COMMIT}-rust-${GHOSTLANE_CORE_TOOLCHAIN}-${{ hashFiles('scripts/build-ghostlane-core-host.sh', 'scripts/build-hev-linux.sh') }}" >> "$GITHUB_OUTPUT"
          echo "hev=core-build-hev-linux-$(git rev-parse HEAD:androidApp/src/main/jni/hev-socks5-tunnel)-${{ hashFiles('scripts/build-hev-linux.sh') }}" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/core.env" >> "$GITHUB_STEP_SUMMARY"
      # The Core build's programs, one cache a target (each holds its own
      # bin/<target>); what none holds is built next.
      - name: The Core build's engine for amd64
        uses: actions/cache/restore@v6
        with:
          path: out/linux
          key: ${{ steps.pin.outputs.x86 }}
      - name: The Core build's engine for arm64
        uses: actions/cache/restore@v6
        with:
          path: out/linux
          key: ${{ steps.pin.outputs.arm64 }}
      - name: The Core build's engine for armv7
        uses: actions/cache/restore@v6
        with:
          path: out/linux
          key: ${{ steps.pin.outputs.arm7 }}
      - name: The Core build's hev
        uses: actions/cache/restore@v6
        with:
          path: out/hev-linux
          key: ${{ steps.pin.outputs.hev }}
      - name: What the caches did not hold
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends cmake clang lld llvm libclang-dev qemu-user-static
          GHOSTLANE_CORE_SRC="$RUNNER_TEMP/core-src" GHOSTLANE_MUSL_TOOLCHAIN_DIR="$RUNNER_TEMP/musl" \
            bash cli/packaging/make-core.sh x86_64-unknown-linux-musl aarch64-unknown-linux-musl armv7-unknown-linux-musleabihf
      - name: Build, package, sum
        env:
          GHOSTLANE_MUSL_TOOLCHAIN_DIR: ${{ runner.temp }}/musl
        run: |
          set -euo pipefail
          sh cli/packaging/install-nfpm.sh "$RUNNER_TEMP/nfpm"
          [ -n "${OLCBOX_CRYPT_KEY_V1}" ] || echo "::warning::OLCBOX_CRYPT_KEY_V1 is not set; this CLI build cannot read crypt1 lists"
          cd cli
          make dist VERSION="${OLCBOX_VERSION}" CRYPT_KEY_V1="${OLCBOX_CRYPT_KEY_V1}" NFPM="$RUNNER_TEMP/nfpm/nfpm"
      # K1 on every package, and on the image of each platform as the release
      # pushes it (the same files, the same Dockerfile). The docker driver cannot
      # export a foreign platform's image as a tar: buildx's container driver and
      # qemu can.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: No Go in the packages and the image
        run: |
          set -euo pipefail
          cd cli
          sh packaging/docker/stage.sh dist "${OLCBOX_VERSION}"
          for platform in linux/amd64 linux/arm64 linux/arm/v7; do
            docker buildx build --platform "$platform" -f packaging/docker/Dockerfile \
              -o "type=docker,dest=$RUNNER_TEMP/image-$(echo "$platform" | tr / -).tar" .
          done
          cd ..
          bash scripts/check-no-go.sh --summary "$GITHUB_STEP_SUMMARY" \
            cli/dist/ghostlane-cli-"${OLCBOX_VERSION}"-linux-* "$RUNNER_TEMP"/image-linux-*.tar
      # K11: the 32-bit program and its engine run under qemu-user, and the
      # program reads the pin of the engine beside it.
      - name: The armv7 program and engine run under qemu-user
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/arm7"
          mkdir "$dir"
          tar -C "$dir" -xzf "cli/dist/ghostlane-cli-${OLCBOX_VERSION}-linux-arm7.tar.gz"
          qemu-arm-static "$dir/ghostlane-engine" version
          GHOSTLANE_ENGINE="$dir/ghostlane-engine" qemu-arm-static "$dir/ghostlane" version --json | tee "$dir/version.json"
          # the program asks the engine by running it, which qemu-user does
          # not do for a child: the pin is the one the engine just printed
          grep -q "\"version\": \"${OLCBOX_VERSION}\"" "$dir/version.json"
      - name: Sign
        if: needs.plan.outputs.signed == 'true'
        working-directory: cli
        env:
          CLI_RELEASE_SIGNING_KEY: ${{ secrets.CLI_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "${CLI_RELEASE_SIGNING_KEY}" > "$RUNNER_TEMP/cli-signing.pem"
          make sign VERSION="${OLCBOX_VERSION}" KEY="$RUNNER_TEMP/cli-signing.pem"
          rm -f "$RUNNER_TEMP/cli-signing.pem"
      - name: Only what ships
        working-directory: cli
        run: |
          set -euo pipefail
          rm -rf dist/linux-* dist/nfpm-*.yaml dist/docker
          ls -la dist
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Ghostlane-cli-linux
          path: |
            cli/dist/ghostlane-cli-*
            cli/dist/install.sh

  build-android:
    needs: [release_version, plan, gate]
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      OLCBOX_VERSION: ${{ needs.release_version.outputs.version }}
      OLCBOX_VERSION_CODE: ${{ needs.release_version.outputs.version_code }}
      ANDROID_NDK_VERSION: "28.2.13676358"
      # The Rust core is built from scripts/ghostlane-core-pin.sh by
      # scripts/build-ghostlane-core-android.sh. No Go engine is built here:
      # the Go code left in the tree for A7 is neither packaged nor started.
      # The two version markers stay until the CLI's flip: cli/internal/pins
      # reads SINGBOX_VERSION from this file to hold cli/go.mod to the pin.
      SINGBOX_VERSION: "1.13.14"
      XRAY_VERSION: "26.7.11"
      # The five below are empty in a dry run. The signing step then takes its
      # branch for a checkout without the secrets (a throw-away keystore, so
      # the APK installs and the bundle is whole), and nothing goes to Play.
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ needs.plan.outputs.signed == 'true' && secrets.ANDROID_RELEASE_KEYSTORE_BASE64 || '' }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ needs.plan.outputs.signed == 'true' && secrets.ANDROID_RELEASE_STORE_PASSWORD || '' }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ needs.plan.outputs.signed == 'true' && secrets.ANDROID_RELEASE_KEY_ALIAS || '' }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ needs.plan.outputs.signed == 'true' && secrets.ANDROID_RELEASE_KEY_PASSWORD || '' }}
      # A Google Cloud service account invited into the Play Console with
      # "Release to testing tracks" (and "Release to production" for that
      # track). Absent, the play bundle is built and kept as an artifact only.
      PLAY_SERVICE_ACCOUNT_JSON: ${{ needs.plan.outputs.signed == 'true' && secrets.PLAY_SERVICE_ACCOUNT_JSON || '' }}

    steps:
      - name: Checkout olcbox
        uses: actions/checkout@v7
        with:
          path: olcbox

      - name: Checkout olcrtc
        uses: actions/checkout@v7
        with:
          repository: ghostlane-project/olcrtc
          ref: ${{ needs.release_version.outputs.olcrtc_ref }}
          path: olcrtc
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: olcrtc/go.sum

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's default is 'tools platform-tools'; the legacy tools
          # package is no longer in Google's repository (2026-09-15) and sdkmanager
          # fails the whole step over it. The next step installs what the build needs.
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}"

      # The core links BoringSSL through CMake and needs bindgen's libclang.
      - name: Build tools for the Rust core
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends cmake clang libclang-dev
          cmake --version | head -1
          clang --version | head -1

      - name: Restore the cargo cache
        id: core-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            olcbox/out/core/src/target
          key: rust-core-android-${{ hashFiles('olcbox/scripts/ghostlane-core-pin.sh') }}
          restore-keys: rust-core-android-

      # One output directory: jniLibs (three ABIs, stripped), symbols (the same
      # libraries before the strip), the UniFFI Kotlin bindings and the report
      # that pins the commit, checks BoringSSL and every LOAD segment's page size.
      - name: Build ghostlane-core for Android
        working-directory: olcbox
        run: |
          set -euo pipefail
          bash scripts/build-ghostlane-core-android.sh "${GITHUB_WORKSPACE}/olcbox/out/core" 2>&1 \
            | tee "$RUNNER_TEMP/core-build.log"
          {
            echo '### ghostlane-core for Android'
            echo '```'
            cat "$GITHUB_WORKSPACE/olcbox/out/core/report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the cargo cache
        if: always() && steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            olcbox/out/core/src/target
          key: rust-core-android-${{ hashFiles('olcbox/scripts/ghostlane-core-pin.sh') }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Go mobile tooling
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install github.com/magefile/mage@latest

      - name: Initialize gomobile
        working-directory: olcrtc
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          gomobile init

      - name: Configure Android release signing
        working-directory: olcbox
        run: |
          if [ -n "${ANDROID_RELEASE_KEYSTORE_BASE64}" ] &&
             [ -n "${ANDROID_RELEASE_STORE_PASSWORD}" ] &&
             [ -n "${ANDROID_RELEASE_KEY_ALIAS}" ] &&
             [ -n "${ANDROID_RELEASE_KEY_PASSWORD}" ]; then
            printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" | tr -d '\r\n' | base64 --decode > release-keystore.jks

            # Whitespace survives a paste into `gh secret set`, and Java's
            # Properties does not trim the end of a value — so an invisible space
            # becomes an alias that does not exist, with nothing at all to see.
            alias="$(printf '%s' "${ANDROID_RELEASE_KEY_ALIAS}" | tr -d '\r\n' \
              | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            store_pw="$(printf '%s' "${ANDROID_RELEASE_STORE_PASSWORD}" | tr -d '\r\n')"
            key_pw="$(printf '%s' "${ANDROID_RELEASE_KEY_PASSWORD}" | tr -d '\r\n')"

            # Asked here rather than discovered by Gradle six minutes later, where
            # it arrives as a KeytoolException under thirty frames of packager
            # stack and says nothing about which aliases the keystore does have.
            if ! keytool -list -keystore release-keystore.jks \
                   -storepass "${store_pw}" -alias "${alias}" >/dev/null 2>&1; then
              echo "No key with that alias in the keystore. It holds:" >&2
              keytool -list -keystore release-keystore.jks -storepass "${store_pw}" 2>/dev/null \
                | grep -i "PrivateKeyEntry" >&2 || echo "  (no private keys at all)" >&2
              # The value is masked in this log, so its length is the only way to
              # tell "wrong name" from "right name with an invisible character" —
              # and the two have completely different fixes.
              echo "ANDROID_RELEASE_KEY_ALIAS is ${#alias} characters after trimming." >&2
              echo "If that count is not what you typed, the secret carries something" >&2
              echo "invisible; otherwise set it to the name in the first column above." >&2
              exit 1
            fi

            cat > keystore.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=${store_pw}
          keyAlias=${alias}
          keyPassword=${key_pw}
          EOF
          else
            # ProofKit fork: no release secrets → generate an EPHEMERAL keystore so
            # the release APK is self-signed and sideloadable (Android requires a
            # signature to install at all). Not Play-Store-publishable; add the real
            # ANDROID_RELEASE_* secrets later and the branch above takes over.
            echo "No Android release secrets; self-signing with an ephemeral keystore (sideload only)."
            keytool -genkeypair -v -keystore release-keystore.jks \
              -storepass proofkit -keypass proofkit -alias proofkit \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=ProofKit olcbox, O=ProofKit, C=US"
            cat > keystore.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=proofkit
          keyAlias=proofkit
          keyPassword=proofkit
          EOF
          fi

      # The Android cores used to be sing-box and Xray children, exec'd from
      # the app's native library directory. They are gone from this job: the
      # Rust library is in the app process, and every ABI's LOAD segments were
      # 16 KiB-aligned by build-ghostlane-core-android.sh before the APK was made.
      - name: Build production APK
        working-directory: olcbox
        run: |
          export OLCRTC_REPO="${{ github.workspace }}/olcrtc"
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          ./gradlew -Polcbox.version="${OLCBOX_VERSION}" -Polcbox.versionCode="${OLCBOX_VERSION_CODE}" \
            -PghostlaneCoreDir="${GITHUB_WORKSPACE}/olcbox/out/core" \
            :sharedUI:jvmTest :androidApp:assembleGithubRelease :androidApp:bundlePlayRelease --stacktrace

      - name: Prepare universal Android release asset
        working-directory: olcbox
        run: |
          mkdir -p dist
          release_apk="$(find androidApp/build/outputs/apk/github/release -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          if [ -z "${release_apk}" ]; then
            echo "Android release APK was not found" >&2
            exit 1
          fi
          cp "${release_apk}" "dist/Ghostlane-${OLCBOX_VERSION}-android-release.apk"

      # Beside the APKs, never instead of them. Play does not accept an APK for a
      # new app, and the APKs are the channel nobody can revoke — clients for
      # circumventing blocks do get pulled from stores, and the day that happens
      # is the wrong day to discover the other channel was dropped to make room.
      - name: Prepare the play-flavor App Bundle for Google Play
        working-directory: olcbox
        run: |
          set -euo pipefail
          bundle="$(find androidApp/build/outputs/bundle/playRelease -type f -name '*.aab' | sort | head -n 1)"
          if [ -z "${bundle}" ]; then
            echo "Android App Bundle (play flavor) was not found" >&2
            exit 1
          fi
          aab="dist/Ghostlane-${OLCBOX_VERSION}-android-play.aab"
          cp "${bundle}" "$aab"

          # What makes this bundle the Play one: the two permissions Play refuses
          # at upload are gone (src/play/AndroidManifest.xml), and the Rust core
          # is in. The manifest inside a bundle is protobuf, but permission names
          # are stored as plain strings, so grep sees them.
          manifest="$(mktemp)"
          unzip -p "$aab" base/manifest/AndroidManifest.xml > "$manifest"
          for perm in android.permission.REQUEST_INSTALL_PACKAGES android.permission.QUERY_ALL_PACKAGES; do
            if grep -a -q "$perm" "$manifest"; then
              echo "::error::${perm} is still in the play bundle's manifest; Play would refuse it." >&2
              exit 1
            fi
            echo "ok   no ${perm}"
          done
          # The listing is read once into a file: a bundle lists thousands of
          # entries, and `unzip -l | grep -q` under pipefail races — grep exits
          # on the first match, unzip takes EPIPE on its next write, and the
          # pipeline reports failure for a core that is there.
          listing="$(mktemp)"
          unzip -l "$aab" > "$listing"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for lib in libghostlane_core.so libjnidispatch.so; do
              grep -q "base/lib/${abi}/${lib}" "$listing" \
                || { echo "MISSING ${abi}/${lib} in the bundle" >&2; exit 1; }
              echo "ok   ${abi}/${lib}"
            done
          done
          for go in libgojni.so libsingboxcore.so libxraycore.so; do
            if grep -q "$go" "$listing"; then
              echo "Go core ${go} is in the bundle" >&2; exit 1
            fi
          done
          ls -la dist/

      # Asserted against the finished artifact, not against the staging directory.
      # An ABI filter or a packaging rule can drop the core on the way in, and
      # only the APK can show that. K1 reads the same file for Go later in this job.
      - name: Verify the Rust core packaged in the universal APK
        working-directory: olcbox
        run: |
          set -euo pipefail
          apk="dist/Ghostlane-${OLCBOX_VERSION}-android-release.apk"
          listing="$(mktemp)"
          unzip -l "$apk" > "$listing"
          missing=0
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for lib in libghostlane_core.so libjnidispatch.so; do
              if grep -q "lib/${abi}/${lib}" "$listing"; then
                echo "ok   ${abi}/${lib}"
              else
                echo "MISSING ${abi}/${lib}"; missing=1
              fi
            done
          done
          for go in libgojni.so libsingboxcore.so libxraycore.so; do
            if grep -q "$go" "$listing"; then
              echo "Go core ${go} is in the APK" >&2; missing=1
            fi
          done
          [ "$missing" -eq 0 ] || {
            echo "The APK is not the Rust-core build. Refusing to publish." >&2
            exit 1
          }

      - name: Build armeabi-v7a production APK
        working-directory: olcbox
        run: |
          export OLCRTC_REPO="${{ github.workspace }}/olcrtc"
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          ./gradlew -Polcbox.version="${OLCBOX_VERSION}" -Polcbox.versionCode="${OLCBOX_VERSION_CODE}" \
            -Polcbox.android.abiFilters=armeabi-v7a -PghostlaneCoreDir="${GITHUB_WORKSPACE}/olcbox/out/core" \
            :androidApp:clean :androidApp:assembleGithubRelease --stacktrace

      - name: Prepare armeabi-v7a Android release asset
        working-directory: olcbox
        run: |
          release_apk="$(find androidApp/build/outputs/apk/github/release -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          if [ -z "${release_apk}" ]; then
            echo "Android armeabi-v7a release APK was not found" >&2
            exit 1
          fi
          cp "${release_apk}" "dist/Ghostlane-${OLCBOX_VERSION}-android-armeabi-v7a-release.apk"

      - name: Verify the Rust core packaged in the armeabi-v7a APK
        working-directory: olcbox
        run: |
          set -euo pipefail
          apk="dist/Ghostlane-${OLCBOX_VERSION}-android-armeabi-v7a-release.apk"
          listing="$(mktemp)"
          unzip -l "$apk" > "$listing"
          for lib in libghostlane_core.so libjnidispatch.so; do
            grep -q "lib/armeabi-v7a/${lib}" "$listing" \
              || { echo "MISSING armeabi-v7a/${lib}" >&2; exit 1; }
            echo "ok   armeabi-v7a/${lib}"
          done
          for go in libgojni.so libsingboxcore.so libxraycore.so; do
            if grep -q "$go" "$listing"; then
              echo "Go core ${go} is in the APK" >&2; exit 1
            fi
          done

      # A 16 KiB-page device dies before executing a 4 KiB-aligned library.
      # Read the LOAD alignment out of the packaged bytes with Python's zip
      # module: no unzip wildcard, no temporary extraction and no shell
      # arithmetic on a reader's output. The core's report checks all three
      # ABIs at build time; armv7 is 32-bit and outside the page-size rule.
      - name: Verify the native libraries in the APK are 16 KiB aligned
        working-directory: olcbox
        run: |
          set -euo pipefail
          apk="dist/Ghostlane-${OLCBOX_VERSION}-android-release.apk"
          python3 - "$apk" <<'PY'
          import struct
          import sys
          import zipfile

          apk = sys.argv[1]
          bad = []
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              for abi in ("arm64-v8a", "x86_64"):
                  for lib in ("libghostlane_core.so", "libjnidispatch.so"):
                      name = "lib/%s/%s" % (abi, lib)
                      if name not in names:
                          bad.append("MISSING " + name)
                          continue
                      data = z.read(name)
                      if data[:4] != b"\x7fELF":
                          bad.append("not an ELF: " + name)
                          continue
                      elf_class = data[4]
                      if elf_class == 2:
                          phoff, = struct.unpack_from("<Q", data, 32)
                          phentsize, phnum = struct.unpack_from("<HH", data, 54)
                          p_align = lambda at: struct.unpack_from("<Q", data, at + 48)[0]
                      elif elf_class == 1:
                          phoff, = struct.unpack_from("<I", data, 28)
                          phentsize, phnum = struct.unpack_from("<HH", data, 42)
                          p_align = lambda at: struct.unpack_from("<I", data, at + 28)[0]
                      else:
                          bad.append("unknown ELF class %d: %s" % (elf_class, name))
                          continue
                      aligns = []
                      for i in range(phnum):
                          at = phoff + i * phentsize
                          if struct.unpack_from("<I", data, at)[0] == 1:  # PT_LOAD
                              aligns.append(p_align(at))
                      if not aligns:
                          bad.append("no LOAD segment in " + name)
                      elif any(a % 16384 for a in aligns):
                          bad.append("MISALIGNED %s: %s" % (name, aligns))
                      else:
                          print("ok         %s: %s" % (name, aligns))
          if bad:
              print("\n".join(bad), file=sys.stderr)
              sys.exit(1)
          PY

      # The symbols are not shipped inside the APK: they sit beside it in the
      # artifact, one file per ABI, for a reader of a native stack trace.
      - name: Keep the native symbols per ABI
        working-directory: olcbox
        run: |
          set -euo pipefail
          mkdir -p dist/symbols
          for abi in arm64-v8a armeabi-v7a x86_64; do
            f="${GITHUB_WORKSPACE}/olcbox/out/core/symbols/${abi}/libghostlane_core.so"
            [ -s "$f" ] || { echo "no symbols for ${abi}" >&2; exit 1; }
            mkdir -p "dist/symbols/${abi}"
            cp "$f" "dist/symbols/${abi}/libghostlane_core.so"
          done
          ls -l dist/symbols/*/*.so

      # K1 against the finished assets, with the Android allow-list entries
      # removed by this flip. A Go core anywhere in the APK, the armv7 APK or
      # the AAB fails the release before anything is uploaded.
      - name: No Go in the Android assets
        working-directory: olcbox
        run: |
          set -euo pipefail
          bash scripts/check-no-go.sh --summary "$GITHUB_STEP_SUMMARY" \
            "dist/Ghostlane-${OLCBOX_VERSION}-android-release.apk" \
            "dist/Ghostlane-${OLCBOX_VERSION}-android-armeabi-v7a-release.apk" \
            "dist/Ghostlane-${OLCBOX_VERSION}-android-play.aab"

      # The same questions the build asks about its default, and the finished
      # APK/AAB and symbols, answered by CorePackagingTest on the JVM. AGP
      # creates unit-test tasks for its test build type (debug), not for the
      # release variant; the artifact paths are passed in as properties.
      - name: CorePackagingTest against the finished Android assets
        working-directory: olcbox
        run: |
          set -euo pipefail
          ./gradlew -Polcbox.version="${OLCBOX_VERSION}" \
            -PghostlaneCoreDir="${GITHUB_WORKSPACE}/olcbox/out/core" \
            "-Pghostlane.apk=${GITHUB_WORKSPACE}/olcbox/dist/Ghostlane-${OLCBOX_VERSION}-android-release.apk" \
            "-Pghostlane.aab=${GITHUB_WORKSPACE}/olcbox/dist/Ghostlane-${OLCBOX_VERSION}-android-play.aab" \
            "-Pghostlane.symbols=${GITHUB_WORKSPACE}/olcbox/out/core/symbols" \
            :androidApp:testGithubDebugUnitTest --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Ghostlane-android-apks
          path: |
            olcbox/dist/Ghostlane-*-android-release.apk
            olcbox/dist/Ghostlane-*-android-armeabi-v7a-release.apk
            olcbox/dist/Ghostlane-*-android-play.aab
            olcbox/dist/symbols/**

      # After the artifact, so a refusal from Play — the first bundle of an app
      # has to go through the console by hand, and a version code Play already
      # holds is refused — still leaves the APKs downloadable. Same shape as the
      # TestFlight upload: secret present means upload, absent means build only.
      #
      # `continue-on-error`, because this step is a distribution channel and not
      # the build. Without it a refusal from Play fails this job, and
      # publish-nightly is gated on `!contains(needs.*.result, 'failure')` — so
      # one rejected bundle would throw away a whole `all` run, macOS legs and
      # their 10x minutes included, over an upload that was never load-bearing.
      #
      # The path works: 1.0.399 reached the internal track from CI. What it is
      # not is guaranteed — a version code Play already holds is refused
      # outright, a track can be closed, and a token can expire — and none of
      # those should cost the release. The outcome is reported in the step
      # summary below, so making the failure non-fatal does not make it silent.
      - name: Upload the play bundle to Google Play
        id: play_upload
        continue-on-error: true
        if: needs.plan.outputs.signed == 'true' && env.PLAY_SERVICE_ACCOUNT_JSON != '' && needs.plan.outputs.play_track != 'none'
        working-directory: olcbox
        env:
          PLAY_TRACK: ${{ needs.plan.outputs.play_track }}
        run: |
          set -euo pipefail
          sa="$RUNNER_TEMP/play-service-account.json"
          printf '%s' "${PLAY_SERVICE_ACCOUNT_JSON}" > "$sa"
          # A venv for the same reason as the App Store Connect step: the
          # runner's Python refuses to install into itself.
          python3 -m venv "$RUNNER_TEMP/play-venv"
          "$RUNNER_TEMP/play-venv/bin/pip" install --quiet google-api-python-client google-auth
          "$RUNNER_TEMP/play-venv/bin/python" scripts/play-upload.py \
            --service-account "$sa" \
            --package org.proofkit.app \
            --bundle "dist/Ghostlane-${OLCBOX_VERSION}-android-play.aab" \
            --track "${PLAY_TRACK}" \
            --release-name "${OLCBOX_VERSION}" \
            --notes "Ghostlane ${OLCBOX_VERSION}" \
            --notes-file docs/release-notes/play-whats-new.txt
          rm -f "$sa"

      # Says what happened to the Play upload in the run summary, so that
      # "continue-on-error" cannot turn a refusal into silence. Never fails.
      - name: Report the Google Play upload
        if: always() && needs.plan.outputs.signed == 'true' && env.PLAY_SERVICE_ACCOUNT_JSON != '' && needs.plan.outputs.play_track != 'none'
        env:
          PLAY_TRACK: ${{ needs.plan.outputs.play_track }}
          PLAY_OUTCOME: ${{ steps.play_upload.outcome }}
        run: |
          set -euo pipefail
          if [ "$PLAY_OUTCOME" = "success" ]; then
            echo "Google Play: uploaded ${OLCBOX_VERSION} (${OLCBOX_VERSION_CODE}) to the ${PLAY_TRACK} track." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Google Play upload did NOT happen"
              echo
              echo "Track \`${PLAY_TRACK}\`, version ${OLCBOX_VERSION} (${OLCBOX_VERSION_CODE}) — step outcome: \`${PLAY_OUTCOME}\`."
              echo
              echo "The rest of the release is unaffected; the bundle is in the \`Ghostlane-android-apks\` artifact."
              echo "Common causes: the service account has not been granted access in Play Console yet,"
              echo "the app has never had a release created by hand (Play requires the first one through the console),"
              echo "or this version code was already used."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  build-ios:
    needs: [release_version, plan, gate]
    if: needs.plan.outputs.ios == 'true'
    runs-on: macos-latest
    permissions:
      contents: read

    env:
      OLCBOX_VERSION: ${{ needs.release_version.outputs.version }}
      OLCBOX_VERSION_CODE: ${{ needs.release_version.outputs.version_code }}

    steps:
      - name: Checkout olcbox
        uses: actions/checkout@v7
        with:
          path: olcbox

      # No Go in this build (I2). The runner image carries one; this puts a
      # `go` and a `gomobile` first on the PATH that fail with a name, so a
      # step that still wants Go stops the job instead of building it in. The
      # Xcode phases add only their own directories after this one.
      - name: Put a failing go on the PATH
        run: |
          set -euo pipefail
          shim="$RUNNER_TEMP/no-go-bin"
          mkdir -p "$shim"
          for tool in go gofmt gomobile gobind; do
            printf '#!/bin/sh\necho "::error::%s was run in the iOS build, which has no Go (I2)" >&2\nexit 1\n' "$tool" > "$shim/$tool"
            chmod +x "$shim/$tool"
          done
          echo "$shim" >> "$GITHUB_PATH"

      - name: The go on the PATH is the failing one
        run: |
          set -euo pipefail
          found="$(command -v go)"
          echo "go resolves to $found"
          [ "$found" = "$RUNNER_TEMP/no-go-bin/go" ] || { echo "::error::a real go is first on the PATH: $found" >&2; exit 1; }
          if go version 2>/dev/null; then echo "::error::go ran" >&2; exit 1; fi

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^26.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Not reached in a dry run: its `signed` output is then never written,
      # and the job takes the unsigned path below, as it does for a checkout
      # without the secrets.
      - name: Import the iOS distribution certificate
        id: signing
        if: needs.plan.outputs.signed == 'true'
        env:
          IOS_DIST_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          IOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
        run: |
          set -euo pipefail
          # Signing needs two things: the Apple Distribution certificate, and an
          # App Store Connect API key allowed to manage profiles and upload
          # builds (Admin or App Manager). The key is the notary one — same team,
          # same .p8. Without either, the job builds the unsigned IPA it always
          # built, so a fork or a missing secret degrades rather than fails.
          if [ -z "${IOS_DIST_CERTIFICATE_BASE64:-}" ] || [ -z "${MACOS_NOTARY_KEY_BASE64:-}" ]; then
            echo "No iOS signing secrets; building the unsigned IPA."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A dedicated keychain, as the macOS job does: nothing leaks into the
          # runner's login one and codesign reaches the key without a prompt.
          kc="$RUNNER_TEMP/ios-signing.keychain-db"
          pw="$(uuidgen)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"

          cert="$RUNNER_TEMP/apple-distribution.p12"
          echo "$IOS_DIST_CERTIFICATE_BASE64" | tr -d '[:space:]' | base64 --decode > "$cert"
          security import "$cert" -k "$kc" -P "$IOS_DIST_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$cert"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')

          echo "== identities available =="
          security find-identity -v -p codesigning "$kc"
          if ! security find-identity -v -p codesigning "$kc" | grep -q "Apple Distribution"; then
            echo "::error::IOS_DIST_CERTIFICATE_BASE64 holds no Apple Distribution identity; export that certificate with its private key from Keychain Access." >&2
            exit 1
          fi

          echo "$MACOS_NOTARY_KEY_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/asc.p8"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Provisioning profiles from App Store Connect
        if: needs.plan.outputs.signed == 'true' && steps.signing.outputs.signed == 'true'
        working-directory: olcbox
        env:
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
        run: |
          set -euo pipefail
          # Made by name from the team's distribution certificates and installed
          # where xcodebuild looks, so a renewed certificate costs a re-run, not
          # a new secret. See the script for what the key has to be allowed to do.
          # A venv, because the runner's Homebrew Python refuses to install into
          # itself (PEP 668, "externally-managed-environment").
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/asc-venv/bin/python" scripts/asc-profiles.py \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer-id "$MACOS_NOTARY_ISSUER_ID" \
            --key-path "$RUNNER_TEMP/asc.p8" \
            --capability "org.proofkit.app=ASSOCIATED_DOMAINS" \
            --profile "ProofKit App Store=org.proofkit.app" \
            --profile "ProofKit PacketTunnel App Store=org.proofkit.app.PacketTunnel"

      - name: Archive and upload to TestFlight
        if: needs.plan.outputs.signed == 'true' && steps.signing.outputs.signed == 'true'
        working-directory: olcbox
        env:
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
        run: |
          set -euo pipefail
          archive="build/ios-archive/ProofKit.xcarchive"

          # Manual signing with the distribution identity for both targets; the
          # profile each one takes is looked up by its own name, since a build
          # setting on the command line applies to every target at once.
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$archive" \
            -derivedDataPath build/ios-ipa/DerivedData \
            MARKETING_VERSION="${OLCBOX_VERSION}" \
            CURRENT_PROJECT_VERSION="${OLCBOX_VERSION_CODE}" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=3QJG3J7L66 \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            'PROVISIONING_PROFILE_SPECIFIER=$(PROFILE_$(TARGET_NAME))' \
            "PROFILE_iosApp=ProofKit App Store" \
            "PROFILE_PacketTunnel=ProofKit PacketTunnel App Store" \
            archive

          # The app and every extension inside it must carry the same version —
          # the same check the unsigned path makes, on the archived app.
          app_path="$archive/Products/Applications/iosApp.app"
          for plist in "$app_path/Info.plist" "$app_path"/PlugIns/*.appex/Info.plist; do
            [ -f "$plist" ] || continue
            short="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$plist")"
            build_number="$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$plist")"
            echo "$plist: $short ($build_number)"
            if [ "$short" != "${OLCBOX_VERSION}" ] || [ "$build_number" != "${OLCBOX_VERSION_CODE}" ]; then
              echo "::error::$plist says $short ($build_number), expected ${OLCBOX_VERSION} (${OLCBOX_VERSION_CODE})." >&2
              exit 1
            fi
          done

          # K1 on the archived app, before anything is uploaded: the app and the
          # extension inside it, at any nesting. Made into a zip because the
          # check reads files.
          rm -rf "$RUNNER_TEMP/k1-ipa" && mkdir -p "$RUNNER_TEMP/k1-ipa/Payload"
          cp -R "$app_path" "$RUNNER_TEMP/k1-ipa/Payload/"
          (cd "$RUNNER_TEMP/k1-ipa" && /usr/bin/zip -qry "$RUNNER_TEMP/Ghostlane-ios-archive.ipa" Payload)
          bash scripts/check-no-go.sh --summary "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/Ghostlane-ios-archive.ipa"

          cat > "$RUNNER_TEMP/export-options.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>3QJG3J7L66</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>org.proofkit.app</key>
              <string>ProofKit App Store</string>
              <key>org.proofkit.app.PacketTunnel</key>
              <string>ProofKit PacketTunnel App Store</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST

          # Uploaded by xcodebuild itself — no altool, no Transporter. The build
          # appears in TestFlight once Apple has processed it, usually within
          # ten minutes; internal testers get it without a review.
          xcodebuild \
            -exportArchive \
            -archivePath "$archive" \
            -exportOptionsPlist "$RUNNER_TEMP/export-options.plist" \
            -exportPath build/ios-export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$MACOS_NOTARY_KEY_ID" \
            -authenticationKeyIssuerID "$MACOS_NOTARY_ISSUER_ID"
          echo "Uploaded ProofKit ${OLCBOX_VERSION} (${OLCBOX_VERSION_CODE}) to App Store Connect."

      - name: Keep the dSYMs
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Ghostlane-ios-dSYMs
          path: olcbox/build/ios-archive/ProofKit.xcarchive/dSYMs

      - name: Build unsigned iOS app
        if: steps.signing.outputs.signed != 'true'
        working-directory: olcbox
        run: |
          # The same version every other platform gets, from the same job.
          # Without these two the build falls back to the literals in the
          # pbxproj, which is how the App Store came to show 1.0.0 for a build
          # whose own about screen said 1.0.24x. Passed on the command line so
          # they reach *every* target: the app and PacketTunnel must agree, and a
          # mismatch between them fails the install on a device rather than the
          # build.
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/ios-ipa/DerivedData \
            MARKETING_VERSION="${OLCBOX_VERSION}" \
            CURRENT_PROJECT_VERSION="${OLCBOX_VERSION_CODE}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        if: steps.signing.outputs.signed != 'true'
        working-directory: olcbox
        run: |
          app_path="build/ios-ipa/DerivedData/Build/Products/Release-iphoneos/iosApp.app"
          if [ ! -d "$app_path" ]; then
            echo "iOS app product was not found at $app_path" >&2
            exit 1
          fi

          # Xcode omits an Info.plist key entirely when the $(BUILD_SETTING) it
          # refers to is undefined, and PlistBuddy then fails with a bare "Entry,
          # Does Not Exist" that names neither the setting nor the target. Say
          # which key and why, because the answer is never in this file.
          for key in CFBundleShortVersionString CFBundleVersion; do
            if ! /usr/libexec/PlistBuddy -c "Print :$key" "$app_path/Info.plist" >/dev/null 2>&1; then
              echo "::error::$key is missing from the built Info.plist. Info.plist reads it from a build setting, and Xcode drops the key when that setting is undefined — check MARKETING_VERSION and CURRENT_PROJECT_VERSION are set on the iosApp target, not only on PacketTunnel." >&2
              exit 1
            fi
          done

          # Checked, not set. xcodebuild is handed MARKETING_VERSION and
          # CURRENT_PROJECT_VERSION above, so every target already carries them;
          # writing them again afterwards only papered over a broken build and,
          # worse, papered over it *for the app alone* — this used to Set the
          # app's Info.plist and never touch the extension's, which is how a
          # 1.0.0 appex could ride inside a 1.0.26x app. That mismatch fails the
          # install on a device, not the build, so it surfaces late and looks
          # like anything but a version.
          for plist in "$app_path/Info.plist" "$app_path"/PlugIns/*.appex/Info.plist; do
            [ -f "$plist" ] || continue
            short="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$plist")"
            build_number="$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$plist")"
            echo "$plist: $short ($build_number)"
            if [ "$short" != "${OLCBOX_VERSION}" ] || [ "$build_number" != "${OLCBOX_VERSION_CODE}" ]; then
              echo "::error::$plist says $short ($build_number), expected ${OLCBOX_VERSION} (${OLCBOX_VERSION_CODE}). The app and every extension inside it must agree." >&2
              exit 1
            fi
          done

          rm -rf build/ios-ipa/package dist
          mkdir -p build/ios-ipa/package/Payload dist
          cp -R "$app_path" build/ios-ipa/package/Payload/
          (cd build/ios-ipa/package && /usr/bin/zip -qry "${GITHUB_WORKSPACE}/olcbox/dist/Ghostlane-${OLCBOX_VERSION}-ios-unsigned.ipa" Payload)
          unzip -t "dist/Ghostlane-${OLCBOX_VERSION}-ios-unsigned.ipa"

          # K1 on the finished IPA: the app, its extension and every file in
          # them. A Go core anywhere in it fails the job before the upload.
          bash scripts/check-no-go.sh --summary "$GITHUB_STEP_SUMMARY" "dist/Ghostlane-${OLCBOX_VERSION}-ios-unsigned.ipa"

      - name: Upload artifact
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Ghostlane-ios-unsigned-ipa
          path: olcbox/dist/Ghostlane-${{ env.OLCBOX_VERSION }}-ios-unsigned.ipa


  notarise-wait:
    name: Wait for Apple (1x runner)
    needs: [plan, build-macos]
    # Not gated on publishing any more — see the submit step for why. This job is
    # a 1x runner sleeping, so running it for test builds too costs almost
    # nothing; the expensive machine was released before it started.
    #
    # Not in a dry run: nothing was submitted, and the notary's key stays unread.
    if: needs.plan.outputs.macos_any == 'true' && needs.plan.outputs.signed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.macos_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: Ghostlane-macos-${{ matrix.arch }}-dmg
          path: dist
      - name: Wait for the verdict
        env:
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ ! -f dist/notary-submission-id.txt ]; then
            echo "Nothing was submitted; the DMG is unsigned or the credentials are absent."
            exit 0
          fi
          pip install --quiet pyjwt cryptography
          python3 scripts/notary-wait.py "$(cat dist/notary-submission-id.txt)"

  staple-macos:
    name: Staple the ticket
    needs: [plan, release_version, notarise-wait]
    if: needs.plan.outputs.macos_any == 'true' && needs.plan.outputs.signed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.macos_matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      OLCBOX_VERSION: ${{ needs.release_version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Ghostlane-macos-${{ matrix.arch }}-dmg
          path: dist
      - name: Staple
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          dmg="dist/Ghostlane-${OLCBOX_VERSION}-macos-${ARCH}.dmg"
          if [ ! -f dist/notary-submission-id.txt ]; then
            echo "Not notarised; nothing to staple."
            exit 0
          fi
          # Seconds of a 10x runner instead of the twenty minutes the wait used
          # to cost. Stapling matters because it puts the approval inside the
          # file, so Gatekeeper is silent even for a user with no working path
          # to Apple — which, for a VPN's users, is not a rare situation.
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -t open --context context:primary-signature -vv "$dmg" || true
      - uses: actions/upload-artifact@v7
        with:
          name: Ghostlane-macos-${{ matrix.arch }}-dmg
          path: dist/Ghostlane-*-macos-${{ matrix.arch }}.dmg
          overwrite: true

  publish-nightly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs:
      - plan
      - release_version
      - gate
      - build-windows
      - build-macos
      - staple-macos
      - build-linux
      - build-cli
      - build-android
      - build-ios
    # Only a full build publishes. A partial run would otherwise replace the nightly
    # release with whichever platforms happened to be selected, silently dropping the
    # rest. Skipped builds must not block this, hence the explicit failure check
    # instead of relying on `needs` alone.
    #
    # And only a gated one. A red gate leaves every build SKIPPED rather than
    # failed, which the failure check alone would let through: this job would
    # publish a v1.0.N holding nothing but the gate's report and then delete and
    # recreate the rolling nightly the same way. Hence the gate's own result. A
    # gate skipped by request (gate: skip) passes, with a report that says so.
    #
    # And only a run that signs: a dry run publishes nothing, and none of the
    # three publish jobs is reached in one.
    if: ${{ needs.plan.outputs.signed == 'true' && needs.plan.outputs.publish == 'true' && needs.gate.result == 'success' && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    concurrency:
      group: publish-${{ github.repository }}-${{ needs.release_version.outputs.nightly_tag }}
      cancel-in-progress: false
    env:
      OLCBOX_VERSION: ${{ needs.release_version.outputs.version }}
      OLCBOX_VERSION_CODE: ${{ needs.release_version.outputs.version_code }}
      OLCBOX_OLCRTC_SHA: ${{ needs.release_version.outputs.olcrtc_ref }}
      OLCBOX_OLCRTC_VERSION: ${{ needs.release_version.outputs.olcrtc_version }}
      OLCBOX_OLCRTC_ON_PROOFKIT: ${{ needs.release_version.outputs.olcrtc_on_proofkit }}
      OLCBOX_OLCRTC_AHEAD: ${{ needs.release_version.outputs.olcrtc_proofkit_ahead_by }}
      OLCBOX_NIGHTLY_TAG: ${{ needs.release_version.outputs.nightly_tag }}
      OLCBOX_NIGHTLY_TITLE: ${{ needs.release_version.outputs.nightly_title }}

    steps:
      - name: Checkout olcbox
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Clear release staging dir
        run: rm -rf dist

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          # Only what ships. Without a pattern every artifact of the run comes
          # down, and the gate's per-leg plans and logs would become public
          # release assets and enter SHA256SUMS.
          pattern: Ghostlane-*
          path: dist

      - name: Keep the debug symbols out of the release
        # The dSYMs ride along as a workflow artifact so a crash log can be
        # read later; they are not something to ship. Left here, the DWARF
        # binaries and their Info.plists became release assets once.
        run: rm -rf dist/Ghostlane-ios-dSYMs

      # The gate's verdict ships with the release: gate-report.json and .md are
      # assets (the next release's gate compares against this json), and the
      # notes carry the table under "### Gate", skipped-by-request included.
      - name: The gate's report in the notes
        run: |
          set -euo pipefail
          report=dist/Ghostlane-gate-report/gate-report.json
          md=dist/Ghostlane-gate-report/gate-report.md
          if [ ! -s "$report" ] || [ ! -s "$md" ]; then
            echo "::error::the gate passed but its report is not among the run's artifacts; nothing is published without it"
            exit 1
          fi
          if [ "$(jq -r '.skipped // false' "$report")" = "true" ]; then
            echo "::warning::this release skipped the gate (gate: skip); its notes say so, and why"
          fi
          { echo "### Gate"; echo; cat "$md"; } > gate-section.md

      - name: Generate checksums and release notes
        run: |
          checksum_file="dist/SHA256SUMS.txt"
          find dist -type f ! -name "SHA256SUMS.txt" | sort | while IFS= read -r file; do
            sha256sum "$file" | awk -v name="$(basename "$file")" '{print $1 "  " name}'
          done > "$checksum_file"

          mapfile -t assets < <(find dist -type f | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found"
            exit 1
          fi

          {
            echo "Latest desktop, Android, and iOS builds from public GitHub Actions CI."
            echo
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- Source branch: \`${GITHUB_REF_NAME}\`"
            echo "- olcrtc revision: \`${OLCBOX_OLCRTC_SHA}\` (\`${OLCBOX_OLCRTC_VERSION}\`), what every platform here was built from"
            if [ "${OLCBOX_OLCRTC_ON_PROOFKIT}" = "false" ]; then
              echo "- olcrtc: this revision is not on the fork's \`proofkit\` branch"
            fi
            case "${OLCBOX_OLCRTC_AHEAD}" in
              '' | 0 | unknown) ;;
              *) echo "- olcrtc: \`proofkit\` is ${OLCBOX_OLCRTC_AHEAD} commit(s) ahead of this revision" ;;
            esac
            echo "- App version: \`${OLCBOX_VERSION}\`"
            echo "- Android versionCode: \`${OLCBOX_VERSION_CODE}\`"
            echo "- Android APKs: universal and \`armeabi-v7a\`"
            echo "- Android App Bundle: the \`play\` flavor, as uploaded to Google Play (no self-updater)"
            echo "- iOS: this build goes to TestFlight, ${TESTFLIGHT_PUBLIC_URL} - days before the App Store, which waits on App Review"
            echo "- Workflow: \`.github/workflows/release.yml\`"
            echo "- Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            # Here, so the versioned notes and the rolling nightly both carry it.
            cat gate-section.md
            echo
            echo "### SHA256"
            echo
            echo "| Asset | SHA256 |"
            echo "| --- | --- |"
            awk '{printf "| `%s` | `%s` |\n", $2, $1}' "$checksum_file"
          } > release-notes.md

      - name: Attest release assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/**

      - name: Publish permanent versioned release
        env:
          # A fine-grained PAT (contents + workflows: write on this repository)
          # when the repository has one, because the default token cannot create
          # a tag on a commit that changes a workflow file; the default token
          # otherwise, which still works for every commit that does not.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version_tag="v${OLCBOX_VERSION}"
          git fetch --tags --force --quiet || true

          # Auto changelog: commits since the previous versioned release tag.
          prev_tag="$(git tag -l 'v1.0.*' --sort=-version:refname | grep -vx "${version_tag}" | head -1 || true)"
          {
            echo "## What's new in ${version_tag}"
            echo
            if [ -n "$prev_tag" ]; then
              echo "Changes since \`${prev_tag}\`:"
              echo
              git log --no-merges --pretty=format:'- %s (%h)' "${prev_tag}..HEAD" || true
            else
              echo "First versioned release. Recent changes:"
              echo
              git log --no-merges --pretty=format:'- %s (%h)' -20 || true
            fi
            echo
            echo
            # A note that belongs to this release and not to a commit: an
            # Android reinstall, a server switch. Written for one release and
            # removed after it ships, so it never repeats.
            if [ -f docs/release-notes/pending.md ]; then
              cat docs/release-notes/pending.md
              echo
              echo
            fi
            cat release-notes.md
          } > versioned-notes.md

          mapfile -t assets < <(find dist -type f | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found"
            exit 1
          fi

          # Permanent, immutable per-build release for rollback. Prerelease so it is
          # NOT returned by /releases/latest (the updater's Stable channel), leaving
          # auto-update behavior unchanged — these exist purely for manual download.
          if gh release view "$version_tag" >/dev/null 2>&1; then
            echo "Release ${version_tag} already exists; refreshing notes + assets"
            gh release edit "$version_tag" --notes-file versioned-notes.md --prerelease --draft=false
          else
            gh release create "$version_tag" \
              --target "$GITHUB_SHA" \
              --title "Ghostlane ${OLCBOX_VERSION}" \
              --notes-file versioned-notes.md \
              --prerelease \
              --draft
          fi

          sleep 5
          for asset in "${assets[@]}"; do
            echo "Uploading ${asset} to ${version_tag}"
            for attempt in 1 2 3; do
              if gh release upload "$version_tag" "$asset" --clobber; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Failed to upload ${asset} after ${attempt} attempts" >&2
                exit 1
              fi
              echo "Upload failed for ${asset}; retrying in 10 seconds" >&2
              sleep 10
            done
          done

          gh release edit "$version_tag" --draft=false --prerelease
      - name: Publish public GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t assets < <(find dist -type f | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found"
            exit 1
          fi

          if gh release view "$OLCBOX_NIGHTLY_TAG" >/dev/null 2>&1; then
            gh release delete "$OLCBOX_NIGHTLY_TAG" --yes --cleanup-tag
          fi

          # The tag is created through the Releases API, and that path is NOT
          # exempt from the rule that the default GITHUB_TOKEN may not create a
          # ref whose commit touches .github/workflows/*. The first release cut
          # from a commit that changed a workflow file learned this the hard way:
          # it deleted the previous nightly above, then got "Resource not
          # accessible by integration" here, and the nightly channel was gone.
          # Hence RELEASE_TOKEN, and hence the versioned release running first -
          # it creates its tag before anything is deleted, so a token that cannot
          # create tags fails the job with the old nightly still in place.
          gh release create "$OLCBOX_NIGHTLY_TAG" \
            --target "$GITHUB_SHA" \
            --title "$OLCBOX_NIGHTLY_TITLE" \
            --notes-file release-notes.md \
            --prerelease \
            --draft

          # Give GitHub a moment to make the draft release available for asset uploads.
          sleep 5

          for asset in "${assets[@]}"; do
            echo "Uploading ${asset}"
            for attempt in 1 2 3; do
              if gh release upload "$OLCBOX_NIGHTLY_TAG" "$asset" --clobber; then
                break
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "Failed to upload ${asset} after ${attempt} attempts" >&2
                exit 1
              fi

              echo "Upload failed for ${asset}; retrying in 10 seconds" >&2
              sleep 10
            done
          done

          gh release edit "$OLCBOX_NIGHTLY_TAG" --draft=false --prerelease


  # The CLI's Docker image: the released tarballs' binaries (stage.sh) on
  # distroless, every platform, pushed to ghcr.io once the release is out.
  publish-cli-docker:
    runs-on: ubuntu-latest
    needs: [plan, release_version, build-cli, publish-nightly]
    if: ${{ needs.plan.outputs.signed == 'true' && needs.publish-nightly.result == 'success' && needs.build-cli.result == 'success' }}
    permissions:
      contents: read
      packages: write
    env:
      OLCBOX_VERSION: ${{ needs.release_version.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/ghostlane-cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: Ghostlane-cli-linux
          path: cli/dist
      - name: Stage the released binaries
        run: sh cli/packaging/docker/stage.sh cli/dist "${OLCBOX_VERSION}"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: cli
          file: cli/packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.OLCBOX_VERSION }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.OLCBOX_VERSION }}
            org.opencontainers.image.licenses=GPL-3.0-or-later

  # The apt and dnf repositories on GitHub Pages (gh-pages: /apt, /rpm, the
  # public key and the two sources snippets at the root), updated in place
  # from the released packages and signed with CLI_REPO_GPG_KEY. Pages must
  # be enabled once (source: gh-pages, root) — see docs/cli.md.
  publish-cli-repo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [plan, release_version, build-cli, publish-nightly]
    if: ${{ needs.plan.outputs.signed == 'true' && needs.publish-nightly.result == 'success' && needs.build-cli.result == 'success' }}
    permissions:
      contents: write
    concurrency:
      group: cli-repo-${{ github.repository }}
      cancel-in-progress: false
    env:
      OLCBOX_VERSION: ${{ needs.release_version.outputs.version }}
      CLI_REPO_GPG_KEY: ${{ secrets.CLI_REPO_GPG_KEY }}
    steps:
      - name: Repository key is set
        run: |
          [ -n "${CLI_REPO_GPG_KEY}" ] || { echo "::error::CLI_REPO_GPG_KEY is not set; the apt/dnf repositories are signed or not published"; exit 1; }
      - uses: actions/checkout@v7
        with:
          path: src
      - name: Checkout gh-pages (or start it)
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
        continue-on-error: true
        id: pages
      - name: Start gh-pages
        if: steps.pages.outcome != 'success'
        run: |
          rm -rf pages && mkdir pages && cd pages
          git init -q -b gh-pages
          git remote add origin "https://x-access-token:${{ secrets.RELEASE_TOKEN || github.token }}@github.com/${{ github.repository }}.git"
      - uses: actions/download-artifact@v8
        with:
          name: Ghostlane-cli-linux
          path: dist
      - name: Build the repositories
        run: |
          set -euo pipefail
          # natively when the runner's archive answers, in containers when not
          sh src/cli/packaging/repo/install-tools.sh
          umask 077
          printf '%s\n' "${CLI_REPO_GPG_KEY}" > "$RUNNER_TEMP/repo-key.asc"
          sh src/cli/packaging/repo/build-repos.sh dist pages "$RUNNER_TEMP/repo-key.asc" "${OLCBOX_VERSION}"
          rm -f "$RUNNER_TEMP/repo-key.asc"
          du -sh pages/apt pages/rpm
      # One commit, the current tree: packages are ~25 MB each, so a branch with
      # history would grow the repository by ~150 MB per release for ever.
      - name: Push gh-pages (one commit, no history)
        run: |
          set -euo pipefail
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan gh-pages-next
          git add -A
          git commit -q -m "cli repositories: ${OLCBOX_VERSION}"
          git push -q --force origin HEAD:gh-pages
