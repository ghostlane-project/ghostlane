name: Build ProofKit Releases

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'What to build (macOS minutes bill at 10x — build only what you need)'
        type: choice
        default: 'test-macos'
        options:
          - test-macos   # Apple Silicon DMG only — the usual "give me something to try"  [10x]
          - android      # Android APKs + AAB. Free runner
          - ios          # signed and uploaded to TestFlight when the iOS signing secrets are set, else an unsigned IPA
          - mobile       # Android and iOS together  [10x]
          - desktop      # macOS arm64 + Windows + Linux  [10x]
          - all          # every platform, and publish the release  [10x]
      play_track:
        description: 'Google Play track for the play-flavor bundle (uploads only when PLAY_SERVICE_ACCOUNT_JSON is set)'
        type: choice
        default: 'internal'
        options:
          - internal     # Play's internal testing: testers get it in minutes, no review — the TestFlight of Android
          - production   # everyone, after Play's review; prefer promoting a tested internal build from the console
          - none         # build only

permissions:
  contents: read

# A newer build supersedes an older one: without this a dispatch made while another
# run is in flight pays for both, and only the later result is ever used.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  OLCBOX_VERSION_MAJOR_MINOR: "1.0"
  # The fork branch on upstream master 189d16c; proofkit-udp-spike is archived.
  OLCBOX_OLCRTC_REF: "proofkit"
  # Every Go step below reads this. It used to be `stable`, and `stable` moved
  # from 1.26.5 to 1.27.1 between two runs of the cores bind: the 1.27.1 build
  # left golang.org/x/net/http2.(*Transport).connPool undefined in every slice
  # and Xcode could not link it (see scripts/cores-pins.sh). The Android job
  # builds sing-box and Xray — .so-named executables — from that same dependency
  # graph with the same external linker step, so the same toolchain is pinned
  # here for the same reason.
  GO_VERSION: "1.26.5"
  # ProofKit fork versionCode = PATCH_BASE + github.run_number (RUN_NUMBER_BASE 0,
  # since run numbers reset to 1 on this fork). PATCH_BASE is set ABOVE upstream's
  # current nightly (1.0.112) so our builds always read as the NEWEST version — the
  # in-app updater (repointed to romanpodpriatov/olcbox) then never offers users an
  # upstream build, and 1.0.2xx > any 1.0.1xx. Monotonic, so Android updates install.
  OLCBOX_RELEASE_RUN_NUMBER_BASE: "0"
  # 300, not 200, since 2026-09-09: the App Store already carries 1.0.301 from a
  # laptop-stamped upload, and Apple refuses a bundle whose version is below the
  # last approved one. Every platform moves together, Android's versionCode
  # included, which only ever has to grow.
  OLCBOX_RELEASE_PATCH_BASE: "300"
  # crypt1 client key + admin unlock hash, baked into GeneratedAppInfo by the
  # gradle GenerateAppInfoTask. Empty when the secrets are unset ⇒ crypt/admin
  # compile but stay disabled (plain links still work; the tap gesture is inert).
  OLCBOX_CRYPT_KEY_V1: ${{ secrets.OLCBOX_CRYPT_KEY_V1 }}
  OLCBOX_ADMIN_PASS_SHA256: ${{ secrets.OLCBOX_ADMIN_PASS_SHA256 }}

jobs:
  # Decides which platform jobs run. A push to a release branch always builds
  # everything; a manual dispatch builds only what was asked for.
  plan:
    runs-on: ubuntu-latest
    outputs:
      macos_arm64: ${{ steps.p.outputs.macos_arm64 }}
      macos_intel: ${{ steps.p.outputs.macos_intel }}
      windows: ${{ steps.p.outputs.windows }}
      linux: ${{ steps.p.outputs.linux }}
      android: ${{ steps.p.outputs.android }}
      ios: ${{ steps.p.outputs.ios }}
      publish: ${{ steps.p.outputs.publish }}
      macos_any: ${{ steps.p.outputs.macos_any }}
      macos_matrix: ${{ steps.p.outputs.macos_matrix }}
    steps:
      # Correction to the commit that added this: the secrets were set. The
      # claim that they were not came from reading the APK with an anchored
      # grep, and dex strings carry a length byte in front, so `^[0-9a-f]{64}$`
      # could never match anything. The guard is still worth having; its
      # original justification was not established.
      #
      # A build without these is not a broken build — it is a working build of a
      # different app, and it says so nowhere. crypt1 links stop importing, which
      # takes the partner's subscriptions with them, and the admin gate is off,
      # which puts an operator's edge addresses on every tester's screen. Both
      # were shipped once exactly this way, and the first report was two users
      # saying "the link does not activate" about two different links with one
      # cause.
      - name: Secrets are set
        run: |
          missing=""
          [ -n "${OLCBOX_CRYPT_KEY_V1}" ] || missing="${missing} OLCBOX_CRYPT_KEY_V1"
          [ -n "${OLCBOX_ADMIN_PASS_SHA256}" ] || missing="${missing} OLCBOX_ADMIN_PASS_SHA256"
          if [ -n "${missing}" ]; then
            echo "Missing repository secrets:${missing}"
            echo
            echo "crypt1 links will not import and the configurator will be"
            echo "visible to everyone. Set them in Settings -> Secrets and"
            echo "variables -> Actions, then run this again."
            exit 1
          fi
          # Set, but in the wrong shape, disables crypt1 just as silently:
          # CryptCodec.decodeMaster wants base64 of 32 bytes. The coordinator
          # stores the same key as 64 hex characters, which base64-decodes to
          # 48 and is rejected.
          case "${OLCBOX_CRYPT_KEY_V1}" in
            *[!0-9a-fA-F]*) : ;;
            ????????????????????????????????????????????????????????????????)
              echo "OLCBOX_CRYPT_KEY_V1 looks like 64 hex characters."
              echo "The client wants base64 of those 32 bytes:"
              echo "  python3 -c 'import base64,sys;print(base64.b64encode(bytes.fromhex(sys.argv[1])).decode())' <hex>"
              exit 1
              ;;
          esac
          echo "crypt1 key and admin hash are both present."

      - name: Resolve requested platforms
        id: p
        run: |
          # Dispatch is the only trigger, so the selection is always the input.
          # It used to fall back to "all" on a push to main, which meant every
          # commit — a doc fix included — paid for two 10x macOS legs plus four
          # more platforms.
          sel="${{ inputs.platforms }}"
          echo "selection: $sel"
          mac_arm=false; mac_intel=false; win=false; lin=false; andr=false; ios=false; pub=false
          case "$sel" in
            all)
              mac_arm=true; mac_intel=true; win=true; lin=true; andr=true; ios=true; pub=true ;;
            desktop)
              mac_arm=true; win=true; lin=true ;;
            # `mobile` used to mean Android only, which read as "the mobile
            # builds" and quietly left iOS out — the one platform whose build is
            # hardest to reproduce locally. It now means both, and either half
            # can be asked for on its own: an iOS change should not have to pay
            # for an Android build, and an Android change should not touch a 10x
            # runner at all.
            mobile)
              andr=true; ios=true ;;
            android)
              andr=true ;;
            ios)
              ios=true ;;
            *)
              mac_arm=true ;;
          esac
          # Each key written exactly once: duplicate keys in $GITHUB_OUTPUT are
          # ambiguous and would make the selection depend on parsing order.
          {
            echo "macos_arm64=$mac_arm"
            echo "macos_intel=$mac_intel"
            echo "windows=$win"
            echo "linux=$lin"
            echo "android=$andr"
            echo "ios=$ios"
            echo "publish=$pub"
          } >> "$GITHUB_OUTPUT"

          # The macOS matrix is built here rather than filtered in the job: a
          # matrix leg cannot be skipped by an `if`, so a disabled arch would still
          # occupy a 10x runner.
          # Written as full `if` blocks, not `[ ... ] && ...`: steps run under
          # `bash -e`, where a test that evaluates false is the line's exit status
          # and kills the step. `mobile` builds no macOS leg and would have died here.
          legs=""
          if [ "$mac_arm" = true ]; then
            legs='{"runner":"macos-latest","arch":"arm64"}'
          fi
          if [ "$mac_intel" = true ]; then
            if [ -n "$legs" ]; then legs="$legs,"; fi
            legs="$legs{\"runner\":\"macos-15-intel\",\"arch\":\"amd64\"}"
          fi
          any=false
          if [ -n "$legs" ]; then any=true; fi
          {
            echo "macos_any=$any"
            echo "macos_matrix={\"include\":[$legs]}"
          } >> "$GITHUB_OUTPUT"

  release_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      olcrtc_ref: ${{ steps.version.outputs.olcrtc_ref }}
      nightly_tag: ${{ steps.version.outputs.nightly_tag }}
      nightly_title: ${{ steps.version.outputs.nightly_title }}

    steps:
      - name: Resolve release version
        id: version
        run: |
          patch=$((OLCBOX_RELEASE_PATCH_BASE + GITHUB_RUN_NUMBER - OLCBOX_RELEASE_RUN_NUMBER_BASE))

          if [ "$patch" -le "$OLCBOX_RELEASE_PATCH_BASE" ]; then
            echo "Computed Android versionCode ${patch} is not greater than ${OLCBOX_RELEASE_PATCH_BASE}" >&2
            exit 1
          fi

          echo "version=${OLCBOX_VERSION_MAJOR_MINOR}.${patch}" >> "$GITHUB_OUTPUT"
          echo "version_code=${patch}" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_REF_NAME}" = "universal-carrier" ]; then
            echo "olcrtc_ref=${OLCBOX_OLCRTC_REF}" >> "$GITHUB_OUTPUT"
            echo "nightly_tag=nightly-universal-carrier" >> "$GITHUB_OUTPUT"
            echo "nightly_title=Nightly ProofKit universal-carrier builds" >> "$GITHUB_OUTPUT"
          else
            echo "olcrtc_ref=${OLCBOX_OLCRTC_REF}" >> "$GITHUB_OUTPUT"
            echo "nightly_tag=nightly" >> "$GITHUB_OUTPUT"
            echo "nightly_title=Nightly ProofKit builds" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: [release_version, plan]
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      OLCBOX_VERSION: ${{ needs.release_version.outputs.version }}
      OLCBOX_VERSION_CODE: ${{ needs.release_version.outputs.version_code }}
      WINDOWS_CODESIGN_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_BASE64 }}
      WINDOWS_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_PASSWORD }}
      WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_CODESIGN_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}

    steps:
      - name: Checkout olcbox
        uses: actions/checkout@v7
        with:
          path: olcbox

      - name: Checkout olcrtc
        uses: actions/checkout@v7
        with:
          repository: romanpodpriatov/olcrtc
          ref: ${{ needs.release_version.outputs.olcrtc_ref }}
          path: olcrtc
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: olcrtc/go.sum

      # Same omission the Android and Linux jobs had. Named with `.exe` here, and
      # only here: makeExecutable() is a no-op on Windows, so the extension is the
      # only thing that makes the file runnable — DesktopNativeAssets asks for
      # `native/sing-box.exe` on this platform and `native/sing-box` on the others.
      - name: Bundle sing-box + Xray cores into the app
        shell: pwsh
        working-directory: olcbox
        env:
          SINGBOX_VERSION: "1.13.14"
          XRAY_VERSION: "25.3.6"
        run: |
          $ErrorActionPreference = "Stop"
          $dest = "desktopApp/src/main/resources/native"
          New-Item -ItemType Directory -Force $dest | Out-Null

          $sb = "https://github.com/SagerNet/sing-box/releases/download/v$env:SINGBOX_VERSION/sing-box-$env:SINGBOX_VERSION-windows-amd64.zip"
          Invoke-WebRequest -Uri $sb -OutFile sb.zip
          Remove-Item -Recurse -Force sb-x -ErrorAction SilentlyContinue
          Expand-Archive sb.zip -DestinationPath sb-x
          Copy-Item (Get-ChildItem sb-x -Recurse -Filter "sing-box.exe" | Select-Object -First 1).FullName "$dest/sing-box.exe"

          $xr = "https://github.com/XTLS/Xray-core/releases/download/v$env:XRAY_VERSION/Xray-windows-64.zip"
          Invoke-WebRequest -Uri $xr -OutFile xray.zip
          Remove-Item -Recurse -Force xr-x -ErrorAction SilentlyContinue
          Expand-Archive xray.zip -DestinationPath xr-x
          Copy-Item (Get-ChildItem xr-x -Recurse -Filter "xray.exe" | Select-Object -First 1).FullName "$dest/xray.exe"

          Write-Host "== bundled cores =="
          Get-ChildItem $dest
          # Runs them, because "the file is present" is the half of this that was
          # never in doubt. If Windows will not execute what we packaged, it says so
          # here and not on a user's machine.
          & "$dest/sing-box.exe" version | Select-Object -First 1
          & "$dest/xray.exe" version | Select-Object -First 1

      - name: Build Windows installers and portable zip
        shell: pwsh
        working-directory: olcbox
        run: |
          $env:OLCRTC_REPO="${{ github.workspace }}\olcrtc"
          .\gradlew.bat "-Polcbox.version=$env:OLCBOX_VERSION" :desktopApp:packageReleaseExe :desktopApp:packageReleaseMsi :desktopApp:packageReleasePortableZip --stacktrace

      - name: Prepare asset
        shell: pwsh
        working-directory: olcbox
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = Get-ChildItem "desktopApp/build/compose/binaries/main-release/exe/*.exe" | Select-Object -First 1
          $msi = Get-ChildItem "desktopApp/build/compose/binaries/main-release/msi/*.msi" | Select-Object -First 1
          $zip = Get-ChildItem "desktopApp/build/compose/binaries/main-release/portable/*.zip" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $zip) {
            $portableDir = "desktopApp/build/compose/binaries/main-release/portable"
            $appRoot = "desktopApp/build/compose/binaries/main-release/app"
            $appImage = Get-ChildItem $appRoot -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -eq $appImage) {
              throw "Portable app image not found under $appRoot"
            }
            New-Item -ItemType Directory -Force $portableDir | Out-Null
            $portableZip = Join-Path $portableDir "ProofKit-windows-amd64-portable.zip"
            Compress-Archive -Path $appImage.FullName -DestinationPath $portableZip -Force
            $zip = Get-Item $portableZip
          }
          Copy-Item $exe.FullName "dist/ProofKit-${env:OLCBOX_VERSION}-windows-amd64.exe"
          Copy-Item $msi.FullName "dist/ProofKit-${env:OLCBOX_VERSION}-windows-amd64.msi"
          Copy-Item $zip.FullName "dist/ProofKit-${env:OLCBOX_VERSION}-windows-amd64-portable.zip"

      - name: Sign Windows release assets
        shell: pwsh
        working-directory: olcbox
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_CERTIFICATE_PASSWORD)) {
            Write-Host "Windows code signing secrets are not configured; publishing unsigned assets."
            exit 0
          }

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signtool) {
            throw "signtool.exe was not found on the Windows runner"
          }

          $certPath = Join-Path $env:RUNNER_TEMP "olcbox-windows-codesign.pfx"
          [IO.File]::WriteAllBytes(
            $certPath,
            [Convert]::FromBase64String(($env:WINDOWS_CODESIGN_CERTIFICATE_BASE64 -replace '\s', ''))
          )

          function Sign-File([string]$Path) {
            & $signtool.FullName sign `
              /fd SHA256 `
              /tr $env:WINDOWS_CODESIGN_TIMESTAMP_URL `
              /td SHA256 `
              /f $certPath `
              /p $env:WINDOWS_CODESIGN_CERTIFICATE_PASSWORD `
              $Path
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to sign $Path"
            }
          }

          $exeAsset = Get-ChildItem "dist/ProofKit-*-windows-amd64.exe" | Select-Object -First 1
          $msiAsset = Get-ChildItem "dist/ProofKit-*-windows-amd64.msi" | Select-Object -First 1
          Sign-File $exeAsset.FullName
          Sign-File $msiAsset.FullName

          $portableZip = (Get-ChildItem "dist/ProofKit-*-windows-amd64-portable.zip" | Select-Object -First 1).FullName
          $portableDir = Join-Path $env:RUNNER_TEMP "olcbox-portable-sign"
          Remove-Item $portableDir -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $portableZip -DestinationPath $portableDir
          Get-ChildItem $portableDir -Recurse -Filter *.exe | ForEach-Object {
            Sign-File $_.FullName
          }
          Remove-Item $portableZip -Force
          Compress-Archive -Path (Join-Path $portableDir '*') -DestinationPath $portableZip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ProofKit-windows-amd64
          path: |
            olcbox/dist/ProofKit-*-windows-amd64.exe
            olcbox/dist/ProofKit-*-windows-amd64.msi
            olcbox/dist/ProofKit-*-windows-amd64-portable.zip

  build-macos:
    needs: [release_version, plan]
    if: needs.plan.outputs.macos_any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.macos_matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      OLCBOX_VERSION: ${{ needs.release_version.outputs.version }}
      OLCBOX_VERSION_CODE: ${{ needs.release_version.outputs.version_code }}

    steps:
      - name: Checkout olcbox
        uses: actions/checkout@v7
        with:
          path: olcbox

      - name: Checkout olcrtc
        uses: actions/checkout@v7
        with:
          repository: romanpodpriatov/olcrtc
          ref: ${{ needs.release_version.outputs.olcrtc_ref }}
          path: olcrtc
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: olcrtc/go.sum

      - name: Import Developer ID certificate
        env:
          MACOS_CODESIGN_CERTIFICATE_BASE64: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_BASE64 }}
          MACOS_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CODESIGN_CERTIFICATE_BASE64:-}" ]; then
            echo "No macOS signing secrets; the build stays unsigned (Gatekeeper will need xattr)."
            exit 0
          fi

          # A dedicated keychain, so nothing leaks into the runner's login one and
          # the private key is reachable by codesign without an interactive prompt.
          kc="$RUNNER_TEMP/olcbox-signing.keychain-db"
          pw="$(uuidgen)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"

          cert="$RUNNER_TEMP/developer-id.p12"
          echo "$MACOS_CODESIGN_CERTIFICATE_BASE64" | tr -d '[:space:]' | base64 --decode > "$cert"
          security import "$cert" -k "$kc" -P "$MACOS_CODESIGN_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$cert"

          # Without this codesign blocks on a UI prompt that no one can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')

          echo "== identities available =="
          security find-identity -v -p codesigning "$kc"

      - name: Bundle sing-box + Xray cores into the app
        working-directory: olcbox
        env:
          SINGBOX_VERSION: "1.13.14"
          XRAY_VERSION: "25.3.6"
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          dest="desktopApp/src/main/resources/native"
          mkdir -p "$dest"

          echo "== sing-box (darwin-${MATRIX_ARCH}) =="
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-darwin-${MATRIX_ARCH}.tar.gz" -o sb.tgz
          tar xzf sb.tgz
          cp "sing-box-${SINGBOX_VERSION}-darwin-${MATRIX_ARCH}/sing-box" "$dest/sing-box"

          echo "== Xray (macos-${MATRIX_ARCH}) =="
          if [ "$MATRIX_ARCH" = "arm64" ]; then xasset="Xray-macos-arm64-v8a.zip"; else xasset="Xray-macos-64.zip"; fi
          curl -fsSL "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/${xasset}" -o xray.zip
          unzip -o xray.zip xray -d xray-extract
          cp xray-extract/xray "$dest/xray"

          chmod +x "$dest/sing-box" "$dest/xray"
          echo "== bundled cores =="; ls -la "$dest"
          # sed, not head: both cores print several lines in separate writes,
          # and head closing the pipe after the first one hands the core a
          # SIGPIPE - exit 141 under pipefail, at random, which failed the
          # 1.0.421 Linux build. sed -n 1p reads everything and prints one.
          "$dest/sing-box" version | sed -n 1p
          "$dest/xray" version | sed -n 1p

      - name: Sign the bundled cores
        working-directory: olcbox
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_SIGN_IDENTITY:-}" ]; then
            echo "No signing identity; leaving the cores as downloaded."
            exit 0
          fi

          # sing-box and Xray arrive from their own release pages carrying somebody
          # else's signature or none at all. The app spawns them, so on Apple
          # Silicon they must be signed too — an unsigned helper is killed on exec
          # and the app looks broken for reasons nothing in its log explains.
          for core in desktopApp/src/main/resources/native/sing-box desktopApp/src/main/resources/native/xray; do
            codesign --force --timestamp --options runtime \
              --entitlements desktopApp/macos-entitlements.plist \
              --sign "$MACOS_SIGN_IDENTITY" "$core"
            codesign --verify --verbose=2 "$core"
          done

      - name: Build macOS DMG
        working-directory: olcbox
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          export OLCRTC_REPO="${{ github.workspace }}/olcrtc"
          ./gradlew -Polcbox.version="${OLCBOX_VERSION}" :desktopApp:packageReleaseDmg --stacktrace

      # Compose runs codesign itself and, on failure, prints the command and the
      # *path* to the error — never the error. A build once failed here with
      # nothing to go on but "Exit code: 1" and a filename on a runner that no
      # longer exists. Whatever codesign actually said is worth the four lines.
      - name: Why codesign failed
        if: failure()
        working-directory: olcbox
        run: |
          for log in desktopApp/build/compose/logs/**/*.txt desktopApp/build/compose/logs/*/*; do
            [ -f "$log" ] || continue
            echo "=== $log"
            tail -40 "$log"
          done

      - name: Prepare asset
        working-directory: olcbox
        run: |
          mkdir -p dist
          cp desktopApp/build/compose/binaries/main-release/dmg/*.dmg "dist/ProofKit-${OLCBOX_VERSION}-macos-${{ matrix.arch }}.dmg"

      - name: Submit for notarisation
        id: notarise
        working-directory: olcbox
        env:
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          dmg="dist/ProofKit-${OLCBOX_VERSION}-macos-${ARCH}.dmg"

          # Every macOS build is notarised, published or not.
          #
          # It used to be published builds only, and that was the right trade
          # while a test build's worst case was one right-click → Open. It stopped
          # being right when the app grew a root daemon: the user is now asked to
          # authorise a background item that runs as root, and asking that of an
          # app macOS has just called unverified is a bad way to earn it. Whether
          # SMAppService outright refuses to register from an un-notarised bundle
          # is not documented either way — and finding out costs a session on a
          # real Mac, which is more expensive than the queue.
          #
          # The queue itself is not paid for on a 10x runner: this step submits
          # and leaves, a 1x runner polls for the verdict, and this machine comes
          # back only for the seconds stapling takes.
          if [ -z "${MACOS_NOTARY_KEY_BASE64:-}" ]; then
            echo "No notary credentials; publishing a signed-but-not-notarised DMG."
            exit 0
          fi

          key="$RUNNER_TEMP/notary.p8"
          echo "$MACOS_NOTARY_KEY_BASE64" | tr -d '[:space:]' | base64 --decode > "$key"

          # Deliberately no --wait: Apple's queue has taken up to twenty minutes,
          # and waiting it out here bills a 10x runner for doing nothing. A 1x
          # runner polls for the verdict instead, and this machine is only needed
          # again for the seconds stapling takes.
          out="$(xcrun notarytool submit "$dmg" \
            --key "$key" \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID" 2>&1)"
          rm -f "$key"
          echo "$out"

          sub_id="$(printf '%s\n' "$out" | awk '/id: /{print $2; exit}')"
          test -n "$sub_id" || { echo "no submission id came back"; exit 1; }
          echo "$sub_id" > dist/notary-submission-id.txt
          echo "id=$sub_id" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ProofKit-macos-${{ matrix.arch }}-dmg
          path: |
            olcbox/dist/ProofKit-*-macos-${{ matrix.arch }}.dmg
            olcbox/dist/notary-submission-id.txt

  build-linux:
    needs: [release_version, plan]
    if: needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OLCBOX_VERSION: ${{ needs.release_version.outputs.version }}
      OLCBOX_VERSION_CODE: ${{ needs.release_version.outputs.version_code }}

    steps:
      - name: Checkout olcbox
        uses: actions/checkout@v7
        with:
          path: olcbox

      - name: Checkout olcrtc
        uses: actions/checkout@v7
        with:
          repository: romanpodpriatov/olcrtc
          ref: ${{ needs.release_version.outputs.olcrtc_ref }}
          path: olcrtc
          submodules: recursive

      - name: Install Linux packaging deps
        run: |
          sudo apt-get update
          sudo apt-get install -y file

      - name: Setup JDK
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: olcrtc/go.sum

      - name: Setup appimagetool
        run: |
          curl -L -o /tmp/appimagetool.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool.AppImage

      # Same omission the Android job had: only build-macos fetched these, so the
      # Linux AppImage shipped olcRTC and nothing else and every Reality,
      # Hysteria2 and XHTTP location died at connect on
      # "Bundled native binary is missing: native/sing-box".
      - name: Bundle sing-box + Xray cores into the app
        working-directory: olcbox
        env:
          SINGBOX_VERSION: "1.13.14"
          XRAY_VERSION: "25.3.6"
        run: |
          set -euo pipefail
          dest="desktopApp/src/main/resources/native"
          mkdir -p "$dest"

          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz" -o sb.tgz
          rm -rf sb-x && mkdir sb-x && tar xzf sb.tgz -C sb-x
          install -m 0755 "$(find sb-x -type f -name sing-box | head -1)" "$dest/sing-box"

          curl -fsSL "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip" -o xray.zip
          rm -rf xr-x && mkdir xr-x && (cd xr-x && unzip -oq ../xray.zip)
          install -m 0755 "$(find xr-x -type f -name xray | head -1)" "$dest/xray"

          echo "== bundled cores =="; ls -la "$dest"
          # sed, not head: both cores print several lines in separate writes,
          # and head closing the pipe after the first one hands the core a
          # SIGPIPE - exit 141 under pipefail, at random, which failed the
          # 1.0.421 Linux build. sed -n 1p reads everything and prints one.
          "$dest/sing-box" version | sed -n 1p
          "$dest/xray" version | sed -n 1p

      - name: Build Linux AppImage
        working-directory: olcbox
        run: |
          export OLCRTC_REPO="${{ github.workspace }}/olcrtc"
          export APPIMAGETOOL=/tmp/appimagetool.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./gradlew -Polcbox.version="${OLCBOX_VERSION}" :desktopApp:packageReleaseLinuxAppImage --stacktrace

      - name: Prepare asset
        working-directory: olcbox
        run: |
          mkdir -p dist
          cp desktopApp/build/compose/binaries/main-release/appimage/*.AppImage "dist/ProofKit-${OLCBOX_VERSION}-linux-amd64.AppImage"

      # Against the finished AppImage, not the staging directory. The files being
      # absent is one way to lose them; a packaging rule dropping them on the way
      # in is another, and only the artifact can show that.
      - name: Verify cores packaged in the AppImage
        working-directory: olcbox
        run: |
          set -euo pipefail
          img="dist/ProofKit-${OLCBOX_VERSION}-linux-amd64.AppImage"
          chmod +x "$img"
          rm -rf squashfs-root && "./$img" --appimage-extract >/dev/null

          # Compose packs `resources.srcDir` into the app jar rather than leaving
          # the files loose, so look in both places — a check that only knew about
          # one would pass or fail for the wrong reason.
          entries=$(mktemp)
          find squashfs-root -type f -printf '%P\n' >>"$entries"
          find squashfs-root -type f -name '*.jar' -print0 \
            | xargs -0 -r -I{} unzip -Z1 {} 2>/dev/null >>"$entries" || true

          missing=0
          for core in sing-box xray; do
            if grep -qE "(^|/)native/${core}$" "$entries"; then
              echo "ok      native/$core"
            else
              echo "MISSING native/$core"; missing=1
            fi
          done
          rm -rf squashfs-root "$entries"
          [ "$missing" -eq 0 ] || {
            echo "Cores are missing from the AppImage — every Reality/Hysteria2/" >&2
            echo "XHTTP location would fail to start. Refusing to publish." >&2
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ProofKit-linux-amd64-appimage
          path: olcbox/dist/ProofKit-*-linux-amd64.AppImage

  build-android:
    needs: [release_version, plan]
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      OLCBOX_VERSION: ${{ needs.release_version.outputs.version }}
      OLCBOX_VERSION_CODE: ${{ needs.release_version.outputs.version_code }}
      ANDROID_NDK_VERSION: "28.2.13676358"
      # Same pins as the desktop job and singbox-verify.yml. All three have to
      # move together: a config this app writes is validated against one schema.
      SINGBOX_VERSION: "1.13.14"
      XRAY_VERSION: "25.3.6"
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      # A Google Cloud service account invited into the Play Console with
      # "Release to testing tracks" (and "Release to production" for that
      # track). Absent, the play bundle is built and kept as an artifact only.
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout olcbox
        uses: actions/checkout@v7
        with:
          path: olcbox

      - name: Checkout olcrtc
        uses: actions/checkout@v7
        with:
          repository: romanpodpriatov/olcrtc
          ref: ${{ needs.release_version.outputs.olcrtc_ref }}
          path: olcrtc
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: olcrtc/go.sum

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's default is 'tools platform-tools'; the legacy tools
          # package is no longer in Google's repository (2026-09-15) and sdkmanager
          # fails the whole step over it. The next step installs what the build needs.
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Go mobile tooling
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install github.com/magefile/mage@latest

      - name: Initialize gomobile
        working-directory: olcrtc
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          gomobile init

      - name: Configure Android release signing
        working-directory: olcbox
        run: |
          if [ -n "${ANDROID_RELEASE_KEYSTORE_BASE64}" ] &&
             [ -n "${ANDROID_RELEASE_STORE_PASSWORD}" ] &&
             [ -n "${ANDROID_RELEASE_KEY_ALIAS}" ] &&
             [ -n "${ANDROID_RELEASE_KEY_PASSWORD}" ]; then
            printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" | tr -d '\r\n' | base64 --decode > release-keystore.jks

            # Whitespace survives a paste into `gh secret set`, and Java's
            # Properties does not trim the end of a value — so an invisible space
            # becomes an alias that does not exist, with nothing at all to see.
            alias="$(printf '%s' "${ANDROID_RELEASE_KEY_ALIAS}" | tr -d '\r\n' \
              | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            store_pw="$(printf '%s' "${ANDROID_RELEASE_STORE_PASSWORD}" | tr -d '\r\n')"
            key_pw="$(printf '%s' "${ANDROID_RELEASE_KEY_PASSWORD}" | tr -d '\r\n')"

            # Asked here rather than discovered by Gradle six minutes later, where
            # it arrives as a KeytoolException under thirty frames of packager
            # stack and says nothing about which aliases the keystore does have.
            if ! keytool -list -keystore release-keystore.jks \
                   -storepass "${store_pw}" -alias "${alias}" >/dev/null 2>&1; then
              echo "No key with that alias in the keystore. It holds:" >&2
              keytool -list -keystore release-keystore.jks -storepass "${store_pw}" 2>/dev/null \
                | grep -i "PrivateKeyEntry" >&2 || echo "  (no private keys at all)" >&2
              # The value is masked in this log, so its length is the only way to
              # tell "wrong name" from "right name with an invisible character" —
              # and the two have completely different fixes.
              echo "ANDROID_RELEASE_KEY_ALIAS is ${#alias} characters after trimming." >&2
              echo "If that count is not what you typed, the secret carries something" >&2
              echo "invisible; otherwise set it to the name in the first column above." >&2
              exit 1
            fi

            cat > keystore.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=${store_pw}
          keyAlias=${alias}
          keyPassword=${key_pw}
          EOF
          else
            # ProofKit fork: no release secrets → generate an EPHEMERAL keystore so
            # the release APK is self-signed and sideloadable (Android requires a
            # signature to install at all). Not Play-Store-publishable; add the real
            # ANDROID_RELEASE_* secrets later and the branch above takes over.
            echo "No Android release secrets; self-signing with an ephemeral keystore (sideload only)."
            keytool -genkeypair -v -keystore release-keystore.jks \
              -storepass proofkit -keypass proofkit -alias proofkit \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=ProofKit olcbox, O=ProofKit, C=US"
            cat > keystore.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=proofkit
          keyAlias=proofkit
          keyPassword=proofkit
          EOF
          fi

      # Without this the APK ships olcRTC and nothing else. sing-box and Xray run
      # as child processes on Android, exec'd out of the app's native library
      # directory, so each core has to be packaged as a `lib*.so` per ABI — that
      # is the only place an installed app is allowed to execute from.
      #
      # It was missing until 1.0.234, and the failure it produced pointed away
      # from itself: the app imported subscriptions fine and reported
      # "Cannot run program .../libsingboxcore.so: No such file or directory" only
      # on connect, so every Reality, Hysteria2 and XHTTP location was dead in
      # every release APK ever published while olcRTC kept working.
      #
      # singbox-verify.yml has staged these all along, which is why that workflow
      # stayed green over a release that could not connect.
      # Built here rather than downloaded, for one reason: every sing-box release
      # binary — 1.13.14 and 1.14.0-beta.2 alike — has 4 KB LOAD alignment, and a
      # device with 16 KB pages cannot map it. On a Pixel 10 the process died
      # without executing a single instruction: its log was empty, not even the
      # version banner Xray prints on its first line, while Xray (aligned to 64 KB)
      # started normally. There is no upstream version to move to, so the choice is
      # to align it ourselves or to ship Hysteria2 broken on every recent phone.
      #
      # The recipe is theirs, from SagerNet's own build.yml: same build tags, same
      # shared ldflags, same NDK triples, CGO through the NDK clang. The one
      # addition is max-page-size. Deviating from those tags silently drops
      # protocols, so they are read from the tree at the pinned tag rather than
      # copied here where they would rot.
      - name: Build sing-box for Android with 16 KB page alignment
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "v${SINGBOX_VERSION}" \
            https://github.com/SagerNet/sing-box.git "${RUNNER_TEMP}/sing-box"
          cd "${RUNNER_TEMP}/sing-box"

          TAGS="$(cat release/DEFAULT_BUILD_TAGS_OTHERS)"
          LDFLAGS_SHARED="$(cat release/LDFLAGS)"
          NDK_BIN="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          OUT="${GITHUB_WORKSPACE}/olcbox/androidApp/jniLibs"
          echo "build tags: ${TAGS}"

          build_singbox() {   # $1 = GOARCH, $2 = NDK triple, $3 = android ABI
            mkdir -p "${OUT}/$3"
            CGO_ENABLED=1 GOOS=android GOARCH="$1" GOARM=7 \
            CC="${NDK_BIN}/$2-clang" CXX="${NDK_BIN}/$2-clang++" \
            go build -v -trimpath -o "${OUT}/$3/libsingboxcore.so" -tags "${TAGS}" \
              -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${SINGBOX_VERSION}' ${LDFLAGS_SHARED} -s -w -buildid= -extldflags=-Wl,-z,max-page-size=16384" \
              ./cmd/sing-box
          }

          build_singbox arm64 aarch64-linux-android23    arm64-v8a
          build_singbox arm   armv7a-linux-androideabi23 armeabi-v7a
          build_singbox amd64 x86_64-linux-android23     x86_64

      # Downloaded until 1.0.237, and the alignment check is what ended that. Xray
      # publishes one Android asset, arm64; the other two ABIs were filled with its
      # linux builds on the reasoning that Android is Linux and a static Go binary
      # does not care. It does care about one thing: Go's linker rounds segments
      # differently per GOOS, so the android asset came out at 64 KB while
      # Xray-linux-64 came out at 4 KB — unusable on a 16 KB-page device, and
      # shipped that way to x86_64 in the same release that fixed sing-box.
      #
      # Building all three from GOOS=android removes the substitution rather than
      # patching around it, and max-page-size makes the result ours instead of a
      # per-architecture default that can move under us. No build tags: that is
      # XTLS's own release setting.
      #
      # Through the NDK, unlike XTLS's own CGO_ENABLED=0 — because
      # `android/arm requires external (cgo) linking, but cgo is not enabled`.
      # That is also why they publish an android asset for arm64 and none for
      # arm32: without an NDK there is nothing to link it with. The toolchain is
      # already here for gomobile and for sing-box, so the same shape serves both
      # cores and there is one way this job builds a core rather than two.
      - name: Build Xray for Android with 16 KB page alignment
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "v${XRAY_VERSION}" \
            https://github.com/XTLS/Xray-core.git "${RUNNER_TEMP}/xray"
          cd "${RUNNER_TEMP}/xray"
          NDK_BIN="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          OUT="${GITHUB_WORKSPACE}/olcbox/androidApp/jniLibs"

          build_xray() {      # $1 = GOARCH, $2 = NDK triple, $3 = android ABI
            mkdir -p "${OUT}/$3"
            CGO_ENABLED=1 GOOS=android GOARCH="$1" GOARM=7 \
            CC="${NDK_BIN}/$2-clang" CXX="${NDK_BIN}/$2-clang++" \
            go build -v -trimpath -buildvcs=false -o "${OUT}/$3/libxraycore.so" \
              -ldflags "-X github.com/xtls/xray-core/core.build=v${XRAY_VERSION} -s -w -buildid= -extldflags=-Wl,-z,max-page-size=16384" \
              ./main
          }

          build_xray arm64 aarch64-linux-android23    arm64-v8a
          build_xray arm   armv7a-linux-androideabi23 armeabi-v7a
          build_xray amd64 x86_64-linux-android23     x86_64

          echo "== staged cores =="
          ls -la "${OUT}"/*/

      # The build flags above are requests, not guarantees: Go's linker passes its
      # own -z max-page-size and whichever lands last wins, and its segment rounding
      # defaults are per-architecture — arm and arm64 round to 64 KB, amd64 to 4 KB,
      # which is how a 4 KB Xray reached x86_64 in the release that fixed sing-box.
      # Checking the artifact is what makes the requests safe to make.
      - name: Verify cores are 16 KB aligned
        working-directory: olcbox
        run: |
          set -euo pipefail
          bad=0
          for f in androidApp/jniLibs/*/lib*core.so; do
            align="$(readelf -lW "$f" | awk '/^  LOAD/{print $NF; exit}')"
            if [ $(( align % 16384 )) -ne 0 ]; then
              echo "MISALIGNED ${f} (${align})"; bad=1
            else
              echo "ok         ${f} (${align})"
            fi
          done
          [ "$bad" -eq 0 ] || {
            echo "A core with sub-16 KB LOAD alignment cannot be mapped on a" >&2
            echo "16 KB-page device: it dies before executing anything, silently." >&2
            exit 1
          }

      - name: Build production APK
        working-directory: olcbox
        run: |
          export OLCRTC_REPO="${{ github.workspace }}/olcrtc"
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          ./gradlew -Polcbox.version="${OLCBOX_VERSION}" -Polcbox.versionCode="${OLCBOX_VERSION_CODE}" :sharedUI:jvmTest :androidApp:assembleGithubRelease :androidApp:bundlePlayRelease --stacktrace

      - name: Prepare universal Android release asset
        working-directory: olcbox
        run: |
          mkdir -p dist
          release_apk="$(find androidApp/build/outputs/apk/github/release -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          if [ -z "${release_apk}" ]; then
            echo "Android release APK was not found" >&2
            exit 1
          fi
          cp "${release_apk}" "dist/ProofKit-${OLCBOX_VERSION}-android-release.apk"

      # Beside the APKs, never instead of them. Play does not accept an APK for a
      # new app, and the APKs are the channel nobody can revoke — clients for
      # circumventing blocks do get pulled from stores, and the day that happens
      # is the wrong day to discover the other channel was dropped to make room.
      - name: Prepare the play-flavor App Bundle for Google Play
        working-directory: olcbox
        run: |
          set -euo pipefail
          bundle="$(find androidApp/build/outputs/bundle/playRelease -type f -name '*.aab' | sort | head -n 1)"
          if [ -z "${bundle}" ]; then
            echo "Android App Bundle (play flavor) was not found" >&2
            exit 1
          fi
          aab="dist/ProofKit-${OLCBOX_VERSION}-android-play.aab"
          cp "${bundle}" "$aab"

          # What makes this bundle the Play one: the two permissions Play refuses
          # at upload are gone (src/play/AndroidManifest.xml), and the cores are
          # in. The manifest inside a bundle is protobuf, but permission names
          # are stored as plain strings, so grep sees them.
          manifest="$(mktemp)"
          unzip -p "$aab" base/manifest/AndroidManifest.xml > "$manifest"
          for perm in android.permission.REQUEST_INSTALL_PACKAGES android.permission.QUERY_ALL_PACKAGES; do
            if grep -a -q "$perm" "$manifest"; then
              echo "::error::${perm} is still in the play bundle's manifest; Play would refuse it." >&2
              exit 1
            fi
            echo "ok   no ${perm}"
          done
          # The listing is read once into a file: a bundle lists thousands of
          # entries, and `unzip -l | grep -q` under pipefail races — grep exits
          # on the first match, unzip takes EPIPE on its next write, and the
          # pipeline reports failure for a core that is there.
          listing="$(mktemp)"
          unzip -l "$aab" > "$listing"
          for core in libsingboxcore.so libxraycore.so libgojni.so; do
            grep -q "base/lib/arm64-v8a/${core}" "$listing" \
              || { echo "MISSING arm64-v8a/${core} in the bundle" >&2; exit 1; }
            echo "ok   arm64-v8a/${core}"
          done
          ls -la dist/

      # Asserted against the finished artifact, not against the staging directory.
      # The bug this catches was not a download that failed — the files were never
      # fetched — but the next one could as easily be an ABI filter or a packaging
      # rule that drops them on the way in, and only the APK can show that.
      - name: Verify cores packaged in the universal APK
        working-directory: olcbox
        run: |
          set -euo pipefail
          apk="dist/ProofKit-${OLCBOX_VERSION}-android-release.apk"
          missing=0
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for core in libsingboxcore.so libxraycore.so; do
              if unzip -l "$apk" | grep -q "lib/${abi}/${core}"; then
                echo "ok   ${abi}/${core}"
              else
                echo "MISSING ${abi}/${core}"; missing=1
              fi
            done
          done
          [ "$missing" -eq 0 ] || {
            echo "Cores are missing from the APK — every Reality/Hysteria2/XHTTP" >&2
            echo "location would fail to start. Refusing to publish." >&2
            exit 1
          }

      - name: Build armeabi-v7a production APK
        working-directory: olcbox
        run: |
          export OLCRTC_REPO="${{ github.workspace }}/olcrtc"
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          ./gradlew -Polcbox.version="${OLCBOX_VERSION}" -Polcbox.versionCode="${OLCBOX_VERSION_CODE}" -Polcbox.android.abiFilters=armeabi-v7a :androidApp:clean :androidApp:assembleGithubRelease --stacktrace

      - name: Prepare armeabi-v7a Android release asset
        working-directory: olcbox
        run: |
          release_apk="$(find androidApp/build/outputs/apk/github/release -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          if [ -z "${release_apk}" ]; then
            echo "Android armeabi-v7a release APK was not found" >&2
            exit 1
          fi
          cp "${release_apk}" "dist/ProofKit-${OLCBOX_VERSION}-android-armeabi-v7a-release.apk"

      - name: Verify cores packaged in the armeabi-v7a APK
        working-directory: olcbox
        run: |
          set -euo pipefail
          apk="dist/ProofKit-${OLCBOX_VERSION}-android-armeabi-v7a-release.apk"
          for core in libsingboxcore.so libxraycore.so; do
            unzip -l "$apk" | grep -q "lib/armeabi-v7a/${core}" \
              || { echo "MISSING armeabi-v7a/${core}" >&2; exit 1; }
            echo "ok   armeabi-v7a/${core}"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ProofKit-android-apks
          path: |
            olcbox/dist/ProofKit-*-android-release.apk
            olcbox/dist/ProofKit-*-android-armeabi-v7a-release.apk
            olcbox/dist/ProofKit-*-android-play.aab

      # After the artifact, so a refusal from Play — the first bundle of an app
      # has to go through the console by hand, and a version code Play already
      # holds is refused — still leaves the APKs downloadable. Same shape as the
      # TestFlight upload: secret present means upload, absent means build only.
      #
      # `continue-on-error`, because this step is a distribution channel and not
      # the build. Without it a refusal from Play fails this job, and
      # publish-nightly is gated on `!contains(needs.*.result, 'failure')` — so
      # one rejected bundle would throw away a whole `all` run, macOS legs and
      # their 10x minutes included, over an upload that was never load-bearing.
      #
      # The path works: 1.0.399 reached the internal track from CI. What it is
      # not is guaranteed — a version code Play already holds is refused
      # outright, a track can be closed, and a token can expire — and none of
      # those should cost the release. The outcome is reported in the step
      # summary below, so making the failure non-fatal does not make it silent.
      - name: Upload the play bundle to Google Play
        id: play_upload
        continue-on-error: true
        if: env.PLAY_SERVICE_ACCOUNT_JSON != '' && inputs.play_track != 'none'
        working-directory: olcbox
        env:
          PLAY_TRACK: ${{ inputs.play_track || 'internal' }}
        run: |
          set -euo pipefail
          sa="$RUNNER_TEMP/play-service-account.json"
          printf '%s' "${PLAY_SERVICE_ACCOUNT_JSON}" > "$sa"
          # A venv for the same reason as the App Store Connect step: the
          # runner's Python refuses to install into itself.
          python3 -m venv "$RUNNER_TEMP/play-venv"
          "$RUNNER_TEMP/play-venv/bin/pip" install --quiet google-api-python-client google-auth
          "$RUNNER_TEMP/play-venv/bin/python" scripts/play-upload.py \
            --service-account "$sa" \
            --package org.proofkit.app \
            --bundle "dist/ProofKit-${OLCBOX_VERSION}-android-play.aab" \
            --track "${PLAY_TRACK}" \
            --release-name "${OLCBOX_VERSION}" \
            --notes "ProofKit ${OLCBOX_VERSION}"
          rm -f "$sa"

      # Says what happened to the Play upload in the run summary, so that
      # "continue-on-error" cannot turn a refusal into silence. Never fails.
      - name: Report the Google Play upload
        if: always() && env.PLAY_SERVICE_ACCOUNT_JSON != '' && inputs.play_track != 'none'
        env:
          PLAY_TRACK: ${{ inputs.play_track || 'internal' }}
          PLAY_OUTCOME: ${{ steps.play_upload.outcome }}
        run: |
          set -euo pipefail
          if [ "$PLAY_OUTCOME" = "success" ]; then
            echo "Google Play: uploaded ${OLCBOX_VERSION} (${OLCBOX_VERSION_CODE}) to the ${PLAY_TRACK} track." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Google Play upload did NOT happen"
              echo
              echo "Track \`${PLAY_TRACK}\`, version ${OLCBOX_VERSION} (${OLCBOX_VERSION_CODE}) — step outcome: \`${PLAY_OUTCOME}\`."
              echo
              echo "The rest of the release is unaffected; the bundle is in the \`ProofKit-android-apks\` artifact."
              echo "Common causes: the service account has not been granted access in Play Console yet,"
              echo "the app has never had a release created by hand (Play requires the first one through the console),"
              echo "or this version code was already used."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  build-ios:
    needs: [release_version, plan]
    if: needs.plan.outputs.ios == 'true'
    runs-on: macos-latest
    permissions:
      contents: read

    env:
      OLCBOX_VERSION: ${{ needs.release_version.outputs.version }}
      OLCBOX_VERSION_CODE: ${{ needs.release_version.outputs.version_code }}

    steps:
      - name: Checkout olcbox
        uses: actions/checkout@v7
        with:
          path: olcbox

      - name: Checkout olcrtc
        uses: actions/checkout@v7
        with:
          repository: romanpodpriatov/olcrtc
          ref: ${{ needs.release_version.outputs.olcrtc_ref }}
          path: olcrtc
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^26.0'

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: olcrtc/go.sum

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Go mobile tooling
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest

      - name: Initialize gomobile
        working-directory: olcrtc
        run: |
          gomobile init

      - name: Import the iOS distribution certificate
        id: signing
        env:
          IOS_DIST_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          IOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
        run: |
          set -euo pipefail
          # Signing needs two things: the Apple Distribution certificate, and an
          # App Store Connect API key allowed to manage profiles and upload
          # builds (Admin or App Manager). The key is the notary one — same team,
          # same .p8. Without either, the job builds the unsigned IPA it always
          # built, so a fork or a missing secret degrades rather than fails.
          if [ -z "${IOS_DIST_CERTIFICATE_BASE64:-}" ] || [ -z "${MACOS_NOTARY_KEY_BASE64:-}" ]; then
            echo "No iOS signing secrets; building the unsigned IPA."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A dedicated keychain, as the macOS job does: nothing leaks into the
          # runner's login one and codesign reaches the key without a prompt.
          kc="$RUNNER_TEMP/ios-signing.keychain-db"
          pw="$(uuidgen)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"

          cert="$RUNNER_TEMP/apple-distribution.p12"
          echo "$IOS_DIST_CERTIFICATE_BASE64" | tr -d '[:space:]' | base64 --decode > "$cert"
          security import "$cert" -k "$kc" -P "$IOS_DIST_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$cert"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')

          echo "== identities available =="
          security find-identity -v -p codesigning "$kc"
          if ! security find-identity -v -p codesigning "$kc" | grep -q "Apple Distribution"; then
            echo "::error::IOS_DIST_CERTIFICATE_BASE64 holds no Apple Distribution identity; export that certificate with its private key from Keychain Access." >&2
            exit 1
          fi

          echo "$MACOS_NOTARY_KEY_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/asc.p8"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Provisioning profiles from App Store Connect
        if: steps.signing.outputs.signed == 'true'
        working-directory: olcbox
        env:
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
        run: |
          set -euo pipefail
          # Made by name from the team's distribution certificates and installed
          # where xcodebuild looks, so a renewed certificate costs a re-run, not
          # a new secret. See the script for what the key has to be allowed to do.
          # A venv, because the runner's Homebrew Python refuses to install into
          # itself (PEP 668, "externally-managed-environment").
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/asc-venv/bin/python" scripts/asc-profiles.py \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer-id "$MACOS_NOTARY_ISSUER_ID" \
            --key-path "$RUNNER_TEMP/asc.p8" \
            --capability "org.proofkit.app=ASSOCIATED_DOMAINS" \
            --profile "ProofKit App Store=org.proofkit.app" \
            --profile "ProofKit PacketTunnel App Store=org.proofkit.app.PacketTunnel"

      - name: Archive and upload to TestFlight
        if: steps.signing.outputs.signed == 'true'
        working-directory: olcbox
        env:
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
        run: |
          set -euo pipefail
          export OLCRTC_REPO="${{ github.workspace }}/olcrtc"
          archive="build/ios-archive/ProofKit.xcarchive"

          # Manual signing with the distribution identity for both targets; the
          # profile each one takes is looked up by its own name, since a build
          # setting on the command line applies to every target at once.
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$archive" \
            -derivedDataPath build/ios-ipa/DerivedData \
            MARKETING_VERSION="${OLCBOX_VERSION}" \
            CURRENT_PROJECT_VERSION="${OLCBOX_VERSION_CODE}" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=3QJG3J7L66 \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            'PROVISIONING_PROFILE_SPECIFIER=$(PROFILE_$(TARGET_NAME))' \
            "PROFILE_iosApp=ProofKit App Store" \
            "PROFILE_PacketTunnel=ProofKit PacketTunnel App Store" \
            archive

          # The app and every extension inside it must carry the same version —
          # the same check the unsigned path makes, on the archived app.
          app_path="$archive/Products/Applications/iosApp.app"
          for plist in "$app_path/Info.plist" "$app_path"/PlugIns/*.appex/Info.plist; do
            [ -f "$plist" ] || continue
            short="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$plist")"
            build_number="$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$plist")"
            echo "$plist: $short ($build_number)"
            if [ "$short" != "${OLCBOX_VERSION}" ] || [ "$build_number" != "${OLCBOX_VERSION_CODE}" ]; then
              echo "::error::$plist says $short ($build_number), expected ${OLCBOX_VERSION} (${OLCBOX_VERSION_CODE})." >&2
              exit 1
            fi
          done

          cat > "$RUNNER_TEMP/export-options.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>3QJG3J7L66</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>org.proofkit.app</key>
              <string>ProofKit App Store</string>
              <key>org.proofkit.app.PacketTunnel</key>
              <string>ProofKit PacketTunnel App Store</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST

          # Uploaded by xcodebuild itself — no altool, no Transporter. The build
          # appears in TestFlight once Apple has processed it, usually within
          # ten minutes; internal testers get it without a review.
          xcodebuild \
            -exportArchive \
            -archivePath "$archive" \
            -exportOptionsPlist "$RUNNER_TEMP/export-options.plist" \
            -exportPath build/ios-export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$MACOS_NOTARY_KEY_ID" \
            -authenticationKeyIssuerID "$MACOS_NOTARY_ISSUER_ID"
          echo "Uploaded ProofKit ${OLCBOX_VERSION} (${OLCBOX_VERSION_CODE}) to App Store Connect."

      - name: Keep the dSYMs
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ProofKit-ios-dSYMs
          path: olcbox/build/ios-archive/ProofKit.xcarchive/dSYMs

      - name: Build unsigned iOS app
        if: steps.signing.outputs.signed != 'true'
        working-directory: olcbox
        run: |
          export OLCRTC_REPO="${{ github.workspace }}/olcrtc"
          # The same version every other platform gets, from the same job.
          # Without these two the build falls back to the literals in the
          # pbxproj, which is how the App Store came to show 1.0.0 for a build
          # whose own about screen said 1.0.24x. Passed on the command line so
          # they reach *every* target: the app and PacketTunnel must agree, and a
          # mismatch between them fails the install on a device rather than the
          # build.
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/ios-ipa/DerivedData \
            MARKETING_VERSION="${OLCBOX_VERSION}" \
            CURRENT_PROJECT_VERSION="${OLCBOX_VERSION_CODE}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        if: steps.signing.outputs.signed != 'true'
        working-directory: olcbox
        run: |
          app_path="build/ios-ipa/DerivedData/Build/Products/Release-iphoneos/iosApp.app"
          if [ ! -d "$app_path" ]; then
            echo "iOS app product was not found at $app_path" >&2
            exit 1
          fi

          # Xcode omits an Info.plist key entirely when the $(BUILD_SETTING) it
          # refers to is undefined, and PlistBuddy then fails with a bare "Entry,
          # Does Not Exist" that names neither the setting nor the target. Say
          # which key and why, because the answer is never in this file.
          for key in CFBundleShortVersionString CFBundleVersion; do
            if ! /usr/libexec/PlistBuddy -c "Print :$key" "$app_path/Info.plist" >/dev/null 2>&1; then
              echo "::error::$key is missing from the built Info.plist. Info.plist reads it from a build setting, and Xcode drops the key when that setting is undefined — check MARKETING_VERSION and CURRENT_PROJECT_VERSION are set on the iosApp target, not only on PacketTunnel." >&2
              exit 1
            fi
          done

          # Checked, not set. xcodebuild is handed MARKETING_VERSION and
          # CURRENT_PROJECT_VERSION above, so every target already carries them;
          # writing them again afterwards only papered over a broken build and,
          # worse, papered over it *for the app alone* — this used to Set the
          # app's Info.plist and never touch the extension's, which is how a
          # 1.0.0 appex could ride inside a 1.0.26x app. That mismatch fails the
          # install on a device, not the build, so it surfaces late and looks
          # like anything but a version.
          for plist in "$app_path/Info.plist" "$app_path"/PlugIns/*.appex/Info.plist; do
            [ -f "$plist" ] || continue
            short="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$plist")"
            build_number="$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$plist")"
            echo "$plist: $short ($build_number)"
            if [ "$short" != "${OLCBOX_VERSION}" ] || [ "$build_number" != "${OLCBOX_VERSION_CODE}" ]; then
              echo "::error::$plist says $short ($build_number), expected ${OLCBOX_VERSION} (${OLCBOX_VERSION_CODE}). The app and every extension inside it must agree." >&2
              exit 1
            fi
          done

          rm -rf build/ios-ipa/package dist
          mkdir -p build/ios-ipa/package/Payload dist
          cp -R "$app_path" build/ios-ipa/package/Payload/
          (cd build/ios-ipa/package && /usr/bin/zip -qry "${GITHUB_WORKSPACE}/olcbox/dist/ProofKit-${OLCBOX_VERSION}-ios-unsigned.ipa" Payload)
          unzip -t "dist/ProofKit-${OLCBOX_VERSION}-ios-unsigned.ipa"

      - name: Upload artifact
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ProofKit-ios-unsigned-ipa
          path: olcbox/dist/ProofKit-${{ env.OLCBOX_VERSION }}-ios-unsigned.ipa


  notarise-wait:
    name: Wait for Apple (1x runner)
    needs: [plan, build-macos]
    # Not gated on publishing any more — see the submit step for why. This job is
    # a 1x runner sleeping, so running it for test builds too costs almost
    # nothing; the expensive machine was released before it started.
    if: needs.plan.outputs.macos_any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.macos_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: ProofKit-macos-${{ matrix.arch }}-dmg
          path: dist
      - name: Wait for the verdict
        env:
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ ! -f dist/notary-submission-id.txt ]; then
            echo "Nothing was submitted; the DMG is unsigned or the credentials are absent."
            exit 0
          fi
          pip install --quiet pyjwt cryptography
          python3 scripts/notary-wait.py "$(cat dist/notary-submission-id.txt)"

  staple-macos:
    name: Staple the ticket
    needs: [plan, release_version, notarise-wait]
    if: needs.plan.outputs.macos_any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.macos_matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      OLCBOX_VERSION: ${{ needs.release_version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ProofKit-macos-${{ matrix.arch }}-dmg
          path: dist
      - name: Staple
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          dmg="dist/ProofKit-${OLCBOX_VERSION}-macos-${ARCH}.dmg"
          if [ ! -f dist/notary-submission-id.txt ]; then
            echo "Not notarised; nothing to staple."
            exit 0
          fi
          # Seconds of a 10x runner instead of the twenty minutes the wait used
          # to cost. Stapling matters because it puts the approval inside the
          # file, so Gatekeeper is silent even for a user with no working path
          # to Apple — which, for a VPN's users, is not a rare situation.
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -t open --context context:primary-signature -vv "$dmg" || true
      - uses: actions/upload-artifact@v7
        with:
          name: ProofKit-macos-${{ matrix.arch }}-dmg
          path: dist/ProofKit-*-macos-${{ matrix.arch }}.dmg
          overwrite: true

  publish-nightly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs:
      - plan
      - release_version
      - build-windows
      - build-macos
      - staple-macos
      - build-linux
      - build-android
      - build-ios
    # Only a full build publishes. A partial run would otherwise replace the nightly
    # release with whichever platforms happened to be selected, silently dropping the
    # rest. Skipped builds must not block this, hence the explicit failure check
    # instead of relying on `needs` alone.
    if: ${{ needs.plan.outputs.publish == 'true' && !cancelled() && !contains(needs.*.result, 'failure') }}
    concurrency:
      group: publish-${{ github.repository }}-${{ needs.release_version.outputs.nightly_tag }}
      cancel-in-progress: false
    env:
      OLCBOX_VERSION: ${{ needs.release_version.outputs.version }}
      OLCBOX_VERSION_CODE: ${{ needs.release_version.outputs.version_code }}
      OLCBOX_OLCRTC_REF: ${{ needs.release_version.outputs.olcrtc_ref }}
      OLCBOX_NIGHTLY_TAG: ${{ needs.release_version.outputs.nightly_tag }}
      OLCBOX_NIGHTLY_TITLE: ${{ needs.release_version.outputs.nightly_title }}

    steps:
      - name: Checkout olcbox
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Clear release staging dir
        run: rm -rf dist

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Keep the debug symbols out of the release
        # The dSYMs ride along as a workflow artifact so a crash log can be
        # read later; they are not something to ship. Left here, the DWARF
        # binaries and their Info.plists became release assets once.
        run: rm -rf dist/ProofKit-ios-dSYMs

      - name: Generate checksums and release notes
        run: |
          checksum_file="dist/SHA256SUMS.txt"
          find dist -type f ! -name "SHA256SUMS.txt" | sort | while IFS= read -r file; do
            sha256sum "$file" | awk -v name="$(basename "$file")" '{print $1 "  " name}'
          done > "$checksum_file"

          mapfile -t assets < <(find dist -type f | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found"
            exit 1
          fi

          {
            echo "Latest desktop, Android, and iOS builds from public GitHub Actions CI."
            echo
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- Source branch: \`${GITHUB_REF_NAME}\`"
            echo "- olcrtc branch: \`${OLCBOX_OLCRTC_REF}\`"
            echo "- App version: \`${OLCBOX_VERSION}\`"
            echo "- Android versionCode: \`${OLCBOX_VERSION_CODE}\`"
            echo "- Android APKs: universal and \`armeabi-v7a\`"
            echo "- Android App Bundle: the \`play\` flavor, as uploaded to Google Play (no self-updater)"
            echo "- Workflow: \`.github/workflows/release.yml\`"
            echo "- Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "### SHA256"
            echo
            echo "| Asset | SHA256 |"
            echo "| --- | --- |"
            awk '{printf "| `%s` | `%s` |\n", $2, $1}' "$checksum_file"
          } > release-notes.md

      - name: Attest release assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/**

      - name: Publish permanent versioned release
        env:
          # A fine-grained PAT (contents + workflows: write on this repository)
          # when the repository has one, because the default token cannot create
          # a tag on a commit that changes a workflow file; the default token
          # otherwise, which still works for every commit that does not.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version_tag="v${OLCBOX_VERSION}"
          git fetch --tags --force --quiet || true

          # Auto changelog: commits since the previous versioned release tag.
          prev_tag="$(git tag -l 'v1.0.*' --sort=-version:refname | grep -vx "${version_tag}" | head -1 || true)"
          {
            echo "## What's new in ${version_tag}"
            echo
            if [ -n "$prev_tag" ]; then
              echo "Changes since \`${prev_tag}\`:"
              echo
              git log --no-merges --pretty=format:'- %s (%h)' "${prev_tag}..HEAD" || true
            else
              echo "First versioned release. Recent changes:"
              echo
              git log --no-merges --pretty=format:'- %s (%h)' -20 || true
            fi
            echo
            echo
            # A note that belongs to this release and not to a commit: an
            # Android reinstall, a server switch. Written for one release and
            # removed after it ships, so it never repeats.
            if [ -f docs/release-notes/pending.md ]; then
              cat docs/release-notes/pending.md
              echo
              echo
            fi
            cat release-notes.md
          } > versioned-notes.md

          mapfile -t assets < <(find dist -type f | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found"
            exit 1
          fi

          # Permanent, immutable per-build release for rollback. Prerelease so it is
          # NOT returned by /releases/latest (the updater's Stable channel), leaving
          # auto-update behavior unchanged — these exist purely for manual download.
          if gh release view "$version_tag" >/dev/null 2>&1; then
            echo "Release ${version_tag} already exists; refreshing notes + assets"
            gh release edit "$version_tag" --notes-file versioned-notes.md --prerelease --draft=false
          else
            gh release create "$version_tag" \
              --target "$GITHUB_SHA" \
              --title "ProofKit ${OLCBOX_VERSION}" \
              --notes-file versioned-notes.md \
              --prerelease \
              --draft
          fi

          sleep 5
          for asset in "${assets[@]}"; do
            echo "Uploading ${asset} to ${version_tag}"
            for attempt in 1 2 3; do
              if gh release upload "$version_tag" "$asset" --clobber; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Failed to upload ${asset} after ${attempt} attempts" >&2
                exit 1
              fi
              echo "Upload failed for ${asset}; retrying in 10 seconds" >&2
              sleep 10
            done
          done

          gh release edit "$version_tag" --draft=false --prerelease
      - name: Publish public GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t assets < <(find dist -type f | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found"
            exit 1
          fi

          if gh release view "$OLCBOX_NIGHTLY_TAG" >/dev/null 2>&1; then
            gh release delete "$OLCBOX_NIGHTLY_TAG" --yes --cleanup-tag
          fi

          # The tag is created through the Releases API, and that path is NOT
          # exempt from the rule that the default GITHUB_TOKEN may not create a
          # ref whose commit touches .github/workflows/*. The first release cut
          # from a commit that changed a workflow file learned this the hard way:
          # it deleted the previous nightly above, then got "Resource not
          # accessible by integration" here, and the nightly channel was gone.
          # Hence RELEASE_TOKEN, and hence the versioned release running first -
          # it creates its tag before anything is deleted, so a token that cannot
          # create tags fails the job with the old nightly still in place.
          gh release create "$OLCBOX_NIGHTLY_TAG" \
            --target "$GITHUB_SHA" \
            --title "$OLCBOX_NIGHTLY_TITLE" \
            --notes-file release-notes.md \
            --prerelease \
            --draft

          # Give GitHub a moment to make the draft release available for asset uploads.
          sleep 5

          for asset in "${assets[@]}"; do
            echo "Uploading ${asset}"
            for attempt in 1 2 3; do
              if gh release upload "$OLCBOX_NIGHTLY_TAG" "$asset" --clobber; then
                break
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "Failed to upload ${asset} after ${attempt} attempts" >&2
                exit 1
              fi

              echo "Upload failed for ${asset}; retrying in 10 seconds" >&2
              sleep 10
            done
          done

          gh release edit "$OLCBOX_NIGHTLY_TAG" --draft=false --prerelease

