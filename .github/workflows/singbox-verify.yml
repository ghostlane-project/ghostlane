name: core verify

# Validates that the config builders emit configs the PINNED core binaries
# actually accept (schema check against the real binaries). sing-box handles
# reality+hy2+olcrtc; Xray-core handles xhttp (sing-box can't). No device needed.
on:
  push:
    branches: [feat/singbox-ci-verify]
    # Editing the release pipeline or prose cannot break the cores, and this
    # workflow spends ~25 minutes of emulator time to say so.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SINGBOX_VERSION: "1.13.14"
  XRAY_VERSION: "25.3.6"
  ANDROID_NDK_VERSION: "28.2.13676358"

# Superseded pushes stop paying: a new commit cancels the run for the previous one.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Task 8 (Android): both cores publish prebuilt android binaries, so we exec
  # them from nativeLibraryDir (the v2rayNG pattern) instead of gomobile libbox/
  # libXray — unified with the desktop controllers. This job proves the prebuilt
  # binaries download + are valid android arm64 executables, and packages them as
  # jniLibs (lib*.so) for the app build. (gomobile libbox also builds — verified
  # in history — but exec-binary is simpler and needs no AAR.)
  android-cores:
    name: fetch + verify android core binaries
    runs-on: ubuntu-latest
    steps:
      - name: Download sing-box android arm64
        run: |
          url="https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-android-arm64.tar.gz"
          curl -fsSL "$url" -o sb.tgz
          tar xzf sb.tgz
          find . -name 'sing-box' -maxdepth 2 -exec cp {} sing-box-android \;
          file sing-box-android
      - name: Download xray android arm64
        run: |
          url="https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-android-arm64-v8a.zip"
          curl -fsSL "$url" -o xray.zip
          mkdir -p xray-a && (cd xray-a && unzip -o ../xray.zip)
          cp xray-a/xray xray-android
          file xray-android
      - name: Verify both are ARM aarch64 executables
        run: |
          file sing-box-android | grep -qi "aarch64" && echo "sing-box: OK arm64"
          file xray-android | grep -qi "aarch64" && echo "xray: OK arm64"
      - name: Package as jniLibs (lib*.so) for exec-from-nativeLibraryDir
        run: |
          mkdir -p jniLibs/arm64-v8a
          cp sing-box-android jniLibs/arm64-v8a/libsingboxcore.so
          cp xray-android jniLibs/arm64-v8a/libxraycore.so
          ls -la jniLibs/arm64-v8a
      - name: Upload jniLibs
        uses: actions/upload-artifact@v7
        with:
          name: android-core-jnilibs
          path: jniLibs

  # Compile androidMain (the Android engine controllers) via the full android
  # build, mirroring pr-checks. Catches API-level (NewApi) issues at minSdk 23
  # that a plain kotlin compile would miss.
  android-compile:
    name: compile androidMain (controllers)
    runs-on: ubuntu-latest
    env:
      OLCBOX_CRYPT_KEY_V1: ${{ secrets.OLCBOX_CRYPT_KEY_V1 }}
      OLCBOX_ADMIN_PASS_SHA256: ${{ secrets.OLCBOX_ADMIN_PASS_SHA256 }}
    steps:
      - name: Checkout olcbox
        uses: actions/checkout@v7
        with:
          path: olcbox
      - name: Checkout olcrtc
        uses: actions/checkout@v7
        with:
          repository: ghostlane-project/olcrtc
          ref: proofkit
          path: olcrtc
          submodules: recursive
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache-dependency-path: olcrtc/go.sum
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's default is 'tools platform-tools'; the legacy tools
          # package is no longer in Google's repository (2026-09-15) and sdkmanager
          # fails the whole step over it. The next step installs what the build needs.
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Install Go mobile tooling
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest
      - name: Initialize gomobile
        working-directory: olcrtc
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          gomobile init
      - name: Bundle android core binaries into jniLibs
        working-directory: olcbox
        run: |
          set -ex
          dest="androidApp/jniLibs/arm64-v8a"
          mkdir -p "$dest"
          # sing-box (tar.gz → extract in place, mirror the android-cores job)
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-android-arm64.tar.gz" -o sb.tgz
          tar xzf sb.tgz
          sb=$(find . -maxdepth 2 -type f -name sing-box | head -1)
          echo "found sing-box at: $sb"
          cp "$sb" "$dest/libsingboxcore.so"
          # xray (zip)
          curl -fsSL "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-android-arm64-v8a.zip" -o xray.zip
          rm -rf xray-a && mkdir -p xray-a && (cd xray-a && unzip -o ../xray.zip)
          xr=$(find xray-a -maxdepth 2 -type f -name xray | head -1)
          echo "found xray at: $xr"
          cp "$xr" "$dest/libxraycore.so"
          test -f "$dest/libsingboxcore.so" && test -f "$dest/libxraycore.so"
          ls -la "$dest"
      - name: Assemble android (compiles controllers, packages cores)
        working-directory: olcbox
        run: |
          export OLCRTC_REPO="${{ github.workspace }}/olcrtc"
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          ./gradlew :androidApp:assembleDebug --stacktrace
      - name: Verify core binaries packaged in the APK
        working-directory: olcbox
        run: |
          apk=$(find androidApp/build/outputs/apk -name '*.apk' | head -1)
          echo "APK: $apk"
          unzip -l "$apk" | grep -E 'lib/arm64-v8a/(libsingboxcore|libxraycore)\.so' || \
            { echo "core binaries missing from APK"; exit 1; }
          echo "sing-box + xray cores packaged OK"

  config-check:
    name: sing-box config schema check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout olcbox
        uses: actions/checkout@v7
        with:
          path: olcbox

      - name: Checkout olcrtc
        uses: actions/checkout@v7
        with:
          repository: ghostlane-project/olcrtc
          ref: proofkit
          path: olcrtc
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache-dependency-path: olcrtc/go.sum

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's default is 'tools platform-tools'; the legacy tools
          # package is no longer in Google's repository (2026-09-15) and sdkmanager
          # fails the whole step over it. The next step installs what the build needs.
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Go mobile tooling
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest

      - name: Initialize gomobile
        working-directory: olcrtc
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          gomobile init

      - name: Generate configs from the builders
        working-directory: olcbox
        run: |
          export OLCRTC_REPO="${{ github.workspace }}/olcrtc"
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          # All net tests (LinkParser, SingBoxConfig, XrayConfig, EngineDispatcher)
          # + the dump tests that emit configs for the check steps below. jvmTest
          # compiles jvmMain (the desktop controllers). androidMain (the Android
          # controllers) compiles on merge to main via release.yml's android build.
          ./gradlew :sharedUI:jvmTest --tests "org.olcbox.app.net.*" --stacktrace
          echo "--- sing-box configs ---"
          for f in sharedUI/build/singbox-configs/*.json; do echo "== $f =="; cat "$f"; echo; done
          echo "--- xray configs ---"
          for f in sharedUI/build/xray-configs/*.json; do echo "== $f =="; cat "$f"; echo; done

      - name: Download pinned sing-box
        run: |
          url="https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          echo "Downloading $url"
          curl -fsSL "$url" -o sb.tar.gz
          tar xzf sb.tar.gz
          mv sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box /usr/local/bin/sing-box
          sing-box version

      # Per-transport steps so each verdict is visible via the jobs API (step
      # conclusions are readable without log auth). Core transports must pass;
      # xhttp is allowed to fail (Xray transport — informational).
      - name: check vless-reality
        working-directory: olcbox
        run: sing-box check -c sharedUI/build/singbox-configs/vless-reality.json

      - name: check hysteria2
        working-directory: olcbox
        run: sing-box check -c sharedUI/build/singbox-configs/hysteria2.json

      - name: check olcrtc-socks
        working-directory: olcbox
        run: sing-box check -c sharedUI/build/singbox-configs/olcrtc-socks.json

      # The macOS root daemon's shape. It is the only one emitting a route
      # exclusion, a `local` DNS server and a second inbound — all 1.12+ syntax
      # that no other dump exercises, so nothing else here would catch a schema
      # drift in it.
      - name: check desktop-tun
        working-directory: olcbox
        run: sing-box check -c sharedUI/build/singbox-configs/desktop-tun.json

      - name: check desktop-tun-native
        working-directory: olcbox
        run: sing-box check -c sharedUI/build/singbox-configs/desktop-tun-native.json

      - name: Download Xray-core (pinned, fallback to latest)
        run: |
          set -e
          url="https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip"
          echo "Trying pinned $url"
          if ! curl -fsSL "$url" -o xray.zip; then
            latest=$(curl -fsSL https://api.github.com/repos/XTLS/Xray-core/releases/latest | python3 -c "import sys,json;print(json.load(sys.stdin)['tag_name'])")
            echo "Pinned v${XRAY_VERSION} not found; falling back to latest $latest"
            curl -fsSL "https://github.com/XTLS/Xray-core/releases/download/${latest}/Xray-linux-64.zip" -o xray.zip
          fi
          mkdir -p xray-bin && (cd xray-bin && unzip -o ../xray.zip)
          chmod +x xray-bin/xray
          echo "USING XRAY:"; ./xray-bin/xray version | head -1

      - name: xray test vless-xhttp
        working-directory: olcbox
        run: ${{ github.workspace }}/xray-bin/xray run -c sharedUI/build/xray-configs/vless-xhttp.json -test

      # The iOS shapes behind a tun2socks: Xray answering DNS itself, and
      # Bypass Russia with the bundled lists inline (12,000 rules the unit
      # tests only count; this is what parses them).
      - name: xray test vless-xhttp answering dns, and Bypass Russia
        working-directory: olcbox
        run: |
          ${{ github.workspace }}/xray-bin/xray run -c sharedUI/build/xray-configs/vless-xhttp-answers-dns.json -test
          ${{ github.workspace }}/xray-bin/xray run -c sharedUI/build/xray-configs/vless-xhttp-bypass-russia.json -test

      # End-to-end tunnel proof for the olcrtc-socks chain: a backing SOCKS server
      # stands in for the olcrtc engine; our generated config chains
      # <inbound> → <backing> → direct, and curling through the inbound proves the
      # config actually carries traffic, not just that it's schema-valid.
      # Both ports are read out of the generated config so this follows the Kotlin
      # constants instead of drifting from them.
      - name: tunnel — olcrtc-socks chain
        working-directory: olcbox
        run: |
          set -e
          CFG=sharedUI/build/singbox-configs/olcrtc-socks.json
          IN_PORT=$(jq -r '.inbounds[0].listen_port' "$CFG")
          BACK_PORT=$(jq -r '.outbounds[0].server_port' "$CFG")
          echo "chain: :$IN_PORT → :$BACK_PORT → direct"
          cat > /tmp/backing-socks.json <<JSON
          { "inbounds": [ { "type": "socks", "listen": "127.0.0.1", "listen_port": $BACK_PORT } ],
            "outbounds": [ { "type": "direct" } ] }
          JSON
          echo "start backing socks (stands in for olcrtc engine)"
          sing-box run -c /tmp/backing-socks.json &
          BACK=$!
          echo "start our generated olcrtc-socks config"
          sing-box run -c "$CFG" &
          CLIENT=$!
          sleep 3
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 --socks5-hostname 127.0.0.1:$IN_PORT http://example.com)
          echo "HTTP via tunnel: $code"
          kill $CLIENT $BACK 2>/dev/null || true
          [ "$code" = "200" ]

      # End-to-end tunnel proof for hysteria2 (a primary transport): stand up a
      # real sing-box hy2 server with a self-signed cert + salamander obfs, patch
      # our generated client config to the local server, and curl through. Proves
      # the hy2 handshake completes with our config and carries traffic.
      # (vless+reality is schema-verified above via `sing-box check`; its live
      # handshake is finicky to self-host in CI and is best smoked on a real
      # origin/device — the config correctness is already proven.)
      - name: tunnel — hysteria2
        working-directory: olcbox
        run: |
          set -e
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/hy2.key -out /tmp/hy2.crt \
            -days 1 -nodes -subj "/CN=www.microsoft.com" >/dev/null 2>&1
          cat > /tmp/hy2-server.json <<'JSON'
          { "inbounds": [ {
              "type": "hysteria2", "listen": "127.0.0.1", "listen_port": 8443,
              "users": [ { "password": "PASSWORD123" } ],
              "obfs": { "type": "salamander", "password": "OBFSPW" },
              "tls": { "enabled": true, "certificate_path": "/tmp/hy2.crt", "key_path": "/tmp/hy2.key" } } ],
            "outbounds": [ { "type": "direct" } ] }
          JSON
          # our builder's hy2 config (socks in + hy2 out) patched to the local port
          jq '.outbounds[0].server_port=8443' \
            sharedUI/build/singbox-configs/hysteria2.json > /tmp/hy2-client.json
          echo "--- hy2 client (from our builder) ---"; cat /tmp/hy2-client.json
          sing-box check -c /tmp/hy2-server.json
          sing-box run -c /tmp/hy2-server.json &
          SRV=$!
          sing-box run -c /tmp/hy2-client.json &
          CLI=$!
          sleep 3
          IN_PORT=$(jq -r '.inbounds[0].listen_port' /tmp/hy2-client.json)
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 --socks5-hostname 127.0.0.1:$IN_PORT http://example.com)
          echo "HTTP via hy2 tunnel (:$IN_PORT): $code"
          kill $CLI $SRV 2>/dev/null || true
          [ "$code" = "200" ]

  # The Android connect path had only ever been compile-checked. Everything that
  # actually broke on desktop — packaging, exec, a config that ignored its port —
  # is invisible to a compiler, so this runs the packaged core on an emulator.
  # x86_64 because that is what boots fast on a runner; sing-box publishes an
  # android-amd64 build, and the packaging being exercised is ABI-independent.
  android-instrumented:
    name: instrumented core test (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout olcbox
        uses: actions/checkout@v7
        with:
          path: olcbox

      - name: Checkout olcrtc
        uses: actions/checkout@v7
        with:
          repository: ghostlane-project/olcrtc
          ref: proofkit
          path: olcrtc
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache-dependency-path: olcrtc/go.sum

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's default is 'tools platform-tools'; the legacy tools
          # package is no longer in Google's repository (2026-09-15) and sdkmanager
          # fails the whole step over it. The next step installs what the build needs.
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Go mobile tooling
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest

      - name: Initialize gomobile
        working-directory: olcrtc
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          gomobile init

      - name: Bundle x86_64 cores into jniLibs
        working-directory: olcbox
        run: |
          set -ex
          dest="androidApp/jniLibs/x86_64"
          mkdir -p "$dest"
          # sing-box ships a native android-amd64 build.
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-android-amd64.tar.gz" -o sb.tgz
          tar xzf sb.tgz
          cp "$(find . -maxdepth 2 -type f -name sing-box | head -1)" "$dest/libsingboxcore.so"
          # Xray has no android-x86_64 asset; its linux-64 build is a static Go
          # binary and runs on Android x86_64 unchanged.
          curl -fsSL "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip" -o xray.zip
          rm -rf xray-x && mkdir -p xray-x && (cd xray-x && unzip -o ../xray.zip)
          cp "$(find xray-x -maxdepth 2 -type f -name xray | head -1)" "$dest/libxraycore.so"
          ls -la "$dest"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator action splits `script` on newlines and runs each line in its
      # own `sh -c`, so an `export` there is discarded before the next line and a
      # `\` continuation is passed to the command as a literal argument. The
      # environment therefore has to be set here, and the run below stays one line.
      - name: Export the emulator test environment
        run: |
          {
            echo "OLCRTC_REPO=${{ github.workspace }}/olcrtc"
            echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
            echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          } >> "$GITHUB_ENV"

      - name: Run instrumented core tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: olcbox
          script: ./gradlew :androidApp:connectedDebugAndroidTest -Polcbox.android.abiFilters=x86_64 --stacktrace
