name: Parity ledger

# docs/rust-parity/ lists every feature of today's builds, by platform, and the
# test that proves each on the Rust core. scripts/parity-ledger.py holds the
# ledger to the tree: a feature with no row, a row for a feature a platform does
# not have, a test id that does not exist, a proven row with no test, and a
# link scheme, routing mode, carrier, transport, setting, CLI command, flag or
# environment variable the tree has and the inventory leaves out. It then plants
# each of those faults in a copy and expects to be told.
#
# The runbook step: docs/rust-core.md is the lasting account of the checks. A
# check named nowhere in it fails the job. The checks are K1 to K12, every
# workflow file under .github/workflows/ and every step of scripts/pin-move.d/;
# a new workflow or step is told in the runbook in the commit that adds it.
#
# Nothing here builds, signs or reaches a network. On a pull request into
# rust/all, on a push to a rust/ branch that touches what the check reads, and
# by hand (the integrator runs it at each wave gate and pin move).
on:
  workflow_dispatch:
  pull_request:
    branches:
      - rust/all
  push:
    branches:
      - 'rust/**'
    paths:
      - docs/rust-parity/**
      - scripts/parity-ledger.py
      - .github/workflows/parity.yml
      - README.MD
      - docs/*.md
      - .github/workflows/*.yml
      - scripts/pin-move.d/*
      - sharedUI/src/commonMain/kotlin/org/olcbox/app/net/LinkParser.kt
      - sharedUI/src/commonMain/kotlin/org/olcbox/app/data/model/**
      - cli/cmd/ghostlane/**

permissions:
  contents: read

jobs:
  ledger:
    name: The ledger holds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check the ledger against the tree
        run: python3 scripts/parity-ledger.py
      - name: The check catches what it is for
        run: python3 scripts/parity-ledger.py --self-test
      - name: The runbook names every check
        run: |
          doc=docs/rust-core.md
          missing=0
          for n in $(seq 1 12); do
            grep -qw "K$n" "$doc" || { echo "::error file=$doc::check K$n is named nowhere in $doc"; missing=1; }
          done
          for f in .github/workflows/*.yml scripts/pin-move.d/*; do
            b=$(basename "$f")
            grep -qF "$b" "$doc" || { echo "::error file=$doc::$f is named nowhere in $doc"; missing=1; }
          done
          exit $missing
