name: Rust core

# xray-rust, the Rust core that is to carry Reality, WebTunnel, Hysteria2 and
# XHTTP in the iPhone's tunnel extension with no Go runtime loaded (OpenSpec
# change ghostlane-rust-core), built from our fork at the pin in
# scripts/rust-core-pins.sh, TLS from our shaped-rustls fork
# (rust-core-checkout.sh refuses a tree that takes it from anywhere else):
#   - XrayRust.xcframework for the iPhone and its simulator, each slice
#     link-checked, the way hev-tunnel.yml builds HevSocks5Tunnel.xcframework;
#     published to a release tag on request so the extension's build fetches
#     it (scripts/fetch-rust-core-ios.sh) without a macOS runner;
#   - the fork's CI: the fork runs none of its own (upstream's ci.yml triggers
#     on upstream's main, tags and pull requests only), so the jobs upstream
#     runs on a pull request that check the core (rust: fmt, clippy, the whole
#     workspace's tests, the fuzz corpora, docs; go-oracles: interop against
#     pinned Xray-core; supply-chain; secrets) run here, read from the pinned
#     commit's own ci.yml by scripts/rust-core-upstream-ci.py, with the steps
#     left out named in scripts/rust-core-upstream-skips.txt;
#   - the Linux CLI, and the plan's interop: the CLI as the client of the
#     lines the app writes, against Xray 26.4.25, 26.7.11 and 26.11.9
#     (scripts/xray-servers.txt) as servers (scripts/rust-core-interop.py).
# The app's core.json reference configs are checked by PR Checks, on the
# branch that writes them.
#
# When: by hand, and on a push to a feat/rust-core* branch that changes what
# this builds or checks (the pin, these scripts, this file). A branch that only
# uses the core fetches the published framework instead: nothing here runs on
# its pushes, and no cache of several hundred MB is saved per branch (a
# branch's caches are visible to that branch alone and to none of its
# siblings, while every one of them crowds main's out of the repository's
# 10 GB). The framework is not cached at all: it is built only when its inputs
# change, and kept as the run's artifact and, once published, as the release.
#
# Publishing (the workflow is not on main, so the Actions page shows no button):
#   gh workflow run rust-core.yml --repo ghostlane-project/ghostlane \
#     --ref <branch> -f publish=true
# The publish job waits for every other job to pass, and refuses a tag that
# already holds the asset: a packaging change at the same commit bumps
# RUST_CORE_IOS_BUILD in rust-core-pins.sh, a new core moves XRAY_RUST_COMMIT.
on:
  push:
    branches:
      - 'feat/rust-core*'
    paths:
      - 'scripts/*rust-core*'
      - 'scripts/xray-servers.txt'
      - 'scripts/fetch-xray-servers.sh'
      - '.github/workflows/rust-core.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Attach XrayRust-ios.zip to the rust-core-ios-<commit12>-b<build> release tag (never replaces one already there)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A newer push supersedes a run of the same branch; a run by hand, which
  # may publish, is never cancelled.
  group: rust-core-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  scripts:
    name: The scripts, offline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: shellcheck, bash -n and the Python scripts
        run: |
          set -euo pipefail
          shellcheck --version | sed -n 2p
          files=(scripts/rust-core-pins.sh scripts/rust-core-checkout.sh scripts/build-rust-core-ios.sh
                 scripts/build-rust-core-cli.sh scripts/fetch-rust-core-ios.sh scripts/test-fetch-rust-core-ios.sh
                 scripts/test-rust-core-checkout.sh)
          shellcheck -x "${files[@]}"
          for f in "${files[@]}"; do bash -n "$f"; done
          python3 -m py_compile scripts/rust-core-upstream-ci.py scripts/rust-core-interop.py

      - name: What fetch-rust-core-ios.sh accepts and refuses
        run: bash scripts/test-fetch-rust-core-ios.sh

      - name: What rust-core-checkout.sh refuses
        run: bash scripts/test-rust-core-checkout.sh

      - name: What the upstream-CI driver runs and refuses
        run: python3 scripts/rust-core-upstream-ci.py selftest

  ios:
    name: XrayRust.xcframework
    runs-on: macos-latest
    # Three targets, each a thin-LTO release of the whole core: about four
    # minutes each on the runner of run 43548278681.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The Xcode the extension is built with (release.yml, pr-checks.yml).
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^26.0'

      - name: Build
        run: bash scripts/build-rust-core-ios.sh dist/rust-core-ios

      - name: Package
        id: package
        run: |
          set -euo pipefail
          (cd dist/rust-core-ios && zip -qry ../XrayRust-ios.zip XrayRust.xcframework rust-core-ios.build.json)
          echo "sha256=$(shasum -a 256 dist/XrayRust-ios.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "bytes=$(wc -c < dist/XrayRust-ios.zip | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Report what was produced
        env:
          ZIP_SHA256: ${{ steps.package.outputs.sha256 }}
          ZIP_BYTES: ${{ steps.package.outputs.bytes }}
        run: |
          set -euo pipefail
          python3 -I - dist/rust-core-ios/rust-core-ios.build.json <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, sys
          r = json.load(open(sys.argv[1]))
          mib = lambda b: "%.1f MiB" % (b / 1048576)
          print("### XrayRust.xcframework, %s" % r["tag"])
          print()
          print("%s at `%s` (rustls from %s), %s, %s, iphoneos SDK %s, minimum iOS %s." % (
              r["repo"], r["commit"], r["rustls_repo"], r["rustc"], r["xcode"], r["iphoneos_sdk"], r["minimum_ios"]))
          print()
          print("Every slice links a C caller of xray_core_new, _load_config_json, _start, _stop and _free for each of its architectures; %s." % (
              "with " + " ".join(r["link_needs"]) if r["link_needs"] else "with the library alone"))
          print()
          print("| | bytes | size | build |")
          print("|---|---:|---:|---:|")
          for name, s in r["slices"].items():
              print("| slice `%s` (%s) | %d | %s | |" % (name, " ".join(s["archs"]), s["bytes"], mib(s["bytes"])))
          for name, t in r["targets"].items():
              print("| target `%s` | %d | %s | %d s |" % (name, t["bytes"], mib(t["bytes"]), t["seconds"]))
          b = int(os.environ["ZIP_BYTES"])
          print("| `XrayRust-ios.zip` | %d | %s | |" % (b, mib(b)))
          print()
          print("`XrayRust-ios.zip` sha256 `%s` (this run's zip; a published one has its own)." % os.environ["ZIP_SHA256"])
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: rust-core-ios
          path: dist/XrayRust-ios.zip
          if-no-files-found: error
          retention-days: 30

  upstream:
    name: Upstream CI at the pin, ${{ matrix.job }}
    runs-on: ubuntu-24.04
    # Upstream gives each of these 45 minutes (secrets 15); this adds the
    # checkout and a toolchain.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        job: [rust, go-oracles, supply-chain, secrets]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: xray-rust at the pin, and the Go its job asks for
        id: fork
        env:
          JOB: ${{ matrix.job }}
        run: |
          set -euo pipefail
          src="$(bash scripts/rust-core-checkout.sh "$RUNNER_TEMP/xray-rust" | tail -n 1)"
          echo "dir=$src" >> "$GITHUB_OUTPUT"
          echo "go=$(python3 scripts/rust-core-upstream-ci.py go-version "$src/.github/workflows/ci.yml" "$JOB")" >> "$GITHUB_OUTPUT"

      - name: Go, as the job's setup-go step names it
        if: steps.fork.outputs.go != ''
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.fork.outputs.go }}
          cache: false

      - name: Upstream's steps
        env:
          JOB: ${{ matrix.job }}
          SRC: ${{ steps.fork.outputs.dir }}
        run: python3 scripts/rust-core-upstream-ci.py run "$SRC/.github/workflows/ci.yml" "$JOB" --workspace "$SRC" --skips scripts/rust-core-upstream-skips.txt

  cli:
    name: xray-rust CLI (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Read from scripts/rust-core-pins.sh in a step, so the cache key below
      # comes from the one file and no copy of the pin can drift.
      - name: Pins
        id: pins
        run: |
          set -euo pipefail
          (
            unset XRAY_RUST_REPO XRAY_RUST_COMMIT XRAY_RUST_TOOLCHAIN SHAPED_RUSTLS_REPO
            . scripts/rust-core-pins.sh
            echo "commit=${XRAY_RUST_COMMIT}"
            echo "toolchain=${XRAY_RUST_TOOLCHAIN}"
          ) >> "$GITHUB_OUTPUT"

      # 25 MB, keyed by the commit and by the scripts that check it out and
      # build it.
      - name: Cache the built CLI
        id: cache
        uses: actions/cache@v6
        with:
          path: dist/rust-core-cli
          key: rust-core-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.commit }}-rust${{ steps.pins.outputs.toolchain }}-${{ hashFiles('scripts/build-rust-core-cli.sh', 'scripts/rust-core-checkout.sh') }}

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/build-rust-core-cli.sh dist/rust-core-cli

      - name: The CLI runs, accepts its own example and refuses an unknown protocol by name
        run: |
          set -euo pipefail
          cat dist/rust-core-cli/xray-rust.build.json
          cli=dist/rust-core-cli/xray-rust
          "$cli" config example socks-direct > "$RUNNER_TEMP/example.json"
          "$cli" config check -config "$RUNNER_TEMP/example.json"
          echo '{"inbounds": [{"protocol": "no-such-protocol", "port": 1080}]}' > "$RUNNER_TEMP/bad.json"
          if out="$("$cli" config check -config "$RUNNER_TEMP/bad.json" 2>&1)"; then
            echo "::error::the CLI accepted a config with an unknown protocol"
            exit 1
          fi
          echo "$out"
          grep -q 'no-such-protocol' <<< "$out" || {
            echo "::error::the CLI refused the bad config without naming no-such-protocol: a crash, not a verdict"
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: rust-core-cli-linux-x86_64
          path: dist/rust-core-cli/
          if-no-files-found: error
          retention-days: 30

  interop:
    name: The app's lines, xray-rust against Xray servers
    needs: cli
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: rust-core-cli-linux-x86_64
          path: dist/rust-core-cli

      - name: Lines through every server release in scripts/xray-servers.txt
        run: |
          set -euo pipefail
          chmod +x dist/rust-core-cli/xray-rust
          servers="$(bash scripts/fetch-xray-servers.sh "$RUNNER_TEMP/xray-servers" | tail -n 1)"
          python3 scripts/rust-core-interop.py --client dist/rust-core-cli/xray-rust --servers "$servers"

  # The release asset outlives the artifact, so the extension's build fetches
  # a known framework months later without a macOS runner. On a Linux runner,
  # with the only write token in this workflow, and only once everything else
  # here passed. The tag and the asset name come from rust-core-pins.sh. A
  # published asset is never replaced: its sha256 is pinned, and a second
  # upload would break every fetch of the first.
  publish:
    needs: [scripts, ios, upstream, cli, interop]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    name: Publish to the rust-core-ios tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: rust-core-ios
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          unset XRAY_RUST_REPO XRAY_RUST_COMMIT XRAY_RUST_TOOLCHAIN SHAPED_RUSTLS_REPO RUST_CORE_IOS_BUILD
          # shellcheck source=scripts/rust-core-pins.sh
          . scripts/rust-core-pins.sh
          tag="${RUST_CORE_IOS_TAG}" asset="${RUST_CORE_IOS_ASSET}"
          test -f "dist/${asset}"
          built="$(unzip -p "dist/${asset}" rust-core-ios.build.json | python3 -I -c 'import json,sys; print(json.load(sys.stdin)["tag"])')"
          if [ "${built}" != "${tag}" ]; then
            echo "::error::the zip was built for ${built}, rust-core-pins.sh names ${tag}"
            exit 1
          fi
          if gh release view "${tag}" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "${asset}"; then
            echo "::error::${tag} already holds ${asset}. A published asset is never replaced: bump RUST_CORE_IOS_BUILD in scripts/rust-core-pins.sh to publish a packaging change at the same commit, or move XRAY_RUST_COMMIT."
            exit 1
          fi
          gh release view "${tag}" >/dev/null 2>&1 || \
            gh release create "${tag}" --prerelease --target "${GITHUB_SHA}" --title "${tag}" \
              --notes "xray-rust ${XRAY_RUST_COMMIT} (${XRAY_RUST_REPO}, MPL-2.0; rustls from ${SHAPED_RUSTLS_REPO}) as XrayRust.xcframework, build ${RUST_CORE_IOS_BUILD}: the xray-ffi static library for iOS and the iOS simulator, with its C header and module map, for the tunnel extension. Built by run ${GITHUB_RUN_ID}; fetched and checked by scripts/fetch-rust-core-ios.sh."
          gh release upload "${tag}" "dist/${asset}"
          sha="$(sha256sum "dist/${asset}" | cut -d' ' -f1)"
          {
            echo "### Published ${asset} to ${tag}"
            echo
            echo "Pin it in scripts/rust-core-pins.sh:"
            echo
            echo '```'
            echo "RUST_CORE_IOS_SHA256=\"${sha}\""
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
