name: Lab - core footprint

# A measurement, not a check: what the client cores cost in memory,
# throughput and CPU, measured on GitHub's runners against servers each job
# starts on the runner itself. lab/footprint/README.md says what is measured,
# how, and how to read the tables and lab-footprint-* artifacts.
#
# The desktop jobs measure the Rust core, xray-rust, as Ghostlane's fork
# (https://github.com/ghostlane-project/xray-rust) builds it at pinned
# commits of named branches (lab/footprint/rust-core-build.sh), with
# upstream's v0.9.0 kept as the historical baseline; the alloc job measures
# phys_footprint on macOS under five allocator setups (lab.py alloc-rows);
# on Linux, after the rows, heaptrack takes the XHTTP upload fix's heap apart
# by allocation site (lab.py heap-profile). The Go cores' rows (sing-box,
# libXray, the cores harness, hev, the olcRTC soaks, udp-flow) and the
# Android emulator job are off while LAB_GO_ROWS is "0": their figures are
# known from earlier runs (README "What a run measures now").
#
# Runs on a push to lab/core-footprint and nothing else: never on main, never
# on a pull request, no schedule. It reads no secret. (PR Checks, whose `push:`
# has no filter, starts on the same push; its scope job decides what it runs.)
on:
  push:
    branches:
      - lab/core-footprint

permissions:
  contents: read

concurrency:
  group: lab-core-footprint
  cancel-in-progress: true

env:
  # Copies of scripts/cores-pins.sh and release.yml; the first step of each
  # job fails when they disagree with the tree.
  GO_VERSION: "1.26.5"
  SINGBOX_VERSION: "1.13.14"
  XRAY_VERSION: "26.7.11"
  ANDROID_NDK_VERSION: "28.2.13676358"
  # "1" brings back the Go rows, their builds and udp-flow (the desktop jobs);
  # the Android job is switched off by its own `if:`.
  LAB_GO_ROWS: "0"
  # xray-rust. Each build is the commit pinned here, fetched by its hash;
  # rust-core-build.sh says so when the branch has moved on since, and
  # refuses a checkout whose rust-toolchain.toml asks for another channel
  # than XRS_TOOLCHAIN. Moving a pin is a change to this file.
  XRS_TOOLCHAIN: "1.96.0"
  XRS_FORK: "https://github.com/ghostlane-project/xray-rust"
  # `ghostlane`: the fork's main branch, upstream's head (merge of upstream
  # PR #294, the 0.10.0 candidate). The main rows.
  XRS_MAIN_REF: "ghostlane"
  XRS_MAIN_COMMIT: "4a61b057e97042396ec1a03fa8a0699919c42d64"
  # `gl/xhttp-upload-memory`: ghostlane plus the XHTTP packet-up upload
  # buffers fix. XHTTP's rows beside the main ones, the allocator rows and
  # the heap profile.
  XRS_UP_REF: "gl/xhttp-upload-memory"
  XRS_UP_COMMIT: "08ed966825c6b0723eae8e92c4f106572c7349c7"
  # `gl/chrome-156-hello`: the fork's Chrome 156 ClientHello profile. The
  # ClientHello parity rows only.
  XRS_HELLO_REF: "gl/chrome-156-hello"
  XRS_HELLO_COMMIT: "00b80ddbd7dc0e945a6fb1416440892413c3aea6"
  # The historical baseline: upstream's v0.9.0 release, which the lab
  # measured before the fork (published 2026-11-03).
  XRS_BASE_REPO: "https://github.com/aimalygin/xray-rust"
  XRS_BASE_REF: "v0.9.0"
  XRS_BASE_COMMIT: "30928ad51b4a434546cf143f8e385a8746523172"

jobs:
  desktop:
    name: Cores on ${{ matrix.platform }}
    # A commit whose message holds "[lab alloc only]" runs the allocator
    # job alone (its follow-ups need no second copy of the desktop rows).
    if: ${{ !contains(github.event.head_commit.message, '[lab alloc only]') }}
    runs-on: ${{ matrix.os }}
    # About 45 minutes when the xray-rust builds are new, about 25 when the
    # cache has them. The ceiling covers the worst case with room for Table
    # and Upload: four xray-rust builds of about 5 min each (five on Linux,
    # with line tables), Measure's 40 and, on Linux, heaptrack's install and
    # the heap profile's 20 (and, with LAB_GO_ROWS=1, the Go builds' 40 and
    # udp-flow's 8).
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            xray_asset: Xray-linux-64.zip
            lab_flags: --tun
          # Apple silicon: the nearest a runner gets to an iPhone's arm64
          # (darwin, not ios: see the README).
          - os: macos-latest
            platform: macos-arm64
            xray_asset: Xray-macos-arm64-v8a.zip
            lab_flags: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        timeout-minutes: 3

      - name: Setup Go
        uses: actions/setup-go@v7
        timeout-minutes: 5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Pins and paths
        timeout-minutes: 2
        run: |
          set -euo pipefail
          want_go="${GO_VERSION}" want_sb="${SINGBOX_VERSION}"
          ( unset GO_VERSION SINGBOX_VERSION; . scripts/cores-pins.sh
            [ "${GO_VERSION}" = "${want_go}" ] && [ "${SINGBOX_VERSION}" = "${want_sb}" ] ) \
            || { echo "::error::scripts/cores-pins.sh moved; update this workflow's env" >&2; exit 1; }
          grep -q "XRAY_VERSION: \"${XRAY_VERSION}\"" .github/workflows/release.yml \
            || { echo "::error::release.yml's XRAY_VERSION moved; update this workflow's env" >&2; exit 1; }
          go version
          {
            echo "BIN=${RUNNER_TEMP}/lab-bin"
            echo "OUT=${RUNNER_TEMP}/lab-out"
            echo "ENGINE=${RUNNER_TEMP}/olcrtc"
            echo "XRS_MAIN=${RUNNER_TEMP}/xray-rust-main"
            echo "XRS_UP=${RUNNER_TEMP}/xray-rust-up"
            echo "XRS_HELLO=${RUNNER_TEMP}/xray-rust-hello"
            echo "XRS_BASE=${RUNNER_TEMP}/xray-rust"
            echo "XRS_L=${RUNNER_TEMP}/xray-rust-lines"
            echo "HT=${RUNNER_TEMP}/lab-heaptrack"
          } >> "$GITHUB_ENV"
          echo "cores: $(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu)"
          uname -a

      - name: Build loadgen (the lab's traffic tool, standard library only)
        timeout-minutes: 5
        working-directory: lab/footprint/loadgen
        run: |
          set -euo pipefail
          mkdir -p "$BIN" "$OUT"
          CGO_ENABLED=0 go build -trimpath -o "$BIN/loadgen" .

      - name: Fetch Xray 26.4.25 (the server) and 26.7.11 (the desktop app's client)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sum() { if command -v sha256sum >/dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi | cut -d' ' -f1; }
          grep -v '^#' lab/footprint/xray-assets.txt | while read -r ver asset want; do
            [ "${asset}" = "${{ matrix.xray_asset }}" ] || continue
            curl -fsSL --retry 3 -o "${RUNNER_TEMP}/xray-${ver}.zip" \
              "https://github.com/XTLS/Xray-core/releases/download/v${ver}/${asset}"
            got="$(sum "${RUNNER_TEMP}/xray-${ver}.zip")"
            [ "${got}" = "${want}" ] || { echo "::error::Xray ${ver} ${asset}: sha256 ${got}, pinned ${want}" >&2; exit 1; }
            mkdir -p "$BIN/xray-${ver}"
            unzip -o -q "${RUNNER_TEMP}/xray-${ver}.zip" -d "$BIN/xray-${ver}"
            chmod +x "$BIN/xray-${ver}/xray"
            "$BIN/xray-${ver}/xray" version | head -n 1
          done
          test -x "$BIN/xray-26.4.25/xray" && test -x "$BIN/xray-26.7.11/xray"

      # The Go rows' builds, only when LAB_GO_ROWS is 1 (see the workflow's env).
      - name: Build sing-box (scripts/build-singbox.sh, the desktop recipe)
        if: env.LAB_GO_ROWS == '1'
        timeout-minutes: 15
        run: bash scripts/build-singbox.sh "$BIN/sing-box" && "$BIN/sing-box" version

      - name: Build the cores harness (scripts/build-cores-ios.sh's module, tags and flags)
        if: env.LAB_GO_ROWS == '1'
        timeout-minutes: 20
        run: bash lab/footprint/harness/build.sh "$BIN"

      - name: Check out and build the olcRTC engine at the pin
        if: env.LAB_GO_ROWS == '1'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash lab/footprint/engine-src.sh "$ENGINE"
          bash lab/footprint/engine-build.sh "$ENGINE" "$BIN"

      # xray-rust, each build in a directory and a cache entry of its own. The
      # cache holds the finished binary and its build record, keyed by the
      # commit, the toolchain and rust-core-build.sh; an entry an older
      # rust-core-build.sh wrote for the same commit and toolchain is reused
      # (restore-keys), so a change to the script alone rebuilds nothing. The
      # build step builds only what the cache did not give; the rows say which
      # run built each binary. A failed or timed-out build fails only its own
      # rows, by name, with the tail of its log.
      #
      # The fork at `ghostlane` (XRS_MAIN_*): the main rows.
      - name: Restore xray-rust ghostlane from the cache
        id: xrs-main-cache
        uses: actions/cache/restore@v6
        timeout-minutes: 5
        with:
          path: ${{ runner.temp }}/xray-rust-main
          key: xray-rust-${{ matrix.platform }}-fork-${{ env.XRS_MAIN_COMMIT }}-rust${{ env.XRS_TOOLCHAIN }}-${{ hashFiles('lab/footprint/rust-core-build.sh') }}
          restore-keys: xray-rust-${{ matrix.platform }}-fork-${{ env.XRS_MAIN_COMMIT }}-rust${{ env.XRS_TOOLCHAIN }}-

      - name: Build xray-rust ghostlane (the main rows)
        id: xrs-main-build
        if: steps.xrs-main-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 30
        env:
          XRS_REPO: ${{ env.XRS_FORK }}
          XRS_REF: ${{ env.XRS_MAIN_REF }}
          XRS_COMMIT: ${{ env.XRS_MAIN_COMMIT }}
        run: |
          set -euo pipefail
          if [ -x "$XRS_MAIN/xray-rust" ]; then cat "$XRS_MAIN/xray-rust.build.json"; exit 0; fi
          XRS_BUILD_LOG="$OUT/xray-rust-main-build.log" bash lab/footprint/rust-core-build.sh "$XRS_MAIN"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Save xray-rust ghostlane to the cache
        if: steps.xrs-main-build.outputs.built == 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        timeout-minutes: 5
        with:
          path: ${{ runner.temp }}/xray-rust-main
          key: ${{ steps.xrs-main-cache.outputs.cache-primary-key }}

      # The fork's XHTTP upload fix (XRS_UP_*): XHTTP's mobile rows beside the
      # main build's and XHTTP's one-worker rows.
      - name: Restore xray-rust gl/xhttp-upload-memory from the cache
        id: xrs-up-cache
        uses: actions/cache/restore@v6
        timeout-minutes: 5
        with:
          path: ${{ runner.temp }}/xray-rust-up
          key: xray-rust-${{ matrix.platform }}-fork-${{ env.XRS_UP_COMMIT }}-rust${{ env.XRS_TOOLCHAIN }}-${{ hashFiles('lab/footprint/rust-core-build.sh') }}
          restore-keys: xray-rust-${{ matrix.platform }}-fork-${{ env.XRS_UP_COMMIT }}-rust${{ env.XRS_TOOLCHAIN }}-

      - name: Build xray-rust gl/xhttp-upload-memory (XHTTP's rows beside the main ones)
        id: xrs-up-build
        if: steps.xrs-up-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 30
        env:
          XRS_REPO: ${{ env.XRS_FORK }}
          XRS_REF: ${{ env.XRS_UP_REF }}
          XRS_COMMIT: ${{ env.XRS_UP_COMMIT }}
        run: |
          set -euo pipefail
          if [ -x "$XRS_UP/xray-rust" ]; then cat "$XRS_UP/xray-rust.build.json"; exit 0; fi
          XRS_BUILD_LOG="$OUT/xray-rust-up-build.log" bash lab/footprint/rust-core-build.sh "$XRS_UP"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Save xray-rust gl/xhttp-upload-memory to the cache
        if: steps.xrs-up-build.outputs.built == 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        timeout-minutes: 5
        with:
          path: ${{ runner.temp }}/xray-rust-up
          key: ${{ steps.xrs-up-cache.outputs.cache-primary-key }}

      # The fork's Chrome 156 profile (XRS_HELLO_*): the ClientHello rows only.
      - name: Restore xray-rust gl/chrome-156-hello from the cache
        id: xrs-hello-cache
        uses: actions/cache/restore@v6
        timeout-minutes: 5
        with:
          path: ${{ runner.temp }}/xray-rust-hello
          key: xray-rust-${{ matrix.platform }}-fork-${{ env.XRS_HELLO_COMMIT }}-rust${{ env.XRS_TOOLCHAIN }}-${{ hashFiles('lab/footprint/rust-core-build.sh') }}
          restore-keys: xray-rust-${{ matrix.platform }}-fork-${{ env.XRS_HELLO_COMMIT }}-rust${{ env.XRS_TOOLCHAIN }}-

      - name: Build xray-rust gl/chrome-156-hello (the ClientHello rows)
        id: xrs-hello-build
        if: steps.xrs-hello-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 30
        env:
          XRS_REPO: ${{ env.XRS_FORK }}
          XRS_REF: ${{ env.XRS_HELLO_REF }}
          XRS_COMMIT: ${{ env.XRS_HELLO_COMMIT }}
        run: |
          set -euo pipefail
          if [ -x "$XRS_HELLO/xray-rust" ]; then cat "$XRS_HELLO/xray-rust.build.json"; exit 0; fi
          XRS_BUILD_LOG="$OUT/xray-rust-hello-build.log" bash lab/footprint/rust-core-build.sh "$XRS_HELLO"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Save xray-rust gl/chrome-156-hello to the cache
        if: steps.xrs-hello-build.outputs.built == 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        timeout-minutes: 5
        with:
          path: ${{ runner.temp }}/xray-rust-hello
          key: ${{ steps.xrs-hello-cache.outputs.cache-primary-key }}

      # The historical baseline, upstream's v0.9.0 (XRS_BASE_*). Its path and
      # key keep the form earlier runs saved it under (a cache entry restores
      # only to the path it was saved from), so their builds are reused.
      - name: Restore xray-rust v0.9.0 from the cache
        id: xrs-base-cache
        uses: actions/cache/restore@v6
        timeout-minutes: 5
        with:
          path: ${{ runner.temp }}/xray-rust
          key: xray-rust-${{ matrix.platform }}-${{ env.XRS_BASE_REF }}-${{ env.XRS_BASE_COMMIT }}-rust${{ env.XRS_TOOLCHAIN }}-${{ hashFiles('lab/footprint/rust-core-build.sh') }}
          restore-keys: xray-rust-${{ matrix.platform }}-${{ env.XRS_BASE_REF }}-${{ env.XRS_BASE_COMMIT }}-rust${{ env.XRS_TOOLCHAIN }}-

      - name: Build xray-rust v0.9.0 (the historical baseline)
        id: xrs-base-build
        if: steps.xrs-base-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 30
        env:
          XRS_REPO: ${{ env.XRS_BASE_REPO }}
          XRS_REF: ${{ env.XRS_BASE_REF }}
          XRS_COMMIT: ${{ env.XRS_BASE_COMMIT }}
        run: |
          set -euo pipefail
          if [ -x "$XRS_BASE/xray-rust" ]; then cat "$XRS_BASE/xray-rust.build.json"; exit 0; fi
          XRS_BUILD_LOG="$OUT/xray-rust-baseline-build.log" bash lab/footprint/rust-core-build.sh "$XRS_BASE"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Save xray-rust v0.9.0 to the cache
        if: steps.xrs-base-build.outputs.built == 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        timeout-minutes: 5
        with:
          path: ${{ runner.temp }}/xray-rust
          key: ${{ steps.xrs-base-cache.outputs.cache-primary-key }}

      # The heap profile (Linux) needs a file and a line for every frame: the
      # XHTTP upload fix's commit, toolchain and profile with line tables kept
      # (rust-core-build.sh XRS_LINE_TABLES=1); the rows never run it. A
      # failed build fails only the heap profile's rows, by name.
      - name: Restore xray-rust gl/xhttp-upload-memory with line tables from the cache
        id: xrs-l-cache
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v6
        timeout-minutes: 5
        with:
          path: ${{ runner.temp }}/xray-rust-lines
          key: xray-rust-lines-${{ matrix.platform }}-fork-${{ env.XRS_UP_COMMIT }}-rust${{ env.XRS_TOOLCHAIN }}-${{ hashFiles('lab/footprint/rust-core-build.sh') }}
          restore-keys: xray-rust-lines-${{ matrix.platform }}-fork-${{ env.XRS_UP_COMMIT }}-rust${{ env.XRS_TOOLCHAIN }}-

      - name: Build xray-rust gl/xhttp-upload-memory with line tables (the heap profile's binary)
        id: xrs-l-build
        if: runner.os == 'Linux' && steps.xrs-l-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 30
        env:
          XRS_REPO: ${{ env.XRS_FORK }}
          XRS_REF: ${{ env.XRS_UP_REF }}
          XRS_COMMIT: ${{ env.XRS_UP_COMMIT }}
          XRS_LINE_TABLES: "1"
        run: |
          set -euo pipefail
          if [ -x "$XRS_L/xray-rust" ]; then cat "$XRS_L/xray-rust.build.json"; exit 0; fi
          XRS_BUILD_LOG="$OUT/xray-rust-lines-build.log" bash lab/footprint/rust-core-build.sh "$XRS_L"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Save xray-rust with line tables to the cache
        if: runner.os == 'Linux' && steps.xrs-l-build.outputs.built == 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        timeout-minutes: 5
        with:
          path: ${{ runner.temp }}/xray-rust-lines
          key: ${{ steps.xrs-l-cache.outputs.cache-primary-key }}

      # The hev rows need root and a tun, so they run where --tun runs; the
      # Mac builds it too, with Apple's clang, for udp-flow. Go rows only. A
      # failed build fails only those rows, with the tail of hev-build.log.
      - name: Build hev-socks5-tunnel at scripts/hev-pins.sh's commit (the iPhone's pin, make clean exec)
        if: env.LAB_GO_ROWS == '1' && (contains(matrix.lab_flags, '--tun') || runner.os == 'macOS')
        continue-on-error: true
        timeout-minutes: 6
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          bash lab/footprint/hev-build.sh "$BIN" 2>&1 | tee "$OUT/hev-build.log"

      # The rows: xray-rust (the fork's main rows, its XHTTP fix's, the
      # relay buffer and one-worker rows, the v0.9.0 baseline), then the
      # ClientHellos. The Go rows only with LAB_GO_ROWS=1.
      - name: Measure
        timeout-minutes: 45
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.lab_flags }}" ]; then sudo -n true; fi
          go_args=(--no-go-rows)
          if [ "${LAB_GO_ROWS}" = "1" ]; then go_args=(--engine-src "$ENGINE"); fi
          python3 lab/footprint/lab.py desktop --bin "$BIN" --out "$OUT" --platform "${{ matrix.platform }}" \
            --xray-rust "$XRS_MAIN" --xray-rust-up "$XRS_UP" --xray-rust-hello "$XRS_HELLO" \
            --xray-rust-baseline "$XRS_BASE" --budget-min 34 "${go_args[@]}" ${{ matrix.lab_flags }}

      # Where a new UDP flow's time goes behind hev (lab.py udp-flow, root):
      # the ios-shape hev row taken apart one change at a time. Go rows only
      # (its figures are known from run 43538233589). A failure fails only it.
      - name: UDP flow latency (hev against the gVisor tun)
        if: ${{ !cancelled() && env.LAB_GO_ROWS == '1' && (contains(matrix.lab_flags, '--tun') || runner.os == 'macOS') }}
        continue-on-error: true
        timeout-minutes: 8
        run: |
          set -euo pipefail
          sudo -n true
          python3 lab/footprint/lab.py udp-flow --bin "$BIN" --out "$OUT/udp-flow"

      # heaptrack from Ubuntu's archive, after the rows so Measure's runner is
      # the same as before. A failure fails only the heap profile.
      - name: Install heaptrack (the heap profile, Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        continue-on-error: true
        timeout-minutes: 6
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends heaptrack \
            || { sudo apt-get update -q && sudo apt-get install -y --no-install-recommends heaptrack; }
          dpkg-query -W heaptrack | tee "$OUT/heaptrack.version.txt"

      # Where the XHTTP upload fix's memory goes (lab.py heap-profile, Linux):
      # heaptrack's heap by allocation site beside RSS by kind, the mobile
      # profile on XHTTP, the burst and 32 connections held idle for 20 s.
      # After every row, with servers of its own, so no row moves; its tables
      # are in this step's log and the summary, its JSON in
      # heap-profile/heap-profile.json of this job's artifact, heaptrack's
      # files in lab-heaptrack-linux-x86_64. (The macOS heap profile ran in
      # run 43553887055; the allocator rows below take its place.) A failure
      # fails only it.
      - name: Heap profile (XHTTP with the upload fix, heaptrack)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        continue-on-error: true
        timeout-minutes: 25
        run: |
          set -euo pipefail
          python3 lab/footprint/lab.py heap-profile --bin "$BIN" --out "$OUT/heap-profile" \
            --platform "${{ matrix.platform }}" --xray-rust-lines "$XRS_L" --heaptrack-out "$HT" \
            --lines xhttp --budget-min 18

      - name: Table
        if: always()
        timeout-minutes: 2
        run: |
          for f in "$BIN/harness.versions.txt" "$BIN/hev.versions.txt" "$BIN/hev-nomore.versions.txt" \
                   "$BIN/hev-nomore.identical.txt" "$BIN/msg_more.txt"; do
            [ -f "$f" ] && cp "$f" "$OUT/"
          done
          for v in main:"$XRS_MAIN" up:"$XRS_UP" hello:"$XRS_HELLO" baseline:"$XRS_BASE" lines:"$XRS_L"; do
            [ -f "${v#*:}/xray-rust.build.json" ] && cp "${v#*:}/xray-rust.build.json" "$OUT/xray-rust-${v%%:*}.build.json"
          done
          python3 lab/footprint/lab.py table "$OUT"

      - name: Upload results
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: lab-footprint-${{ matrix.platform }}
          path: ${{ env.OUT }}
          retention-days: 14
          if-no-files-found: warn

      # heaptrack's data files and heaptrack_print's text, apart from the
      # results (the summary job downloads lab-footprint-* only). Open a data
      # file with heaptrack_gui or heaptrack_print beside the binary with line
      # tables: same commit, toolchain and rust-core-build.sh.
      - name: Upload heaptrack's files
        if: always() && runner.os == 'Linux'
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: lab-heaptrack-${{ matrix.platform }}
          path: ${{ env.HT }}
          retention-days: 7
          if-no-files-found: warn

  # Which allocator setup keeps the iOS extension's phys_footprint down
  # (lab.py alloc-rows, macOS): the fork's XHTTP upload fix with the lab's
  # allocator patch (lab/footprint/xray-rust-patches/lab-allocator-switch.patch,
  # applied by rust-core-build.sh), one binary, the setups LAB_ALLOC_SETUPS
  # names chosen by environment variables, four lines, each run twice, with
  # LAB_ALLOC_TAIL_S of idle after the last burst. A job of its own so it runs
  # beside the desktop rows on another Mac.
  alloc:
    name: Allocator rows on macos-arm64
    runs-on: macos-latest
    # The build's 8 minutes (none from the cache), the rows' 48, and room.
    timeout-minutes: 75
    env:
      # Run 43560510824 ran all five setups with 5 s after each burst. b and c
      # (malloc_zone_pressure_relief) released nothing: on macOS 26 the
      # default zone is xzone malloc, whose pressure_relief is libmalloc's
      # malloc_zone_pressure_relief_fallback (returns 0). So the follow-up
      # runs a, d and e, each with 60 s of idle after the last burst, long
      # enough for the kernel's deferred reclaim (10 s sampling on macOS).
      LAB_ALLOC_SETUPS: "a,d,e"
      LAB_ALLOC_TAIL_S: "60"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        timeout-minutes: 3

      - name: Setup Go
        uses: actions/setup-go@v7
        timeout-minutes: 5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Paths
        timeout-minutes: 1
        run: |
          set -euo pipefail
          {
            echo "BIN=${RUNNER_TEMP}/lab-bin"
            echo "OUT=${RUNNER_TEMP}/lab-out"
            echo "XRS_ALLOC=${RUNNER_TEMP}/xray-rust-alloc"
          } >> "$GITHUB_ENV"
          echo "cores: $(sysctl -n hw.ncpu)"
          uname -a
          sw_vers

      - name: Build loadgen
        timeout-minutes: 5
        working-directory: lab/footprint/loadgen
        run: |
          set -euo pipefail
          mkdir -p "$BIN" "$OUT"
          CGO_ENABLED=0 go build -trimpath -o "$BIN/loadgen" .

      - name: Fetch Xray 26.4.25 (the server)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          want="$(awk '$1=="26.4.25" && $2=="Xray-macos-arm64-v8a.zip" {print $3}' lab/footprint/xray-assets.txt)"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/xray-server.zip" \
            "https://github.com/XTLS/Xray-core/releases/download/v26.4.25/Xray-macos-arm64-v8a.zip"
          got="$(shasum -a 256 "${RUNNER_TEMP}/xray-server.zip" | cut -d' ' -f1)"
          [ "${got}" = "${want}" ] || { echo "::error::Xray 26.4.25: sha256 ${got}, pinned ${want}" >&2; exit 1; }
          mkdir -p "$BIN/xray-26.4.25"
          unzip -o -q "${RUNNER_TEMP}/xray-server.zip" -d "$BIN/xray-26.4.25"
          chmod +x "$BIN/xray-26.4.25/xray"
          "$BIN/xray-26.4.25/xray" version | head -n 1

      - name: Restore the allocator build from the cache
        id: xrs-a-cache
        uses: actions/cache/restore@v6
        timeout-minutes: 5
        with:
          path: ${{ runner.temp }}/xray-rust-alloc
          key: xray-rust-alloc-macos-arm64-fork-${{ env.XRS_UP_COMMIT }}-rust${{ env.XRS_TOOLCHAIN }}-${{ hashFiles('lab/footprint/xray-rust-patches/lab-allocator-switch.patch') }}-${{ hashFiles('lab/footprint/rust-core-build.sh') }}
          restore-keys: xray-rust-alloc-macos-arm64-fork-${{ env.XRS_UP_COMMIT }}-rust${{ env.XRS_TOOLCHAIN }}-${{ hashFiles('lab/footprint/xray-rust-patches/lab-allocator-switch.patch') }}-

      - name: Build xray-rust gl/xhttp-upload-memory with the lab's allocator patch
        id: xrs-a-build
        if: steps.xrs-a-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 30
        env:
          XRS_REPO: ${{ env.XRS_FORK }}
          XRS_REF: ${{ env.XRS_UP_REF }}
          XRS_COMMIT: ${{ env.XRS_UP_COMMIT }}
          XRS_PATCHES: lab/footprint/xray-rust-patches/lab-allocator-switch.patch
        run: |
          set -euo pipefail
          if [ -x "$XRS_ALLOC/xray-rust" ]; then cat "$XRS_ALLOC/xray-rust.build.json"; exit 0; fi
          XRS_BUILD_LOG="$OUT/xray-rust-alloc-build.log" bash lab/footprint/rust-core-build.sh "$XRS_ALLOC"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Save the allocator build to the cache
        if: steps.xrs-a-build.outputs.built == 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        timeout-minutes: 5
        with:
          path: ${{ runner.temp }}/xray-rust-alloc
          key: ${{ steps.xrs-a-cache.outputs.cache-primary-key }}

      - name: Allocator rows
        timeout-minutes: 60
        run: |
          set -euo pipefail
          python3 lab/footprint/lab.py alloc-rows --bin "$BIN" --out "$OUT/alloc-rows" --platform macos-arm64 \
            --xray-rust "$XRS_ALLOC" --setups "$LAB_ALLOC_SETUPS" --tail-s "$LAB_ALLOC_TAIL_S" --budget-min 50

      - name: Keep the build record
        if: always()
        timeout-minutes: 1
        run: |
          [ -f "$XRS_ALLOC/xray-rust.build.json" ] && cp "$XRS_ALLOC/xray-rust.build.json" "$OUT/xray-rust-alloc.build.json"
          ls -la "$OUT"

      - name: Upload results
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: lab-alloc-macos-arm64
          path: ${{ env.OUT }}
          retention-days: 14
          if-no-files-found: warn

  # Off while the lab measures xray-rust (its rows are the Go cores'; set
  # `if:` back to true with LAB_GO_ROWS "1"). A job's `if:` cannot read env.
  android:
    name: Android emulator (x86_64, API 30)
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        timeout-minutes: 3

      - name: Pins and paths
        timeout-minutes: 1
        run: |
          set -euo pipefail
          for pin in "XRAY_VERSION: \"${XRAY_VERSION}\"" "ANDROID_NDK_VERSION: \"${ANDROID_NDK_VERSION}\"" \
                     "SINGBOX_VERSION: \"${SINGBOX_VERSION}\""; do
            grep -q "${pin}" .github/workflows/release.yml \
              || { echo "::error::release.yml no longer says ${pin}; update this workflow's env" >&2; exit 1; }
          done
          {
            echo "BIN=${RUNNER_TEMP}/lab-bin"
            echo "DEVBIN=${RUNNER_TEMP}/lab-device-bin"
            echo "OUT=${RUNNER_TEMP}/lab-out"
            echo "ENGINE=${RUNNER_TEMP}/olcrtc"
            echo "APK=${RUNNER_TEMP}/ghostlane-debug-x86_64.apk"
          } >> "$GITHUB_ENV"

      - name: Enable KVM
        timeout-minutes: 2
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup JDK
        uses: actions/setup-java@v6
        timeout-minutes: 5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Go
        uses: actions/setup-go@v7
        timeout-minutes: 5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        timeout-minutes: 5
        with:
          packages: platform-tools

      - name: Install Android SDK packages (release.yml's list)
        timeout-minutes: 10
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        timeout-minutes: 5

      - name: Check out the olcRTC engine at the pin (OLCRTC_REPO)
        timeout-minutes: 5
        run: bash lab/footprint/engine-src.sh "$ENGINE"

      - name: Install and initialize gomobile (as release.yml)
        timeout-minutes: 8
        run: |
          set -euo pipefail
          cd "$ENGINE"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          "$(go env GOPATH)/bin/gomobile" init

      # release.yml build-android's two core steps, x86_64 only.
      - name: Build sing-box for Android x86_64 (release.yml recipe)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/scripts/patched-singbox.sh" "${RUNNER_TEMP}/sing-box"
          cd "${RUNNER_TEMP}/sing-box"
          TAGS="$(cat release/DEFAULT_BUILD_TAGS_OTHERS)"
          LDFLAGS_SHARED="$(cat release/LDFLAGS)"
          NDK_BIN="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          OUT_LIBS="${GITHUB_WORKSPACE}/androidApp/jniLibs/x86_64"
          mkdir -p "${OUT_LIBS}"
          CGO_ENABLED=1 GOOS=android GOARCH=amd64 GOARM=7 \
          CC="${NDK_BIN}/x86_64-linux-android23-clang" CXX="${NDK_BIN}/x86_64-linux-android23-clang++" \
          go build -trimpath -o "${OUT_LIBS}/libsingboxcore.so" -tags "${TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${SINGBOX_VERSION}' ${LDFLAGS_SHARED} -s -w -buildid= -extldflags=-Wl,-z,max-page-size=16384" \
            ./cmd/sing-box

      - name: Build Xray for Android x86_64 (release.yml recipe)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "v${XRAY_VERSION}" https://github.com/XTLS/Xray-core.git "${RUNNER_TEMP}/xray"
          cd "${RUNNER_TEMP}/xray"
          NDK_BIN="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          OUT_LIBS="${GITHUB_WORKSPACE}/androidApp/jniLibs/x86_64"
          mkdir -p "${OUT_LIBS}"
          CGO_ENABLED=1 GOOS=android GOARCH=amd64 GOARM=7 \
          CC="${NDK_BIN}/x86_64-linux-android23-clang" CXX="${NDK_BIN}/x86_64-linux-android23-clang++" \
          go build -trimpath -buildvcs=false -o "${OUT_LIBS}/libxraycore.so" \
            -ldflags "-X github.com/xtls/xray-core/core.build=v${XRAY_VERSION} -s -w -buildid= -checklinkname=0 -extldflags=-Wl,-z,max-page-size=16384" \
            ./main

      - name: Build loadgen (static linux/amd64, runs on the runner and under adb shell)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p "$BIN" "$DEVBIN" "$OUT"
          (cd lab/footprint/loadgen && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o "$BIN/loadgen" .)
          cp "$BIN/loadgen" "$DEVBIN/loadgen"
          cp androidApp/jniLibs/x86_64/libsingboxcore.so androidApp/jniLibs/x86_64/libxraycore.so "$DEVBIN/"
          ls -l "$BIN" "$DEVBIN"

      - name: Fetch Xray 26.4.25 (the server)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          want="$(awk '$1=="26.4.25" && $2=="Xray-linux-64.zip" {print $3}' lab/footprint/xray-assets.txt)"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/xray-server.zip" \
            "https://github.com/XTLS/Xray-core/releases/download/v26.4.25/Xray-linux-64.zip"
          got="$(sha256sum "${RUNNER_TEMP}/xray-server.zip" | cut -d' ' -f1)"
          [ "${got}" = "${want}" ] || { echo "::error::Xray 26.4.25: sha256 ${got}, pinned ${want}" >&2; exit 1; }
          mkdir -p "$BIN/xray-26.4.25"
          unzip -o -q "${RUNNER_TEMP}/xray-server.zip" -d "$BIN/xray-26.4.25"
          chmod +x "$BIN/xray-26.4.25/xray"

      - name: Build the debug APK, x86_64 only
        timeout-minutes: 35
        run: |
          set -euo pipefail
          export OLCRTC_REPO="$ENGINE"
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          ./gradlew -Polcbox.android.abiFilters=x86_64 :androidApp:assembleGithubDebug --stacktrace
          apk="$(find androidApp/build/outputs/apk/github/debug -maxdepth 1 -name '*.apk' | sort | head -n 1)"
          [ -n "${apk}" ] || { echo "::error::no debug APK" >&2; exit 1; }
          cp "${apk}" "$APK"
          unzip -l "$APK" | grep 'lib/x86_64/' || true
          # The emulator wants the memory more than an idle daemon does.
          ./gradlew --stop

      # The action runs each line of `script` in its own `sh -c`: one line.
      - name: Measure on the emulator
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          cores: 3
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: python3 lab/footprint/lab.py android --bin "$BIN" --device-bin "$DEVBIN" --apk "$APK" --out "$OUT" --budget-min 24

      - name: Table
        if: always()
        timeout-minutes: 2
        run: python3 lab/footprint/lab.py table "$OUT"

      - name: Upload results
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: lab-footprint-android
          path: ${{ env.OUT }}
          retention-days: 14
          if-no-files-found: warn

  shapes:
    name: The lab's client shapes against the app's config builders
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        timeout-minutes: 3

      - name: Setup JDK
        uses: actions/setup-java@v6
        timeout-minutes: 5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        timeout-minutes: 5

      - name: Dump the configs the app writes
        timeout-minutes: 25
        run: ./gradlew :sharedUI:jvmTest --tests org.olcbox.app.net.XrayConfigDumpTest --tests org.olcbox.app.net.SingBoxConfigDumpTest --stacktrace

      - name: Compare with lab/footprint/shapes and the reference configs
        timeout-minutes: 2
        run: python3 lab/footprint/lab.py shapes-check

  summary:
    name: All results
    needs: [desktop, android, shapes]
    if: ${{ always() && !contains(github.event.head_commit.message, '[lab alloc only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        timeout-minutes: 3

      - name: Download results
        uses: actions/download-artifact@v8
        timeout-minutes: 5
        with:
          pattern: lab-footprint-*
          path: all

      - name: One table
        timeout-minutes: 2
        run: python3 lab/footprint/lab.py table all --json-out all/results-all.json

      - name: Upload the merged results
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: lab-footprint-all
          path: all/results-all.json
          retention-days: 14
          if-no-files-found: warn
