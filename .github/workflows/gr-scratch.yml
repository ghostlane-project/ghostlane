name: GR scratch
on:
  workflow_dispatch:
  push:
    branches: [rust/t/GR-gate-report]
    paths: [.github/workflows/gr-scratch.yml]
permissions:
  contents: read
  actions: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: olcbox
      - name: Resolve the pin
        id: pin
        working-directory: olcbox
        run: scripts/olcrtc-pin.sh >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ghostlane-project/olcrtc
          ref: ${{ steps.pin.outputs.olcrtc_sha }}
          path: olcrtc
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.pin.outputs.go_version }}
          cache-dependency-path: olcrtc/go.sum
      - name: Fetch the inputs
        run: |
          set -euo pipefail
          mkdir -p w/fakes
          gh release download v1.0.469 -R "$GITHUB_REPOSITORY" -p gate-report.json -D w/base
          gh run download 46164260173 -R "$GITHUB_REPOSITORY" -n gate-fakes -D w/fakes
          find w -type f
      - name: Build the mixed report and run the tool
        run: |
          set -uo pipefail
          cd w
          cp base/gate-report.json mixed.json
          python3 ../olcbox/scripts/gate-merge-reports.py rust --report mixed.json --rust-dir fakes
          python3 - <<'PY'
          import json
          r=json.load(open("mixed.json"))
          for c in r["cells"]:
              if c["client"]=="rust" and c["scenario"]=="S2":
                  c["status"]="fail"; c["failures"]=["scratch mutation"]; break
          json.dump(r,open("mutated.json","w"))
          print("json cells", len(json.load(open("mixed.json"))["cells"]))
          PY
          G=../olcbox/scripts/gate-run.sh
          export GATE_ENGINE_DIR="$GITHUB_WORKSPACE/olcrtc"
          echo "== render base"; $G render base/gate-report.json > base.md; echo rc=$?; grep -c '^| `' base.md
          echo "== render mixed"; $G render mixed.json > mixed.md; echo rc=$?; cat mixed.md
          echo "rows in md: $(grep -c '^| `' mixed.md)"
          echo "== compare base mixed (warn)"; $G compare warn base/gate-report.json mixed.json; echo rc=$?
          echo "== compare base mixed (fail)"; $G compare fail base/gate-report.json mixed.json > /dev/null; echo rc=$?
          echo "== compare mixed mixed (fail)"; $G compare fail mixed.json mixed.json; echo rc=$?
          echo "== compare mixed mutated (fail)"; $G compare fail mixed.json mutated.json; echo rc=$?
          echo "== compare mixed base (fail; rust cells vanish)"; $G compare fail mixed.json base/gate-report.json | tail -5; echo rc=$?
          echo "== leak check"; python3 ../olcbox/scripts/gate-scrub.py --check-only . ; echo rc=$?
