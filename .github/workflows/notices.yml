name: Notices

# K10. THIRD_PARTY_NOTICES.md holds a block generated by scripts/notices.py from
# the app's Cargo.lock files and from the Rust core's Cargo.lock at the pin in
# scripts/ghostlane-core-pin.sh (fetched from the fork at that commit). The job
# fails when the block differs from what the locks give, or when a crate in a
# lock has no licence in scripts/notices-licences.json. After a pin move,
# scripts/pin-move.sh runs scripts/pin-move.d/notices, which rewrites the block.
# workflow_dispatch takes pin=<sha> to read another commit of the core.
on:
  workflow_dispatch:
    inputs:
      pin:
        description: Commit of the core to read instead of the pin (empty = the pin)
        type: string
        default: ''
  pull_request:
    branches: [rust/all, main]
    paths:
      - THIRD_PARTY_NOTICES.md
      - scripts/notices.py
      - scripts/notices-licences.json
      - scripts/ghostlane-core-pin.sh
      - scripts/pin-move.d/notices
      - '**/Cargo.lock'
      - .github/workflows/notices.yml
  push:
    branches: ['**']
    paths:
      - THIRD_PARTY_NOTICES.md
      - scripts/notices.py
      - scripts/notices-licences.json
      - scripts/ghostlane-core-pin.sh
      - scripts/pin-move.d/notices
      - '**/Cargo.lock'
      - .github/workflows/notices.yml

permissions:
  contents: read

concurrency:
  group: notices-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  notices:
    name: Notices match the locks (K10)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The block against the locks
        env:
          PIN: ${{ github.event_name == 'workflow_dispatch' && inputs.pin || '' }}
        run: |
          if [ -n "$PIN" ]; then
            python3 -I scripts/notices.py check --pin "$PIN"
          else
            python3 -I scripts/notices.py check
          fi
      - name: The hand-written names (hev, Wintun, MSYS2, the Rust core)
        run: |
          for word in hev-socks5-tunnel Wintun MSYS2 xray-rust; do
            grep -q "$word" THIRD_PARTY_NOTICES.md || { echo "THIRD_PARTY_NOTICES.md does not name $word" >&2; exit 1; }
          done
