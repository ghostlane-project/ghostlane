name: iOS Frameworks

# The Go cores the NetworkExtension needs, in one framework.
#
# They cannot be separate frameworks: each gomobile bind carries its own copy of
# the cgo bootstrap and the gomobile seq layer, so linking two of them into one
# extension fails with dozens of duplicate symbols. See build-cores-ios.sh.
#
# It changes only when the pinned versions change, and macOS runners bill at
# 10x — so this never runs on push. Build once per version, publish, and let
# every other build download the result instead of paying for it again.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Attach the result to the ios-cores release tag
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ios-frameworks
  cancel-in-progress: false

env:
  # Exact, and checked against cores-pins.sh below like the other three. This
  # used to be `stable`; see cores-pins.sh for the build that taught otherwise.
  GO_VERSION: 1.26.5
  # 1.13 is not a preference, it is the only line that fits. libXray pulls
  # apernet/quic-go, which needs quic-go/qpack v0.6.0; sing-box only reaches
  # qpack v0.6.0 in 1.13 (1.11 wants v0.4.0, 1.12 v0.5.1, and v0.6.0 renamed
  # the decoder API). Pairing either of those with libXray fails to compile.
  SINGBOX_VERSION: 1.13.14
  # Pinned, not `latest`: this is what the combined module was verified to
  # resolve and compile against, alongside sing-box 1.13.14.
  LIBXRAY_VERSION: v1.260711.0
  # A published revision, not the OLCRTC_REPO working copy the app's own
  # OlcRtcMobile is built from — this runner has no such checkout.
  OLCRTC_VERSION: v0.0.0-20260922141646-083cbfb0ae39

jobs:
  build:
    name: gomobile bind (sing-box + Xray + olcRTC)
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      # The pins above have to be a copy — a job-level cache key cannot be
      # computed from a sourced shell file — so the copy is checked instead of
      # trusted. A tag that names versions the scripts do not use is how a
      # framework once got linked that no pin in the tree described.
      - name: Pins match scripts/cores-pins.sh
        run: |
          set -euo pipefail
          expected="$(env -u GO_VERSION -u SINGBOX_VERSION -u LIBXRAY_VERSION -u OLCRTC_VERSION \
            bash -c '. scripts/cores-pins.sh; echo "$GO_VERSION $SINGBOX_VERSION $LIBXRAY_VERSION $OLCRTC_VERSION"')"
          actual="${GO_VERSION} ${SINGBOX_VERSION} ${LIBXRAY_VERSION} ${OLCRTC_VERSION}"
          [ "$expected" = "$actual" ] || {
            echo "workflow env and scripts/cores-pins.sh disagree:"
            echo "  cores-pins.sh: $expected"
            echo "  workflow env : $actual"
            exit 1
          }

      - uses: actions/setup-go@v7
        with:
          # Not `stable`: that moved from 1.26.5 to 1.27.1 between two runs and
          # the second one shipped a framework Xcode could not link. The pin
          # lives in cores-pins.sh; this is the checked copy of it.
          go-version: ${{ env.GO_VERSION }}

      - name: Cache built framework
        id: cache
        uses: actions/cache@v6
        with:
          path: dist/frameworks
          # cores-pins.sh is in the hash because the tag now carries a build
          # revision for shape changes — a macOS slice arriving under unchanged
          # versions — and a key made only of versions would restore the framework
          # from before it.
          key: ios-cores-sb${{ env.SINGBOX_VERSION }}-lx${{ env.LIBXRAY_VERSION }}-rtc${{ env.OLCRTC_VERSION }}-${{ hashFiles('scripts/build-cores-ios.sh', 'scripts/cores-pins.sh', 'scripts/patches/xray-core-h2-window.patch') }}

      - name: Build Cores
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/build-cores-ios.sh "$PWD/dist/frameworks"

      - name: Report what was produced
        run: |
          echo "### Cores (iOS + macOS)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh dist/frameworks/* 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "nothing built" >> "$GITHUB_STEP_SUMMARY"
          # Which slices came out, not just which headers: the macOS one arriving
          # is the thing worth seeing at a glance.
          ls -1 dist/frameworks/Cores.xcframework >> "$GITHUB_STEP_SUMMARY" || true
          ls -1 dist/frameworks/Cores.xcframework/ios-arm64/Cores.framework/Headers >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Package
        run: |
          cd dist/frameworks
          zip -qry ../Cores-ios.zip Cores.xcframework
          ls -la ../

      - uses: actions/upload-artifact@v7
        with:
          name: ios-cores
          path: dist/*.zip
          if-no-files-found: error

      # A release asset outlives the 90-day artifact retention, so the extension
      # build can fetch a known framework months later without a macOS runner.
      - name: Publish to the ios-cores tag
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Sourced rather than re-derived. This formula used to live here as
          # well as in cores-pins.sh, and two copies of a tag is the exact shape
          # of the bug that file was written to end: fetch-cores-ios.sh looks for
          # what cores-pins.sh computes, so anything published under a tag spelled
          # here instead is published where nothing will look for it.
          # shellcheck source=scripts/cores-pins.sh
          . scripts/cores-pins.sh
          tag="${CORES_TAG}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --prerelease --notes "sing-box ${SINGBOX_VERSION} + libXray ${LIBXRAY_VERSION} + olcrtc ${OLCRTC_VERSION} bound into one framework, iOS and macOS slices, for the NetworkExtension on both."
          gh release upload "$tag" dist/*.zip --clobber
