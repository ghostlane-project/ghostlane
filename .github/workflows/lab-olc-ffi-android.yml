name: Lab - olcRTC FFI on Android

# A measurement, not a check: the Android twin of the M9 groundwork of the
# olcRTC client port to Rust (lab-olc-ffi.yml is the iOS one). On this Linux
# runner:
#   - the Rust core is ghostlane-core at the xray-rust commit pinned below
#     (olc-ffi and xray-ffi in one library, one Tokio runtime, one
#     allocator), as libghostlane_core.so for aarch64-linux-android (the
#     shipped ABI) and x86_64-linux-android (the emulator), with the release
#     profile as it is, linked by the NDK the app pins at its minSdk, every
#     LOAD segment checked to be 16 KiB-aligned
#     (lab/olc-ffi/android/build-core-android.sh);
#   - its UniFFI Kotlin bindings (JNA) are generated from the same build into
#     a small lab Gradle build (lab/olc-ffi/android, not one of the app's
#     modules);
#   - the T1 side is the engine at its pin with xray-rust's overlay, the
#     overlay's TestT1Host (hub, origin, UDP echo, server), in the
#     background; the emulator reaches it as 10.0.2.2;
#   - the instrumented tests (lab/olc-ffi/android/src/androidTest) drive
#     OlcrtcRuntime as OlcboxVpnService drives the Go engine today (setRoom
#     only, the protector, the log writer, a fetch through the SOCKS port
#     with the login, UDP ASSOCIATE, ten stop/starts, Go's error texts,
#     memoryStats) on an x86_64 emulator, and measure PSS and
#     Private_Dirty after a burst of 256 downloads, after trim() and after
#     mallopt's purges, twice with the core in the app's process and twice
#     with it in a process of its own (xray-rust's olc-ffi-client in its
#     control mode, packaged as lib/x86_64/libolcffidriver.so);
#   - ghostlane-runtime's unit tests run natively on the emulator first
#     (relief's: the allocator's Android branch), and clippy runs for the
#     Android target (the host's never sees that branch);
#   - the relief tests and CallSequenceTest run once more on the 16 KiB-page
#     emulator image.
# Every RESULT/MEM line lands in the job summary; the logs in the artifact.
#
# Emulator only: no device, no store track, no live carrier room, no secret.
# Runs on a push to lab/olc-ffi-android or by hand, never on main, never on a
# pull request, no schedule.
on:
  push:
    branches:
      - lab/olc-ffi-android
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-olc-ffi-android
  cancel-in-progress: true

env:
  # ghostlane-project/xray-rust gl/olc-ffi, fetched by its hash. Moving the
  # pin is a change to this file (and so a run).
  XRS_REPO: "https://github.com/ghostlane-project/xray-rust"
  XRS_REF: "gl/olc-ffi"
  XRS_COMMIT: "638a0cb9e83deba9edb6c8f6d093377804f2b12d"
  GO_VERSION: "1.26.5"
  RUST_TOOLCHAIN: "1.96.0"
  # androidApp/build.gradle.kts ndkVersion (and the release workflow's).
  ANDROID_NDK_VERSION: "28.2.13676358"
  EMULATOR_API: "35"
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  android:
    name: Instrumented tests on the x86_64 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v7

      - name: Room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Fetch xray-rust
        run: |
          set -euo pipefail
          git init -q xrs
          git -C xrs remote add origin "$XRS_REPO"
          git -C xrs fetch -q --depth 1 origin "$XRS_COMMIT" || git -C xrs fetch -q origin "$XRS_REF"
          git -C xrs checkout -q "$XRS_COMMIT"
          git -C xrs log -1 --format='xray-rust %H %s' | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # As the app's workflows: the legacy tools package is gone from
          # Google's repository; the next step installs what the build needs.
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}" > /dev/null

      - name: Toolchains
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --target aarch64-linux-android --target x86_64-linux-android
          rustup default "$RUST_TOOLCHAIN"
          cargo --version; go version; java -version 2>&1 | head -1
          ls "$ANDROID_HOME/ndk"

      - name: Restore the cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            xrs/target
          key: olc-ffi-android-${{ env.XRS_COMMIT }}
          restore-keys: olc-ffi-android-

      - name: The T1 host (hub, origin, UDP echo, the pinned server)
        run: |
          set -euo pipefail
          mkdir -p out
          echo "T1_CONFIG=$RUNNER_TEMP/olc-t1.json" >> "$GITHUB_ENV"
          ( . xrs/olc/interop/lib.sh && olc_prepare "$OLC_WORK/engine" && echo "$OLC_WORK/engine" > "$RUNNER_TEMP/engine-dir" )
          engine=$(cat "$RUNNER_TEMP/engine-dir")
          cd "$engine"
          # The big pull is 1 MiB: the burst is 256 of them.
          OLC_T1_HOST_OUT="$RUNNER_TEMP/olc-t1.json" OLC_T1_HOST_FOR=150m GOFLAGS=-mod=readonly \
            nohup go test -count=1 -timeout 165m -tags olcrtc_interop ./internal/gate -run '^TestT1Host$' -v \
              -olcrtc.gate-target=interop -olcrtc.gate-big-mb=1 > "$GITHUB_WORKSPACE/out/t1-host.log" 2>&1 &
          echo "T1 host starting (pid $!); it builds the server first"

      - name: The Rust core and its Kotlin bindings
        run: |
          set -uo pipefail
          bash lab/olc-ffi/android/build-core-android.sh xrs lab/olc-ffi/android > out/build-core.log 2>&1
          rc=$?
          grep -E '^(BUILD|ALIGN|SIZE|SECTION|NEEDED|DRIVER|TESTS|CLIPPY|BINDINGS|SIGNATURE)|^error' out/build-core.log
          {
            echo '### The Rust core'
            echo '```'
            grep -E '^(BUILD|ALIGN|SIZE|SECTION|NEEDED|DRIVER|TESTS|CLIPPY|BINDINGS|SIGNATURE)' out/build-core.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cp lab/olc-ffi/android/core/readelf-*.txt out/ 2> /dev/null
          [ $rc -eq 0 ] || { tail -60 out/build-core.log; exit $rc; }
          if grep -q '^SIGNATURE differs' out/build-core.log; then exit 1; fi
          test -f lab/olc-ffi/android/src/main/jniLibs/x86_64/libghostlane_core.so
          test -f lab/olc-ffi/android/src/main/jniLibs/arm64-v8a/libghostlane_core.so

      - name: Save the cargo cache
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            xrs/target
          key: olc-ffi-android-${{ env.XRS_COMMIT }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: The lab app and its test APK
        run: |
          set -euo pipefail
          ./gradlew -p lab/olc-ffi/android assembleDebug assembleDebugAndroidTest --stacktrace 2>&1 | tee out/gradle.log | tail -25
          app=$(find lab/olc-ffi/android/build/outputs/apk/debug -name '*-debug.apk' | head -1)
          unzip -l "$app" | grep 'lib/' | tee out/apk-libs.txt
          grep -q 'lib/x86_64/libghostlane_core.so' out/apk-libs.txt
          grep -q 'lib/x86_64/libjnidispatch.so' out/apk-libs.txt
          grep -q 'lib/x86_64/libolcffidriver.so' out/apk-libs.txt
          echo "APK $(basename "$app"): $(wc -c < "$app") bytes" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Wait for the T1 host
        id: t1wait
        run: |
          set -euo pipefail
          for _ in $(seq 1 300); do
            [ -s "$T1_CONFIG" ] && break
            if ! pgrep -f 'TestT1Host' > /dev/null; then echo "the T1 host ended:"; tail -40 out/t1-host.log; exit 1; fi
            sleep 2
          done
          [ -s "$T1_CONFIG" ] || { echo "no T1 host within 10 min"; tail -40 out/t1-host.log; exit 1; }
          cat "$T1_CONFIG"; echo

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator action runs each line of `script` in its own `sh -c`:
      # the run is one line, and its environment comes from GITHUB_ENV and
      # the step's env.
      - name: Instrumented tests (x86_64, 4 KiB pages)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 900
          # A phone's 4 GB: at the default 2 GB the 16 KiB-page image's
          # low-memory killer took the test process (run 43678263588).
          ram-size: 4096M
          script: bash lab/olc-ffi/android/run-emulator-tests.sh out/emulator

      - name: The relief tests, CallSequenceTest and the control on the 16 KiB-page image
        if: ${{ !cancelled() && steps.t1wait.outcome == 'success' }}
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # CallSequenceTest's process died once here of a SIGSEGV in ART's
          # JIT code (run 43681797712): three of it, between three of the
          # control without the core (ControlTest).
          LAB_RUNS: rust calls1 control1 calls2 control2 calls3 control3
        with:
          api-level: ${{ env.EMULATOR_API }}
          arch: x86_64
          target: google_apis_ps16k
          disable-animations: true
          emulator-boot-timeout: 900
          # A phone's 4 GB: at the default 2 GB the 16 KiB-page image's
          # low-memory killer took the test process (run 43678263588).
          ram-size: 4096M
          script: bash lab/olc-ffi/android/run-emulator-tests.sh out/emulator-16k

      - name: Summary
        if: always()
        run: |
          {
            for d in emulator emulator-16k; do
              [ -f "out/$d/results.txt" ] || { echo "### $d: no results"; continue; }
              echo "### Instrumented tests ($d)"
              echo '```'
              cat "out/$d/results.txt"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Stop the T1 host
        if: always()
        run: |
          set +e
          [ -n "${T1_CONFIG:-}" ] && touch "$T1_CONFIG.stop"
          for _ in $(seq 1 20); do pgrep -f 'TestT1Host' > /dev/null || break; sleep 1; done
          pkill -f 'TestT1Host'
          [ -f "$T1_CONFIG.server.log" ] && cp "$T1_CONFIG.server.log" out/server.log
          tail -20 out/t1-host.log
          [ -f out/server.log ] && tail -30 out/server.log
          exit 0

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: olc-ffi-android
          path: out/
          retention-days: 14
