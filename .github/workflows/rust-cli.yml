name: Rust CLI

# The Linux CLI in Rust (cli/Cargo.toml). Two jobs:
#
#   - the program by itself: format, build, tests and clippy with warnings
#     denied, on the toolchain cli/rust-toolchain.toml names and with the
#     committed cli/Cargo.lock (--locked everywhere);
#   - the program for the three architectures the release ships (static
#     musl), run: K11, the 32-bit one under qemu-user.
#
# cli/Cargo.lock is committed. When it is missing or behind the manifests, the
# first job writes the one cargo resolves, prints it in its log between two
# marker lines, goes on with it so that the other steps still say what they
# find, and fails at its end: the printed file is the one to commit.
#
# Nothing here signs, uploads, publishes or starts another workflow.
#
# On a push or a pull request into rust/all that touches cli/ or this file,
# and by hand.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - rust/all
    paths:
      - cli/**
      - .github/workflows/rust-cli.yml
      - scripts/build-hev-linux.sh
  push:
    # branches, so that a tag (whose push no path filter reads) starts nothing
    branches:
      - "**"
    paths:
      - cli/**
      - .github/workflows/rust-cli.yml
      - scripts/build-hev-linux.sh

permissions:
  contents: read

concurrency:
  # A push carries no PR number, and without the ref every branch would share
  # one group and cancel the others' runs.
  group: rust-cli-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  rust:
    name: Format, build, tests, clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - name: The toolchain cli/rust-toolchain.toml names
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel *= *"\(.*\)" *$/\1/p' rust-toolchain.toml)"
          [ -n "$toolchain" ] || { echo "::error::cli/rust-toolchain.toml names no channel"; exit 1; }
          rustup toolchain install "$toolchain" --profile minimal --component clippy --component rustfmt --no-self-update
          # run from cli/, cargo is that toolchain's
          version="$(cargo --version)"
          echo "$version"
          case "$version" in
            "cargo ${toolchain} "*) ;;
            *) echo "::error::cargo is not ${toolchain} in cli/"; exit 1 ;;
          esac
      - name: The lock file
        id: lock
        run: |
          set -euo pipefail
          state=current
          if [ ! -f Cargo.lock ]; then
            state=missing
          elif ! cargo metadata --locked --format-version 1 > /dev/null 2>&1; then
            state=stale
          fi
          if [ "$state" != current ]; then
            # written or completed here, so that the steps below still say
            # what they find; the job fails at its end
            cargo metadata --format-version 1 > /dev/null
            echo "::error::cli/Cargo.lock is ${state}: commit the file printed in the log of this step"
            echo '----- BEGIN Cargo.lock -----'
            cat Cargo.lock
            echo '----- END Cargo.lock -----'
          fi
          echo "state=${state}" >> "$GITHUB_OUTPUT"
      - name: Format
        if: ${{ !cancelled() }}
        run: cargo fmt --all --check
      - name: Build
        if: ${{ !cancelled() }}
        run: cargo build --locked --workspace
      # every test of every crate, though an earlier one failed: one run says all
      - name: Tests
        if: ${{ !cancelled() }}
        run: cargo test --locked --workspace --no-fail-fast
      - name: Clippy, warnings denied
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: The lock file is committed and current
        if: ${{ !cancelled() && steps.lock.outputs.state != 'current' }}
        env:
          STATE: ${{ steps.lock.outputs.state }}
        run: |
          echo "::error::cli/Cargo.lock is ${STATE:-unread}: see the step 'The lock file'"
          exit 1

  # The program for the three architectures the release ships, as the release
  # builds it (static, musl, the C of ring from the core's cross compiler), and
  # run: K11, the 32-bit program under qemu-user, and the 64-bit ones where the
  # runner can (amd64 natively, arm64 under qemu-user). The engine beside it is
  # the release job's and the PR Checks job's.
  cross:
    name: ${{ matrix.target }} runs
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ""
          - target: aarch64-unknown-linux-musl
            runner: qemu-aarch64-static
          - target: armv7-unknown-linux-musleabihf
            runner: qemu-arm-static
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: The toolchain cli/rust-toolchain.toml names, and the cross compiler
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel *= *"\(.*\)" *$/\1/p' cli/rust-toolchain.toml)"
          [ -n "$toolchain" ] || { echo "::error::cli/rust-toolchain.toml names no channel"; exit 1; }
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang lld llvm qemu-user-static
          bash scripts/build-hev-linux.sh --toolchain "$RUNNER_TEMP/musl" "$TARGET" > "$RUNNER_TEMP/cross.env"
          cat "$RUNNER_TEMP/cross.env" >> "$GITHUB_ENV"
      - name: Build for the target
        working-directory: cli
        env:
          TARGET: ${{ matrix.target }}
          GHOSTLANE_VERSION: 0.0.0
        run: |
          set -euo pipefail
          rustup target add "$TARGET"
          cargo build --locked --release --target "$TARGET"
          file "target/$TARGET/release/ghostlane" || true
      - name: It runs
        working-directory: cli
        env:
          TARGET: ${{ matrix.target }}
          RUNNER: ${{ matrix.runner }}
        run: |
          set -euo pipefail
          program="target/$TARGET/release/ghostlane"
          # a static program: nothing is asked of the runner's libc
          if readelf -l "$program" | grep -q 'Requesting program interpreter'; then
            echo "::error::$program asks for a program interpreter; it is not static"
            exit 1
          fi
          ${RUNNER:+"$RUNNER"} "$program" version --json | tee "$RUNNER_TEMP/version.json"
          grep -q '"version": "0.0.0"' "$RUNNER_TEMP/version.json"
          ${RUNNER:+"$RUNNER"} "$program" help > /dev/null
