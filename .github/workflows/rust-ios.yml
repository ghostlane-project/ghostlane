name: Rust core for iOS

# The iPhone's packet tunnel extension's engines, run on a Mac: CoreEngine,
# OlcrtcEngine, DirectResolver and TunArrangement, compiled unchanged from
# iosApp/PacketTunnel (included, never copied, so a change there runs here)
# into a host program (iosApp/Tests/EngineHost) against the darwin slice of
# ghostlane-core at the pin. scripts/test-ios-engine-on-mac.sh says what it
# compiles and checks:
#   starts  every reference core.json the app writes, started as the
#           extension starts it, its SOCKS port and its login, then stopped;
#           one the core must refuse; olcRTC up to its room, and a carrier
#           this build does not carry refused
#   fetch   each iPhone line against a local server of every Xray version
#           the CLI's end-to-ends use (the official macOS builds, by hash):
#           2 MiB down, 1 MiB up; a wrong key or pin reaches nothing
# with the phone's byte budget, and the process's footprint held to the
# limit the extension states for itself.
#
# The darwin library is the Core build's (its cache: commit, toolchain, the
# build script); this workflow builds it only when that is not there, and
# keeps what it built and the UniFFI bindings per commit. A dispatch with
# `pin` runs the same against another commit of the core.
#
# A Mac and no device: nothing signs, uploads, publishes or joins a carrier
# room; there is no secret. A macOS minute costs ten of Linux's, so the Mac
# job waits for the cheap checks and runs only when what it reads changed.
on:
  push:
    branches:
      - rust/all
    paths:
      - .github/workflows/rust-ios.yml
      - scripts/test-ios-engine-on-mac.sh
      - 'iosApp/Tests/EngineHost/**'
      - 'iosApp/PacketTunnel/**'
      - scripts/ghostlane-core-pin.sh
      - scripts/ghostlane-core-resolve.sh
      - scripts/build-ghostlane-core-host.sh
      - 'sharedUI/src/jvmTest/resources/reference-configs/*core-*.json'
      - sharedUI/src/jvmTest/resources/reference-configs/ios-tun-socks-lossy.json
      - scripts/xray-servers.txt
  pull_request:
    branches:
      - rust/all
    paths:
      - .github/workflows/rust-ios.yml
      - scripts/test-ios-engine-on-mac.sh
      - 'iosApp/Tests/EngineHost/**'
      - 'iosApp/PacketTunnel/**'
      - scripts/ghostlane-core-pin.sh
      - scripts/ghostlane-core-resolve.sh
      - scripts/build-ghostlane-core-host.sh
      - 'sharedUI/src/jvmTest/resources/reference-configs/*core-*.json'
      - sharedUI/src/jvmTest/resources/reference-configs/ios-tun-socks-lossy.json
      - scripts/xray-servers.txt
  workflow_dispatch:
    inputs:
      pin:
        description: Run against this commit of the core (40 hex) instead of the pin in scripts/ghostlane-core-pin.sh
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: rust-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  PIN: ${{ github.event_name == 'workflow_dispatch' && inputs.pin || '' }}
  # What the Mac job runs: starts, fetch or all.
  STAGE: all

jobs:
  harness:
    name: The harness's own parts (no Mac)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: It parses, and shellcheck has nothing to say
        run: |
          set -euo pipefail
          shellcheck --version | sed -n 2p
          bash -n scripts/test-ios-engine-on-mac.sh
          shellcheck -x scripts/test-ios-engine-on-mac.sh
          python3 -I -m py_compile iosApp/Tests/EngineHost/lines.py iosApp/Tests/EngineHost/local_servers.py

      - name: The plan, the lines, the direct rules, the Xray list
        run: |
          set -euo pipefail
          bash scripts/test-ios-engine-on-mac.sh selftest
          {
            echo '### What the Mac compiles and holds it to'
            echo '```'
            bash scripts/test-ios-engine-on-mac.sh plan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  mac:
    name: The extension's engines on a Mac
    needs: harness
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The release's Xcode (release.yml, build-ios), as PR Checks' iPhone
      # tunnel extension job selects it.
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^26.0'

      - name: The commit of the core
        run: bash scripts/ghostlane-core-resolve.sh "$PIN" >> "$GITHUB_ENV"

      # The Core build's cache first; then what this workflow built itself.
      - name: Restore the darwin library
        id: core-cache
        uses: actions/cache/restore@v6
        with:
          path: out/apple
          key: core-build-apple-${{ env.GHOSTLANE_CORE_COMMIT }}-rust-${{ env.GHOSTLANE_CORE_TOOLCHAIN }}-${{ hashFiles('scripts/build-ghostlane-core-host.sh') }}
          restore-keys: rust-ios-darwin-${{ env.GHOSTLANE_CORE_COMMIT }}-rust-${{ env.GHOSTLANE_CORE_TOOLCHAIN }}-${{ hashFiles('scripts/build-ghostlane-core-host.sh') }}

      - name: The darwin library (kept when it came from a cache)
        id: core
        env:
          GHOSTLANE_CORE_PIN_OVERRIDE: ${{ env.PIN }}
          GHOSTLANE_CORE_SRC: ${{ runner.temp }}/core-src
        run: |
          set +e -uo pipefail
          bash scripts/build-ghostlane-core-host.sh out/apple aarch64-apple-darwin > out-core.log 2>&1
          rc=$?
          grep -E '^(PIN|KEPT|COMPILED|BUILD|SIZE|BORING|FAILED) ' out-core.log out/apple/report.txt
          [ "$rc" -eq 0 ] || { tail -n 80 out-core.log; exit "$rc"; }
          set -e
          echo "compiled=$(cat out/apple/compiled.txt)" >> "$GITHUB_OUTPUT"
          ls -l out/apple/lib/aarch64-apple-darwin/libghostlane_core.a

      - name: Keep the darwin library this run built
        if: steps.core.outputs.compiled != '0'
        uses: actions/cache/save@v6
        with:
          path: out/apple
          key: rust-ios-darwin-${{ env.GHOSTLANE_CORE_COMMIT }}-rust-${{ env.GHOSTLANE_CORE_TOOLCHAIN }}-${{ hashFiles('scripts/build-ghostlane-core-host.sh') }}

      - name: Restore the UniFFI bindings
        id: bindings-cache
        uses: actions/cache/restore@v6
        with:
          path: out/apple/bindings
          key: rust-ios-uniffi-${{ env.GHOSTLANE_CORE_COMMIT }}-rust-${{ env.GHOSTLANE_CORE_TOOLCHAIN }}-v1

      - name: The UniFFI bindings (olc-ffi's uniffi-bindgen, once per commit)
        env:
          GHOSTLANE_CORE_SRC: ${{ runner.temp }}/core-src
        run: bash scripts/test-ios-engine-on-mac.sh bindings out/apple

      - name: Keep the UniFFI bindings
        if: steps.bindings-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: out/apple/bindings
          key: rust-ios-uniffi-${{ env.GHOSTLANE_CORE_COMMIT }}-rust-${{ env.GHOSTLANE_CORE_TOOLCHAIN }}-v1

      - name: The official Xray servers for macOS, by hash
        if: env.STAGE != 'starts'
        run: bash scripts/test-ios-engine-on-mac.sh xray "$RUNNER_TEMP/xray"

      - name: Run the engines
        run: |
          set +e -uo pipefail
          bash scripts/test-ios-engine-on-mac.sh run out/apple "$RUNNER_TEMP/engine-host" "$STAGE" "$RUNNER_TEMP/xray" 2>&1 | tee out-engine.log
          rc=${PIPESTATUS[0]}
          {
            echo "### The extension's engines on a Mac ($STAGE)"
            echo '```'
            grep -E '^(core|limit): ' out-engine.log
            grep -E '^(ok  |FAIL|known|note) |^     (known|diagnosis)' out-engine.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: The extension's log, on a failure
        if: failure()
        run: log show --last 20m --style compact --info --debug --predicate 'subsystem == "org.proofkit.app"' | tail -n 300
