name: Lab (macOS tunnel)

# Not a check and never merged: a branch of its own that asks a real Mac what
# the desktop's tunnel code can only assume from here. Runs on a push to it.
on:
  push:
    branches: [lab/macos-tunnel]

permissions:
  contents: read

jobs:
  lab:
    name: A Mac, asked
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      SINGBOX_VERSION: "1.13.14"
    steps:
      - uses: actions/checkout@v7

      - name: The pinned sing-box, for this Mac
        run: |
          arch="$(uname -m)"; [ "$arch" = "x86_64" ] && arch=amd64
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-darwin-${arch}.tar.gz" -o sb.tgz
          tar xzf sb.tgz
          cp "sing-box-${SINGBOX_VERSION}-darwin-${arch}/sing-box" "$RUNNER_TEMP/sing-box"
          "$RUNNER_TEMP/sing-box" version | head -3

      - name: The block, a tunnel behind it, and where names go
        run: sudo bash lab/macos-hold.sh "$RUNNER_TEMP/sing-box" "$USER"
