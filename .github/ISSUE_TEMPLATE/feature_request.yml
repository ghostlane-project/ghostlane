name: Feature request
description: Something the app should do and does not
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that the app makes hard or impossible?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional. A problem described well is more useful than a solution described well.
  - type: dropdown
    id: platform
    attributes:
      label: Platforms this is about
      multiple: true
      options: [Android, iOS, macOS, Windows, Linux, All of them]
