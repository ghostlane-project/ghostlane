[package]
name = "alps-lab-server"
version = "0.1.0"
edition = "2021"
publish = false
description = "Lab only: a BoringSSL TLS 1.3 server that accepts ALPS for h2, as Google's front ends do, and logs what each client sent"

# Its own workspace: nothing above it is part of the build.
[workspace]

[dependencies]
# The versions xray-rust's lockfile carries (olc-rtc's `boring` feature).
boring = "=5.5.0"
boring-sys = "=5.5.0"
foreign-types = "0.5"
libc = "0.2"

[profile.release]
debug = false
